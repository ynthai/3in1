<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
      position: relative;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }

    .removed {
      opacity: 0;
    }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
const gridSize = 6;
const gameContainer = document.getElementById('game-container');
let tiles = [];
let selectedTile = null;

// Преобразование в 2D массив
function to2D(arr) {
  return arr.reduce((result, item, index) => {
    const row = Math.floor(index / gridSize);
    if (!result[row]) result[row] = [];
    result[row].push(item);
    return result;
  }, []);
}

// Проверка L/T-образных совпадений
function findMatches(matrix) {
  const matches = new Set();
  
  for (let row = 0; row < gridSize; row++) {
    for (let col = 0; col < gridSize; col++) {
      const current = matrix[row][col];
      if (!current) continue;
      
      // Проверка T-образных
      if (row > 1 && col > 0 && col < gridSize - 1) {
        const top = matrix[row-1][col];
        const left = matrix[row][col-1];
        const right = matrix[row][col+1];
        if (current === top && current === left && current === right) {
          matches.add(matrix[row-1][col]);
          matches.add(current);
          matches.add(left);
          matches.add(right);
        }
      }
      
      // Проверка L-образных
      if (row > 0 && col > 0) {
        const up = matrix[row-1][col];
        const left = matrix[row][col-1];
        const diag = matrix[row-1][col-1];
        if (current === up && current === left && current === diag) {
          matches.add(current);
          matches.add(up);
          matches.add(left);
          matches.add(diag);
        }
      }
    }
  }
  
  return [...matches];
}

// Удаление плиток с анимацией
function removeTiles(matchedTiles) {
  matchedTiles.forEach(tile => {
    tile.classList.add('removed');
  });
  
  setTimeout(() => {
    matchedTiles.forEach(tile => {
      const index = tiles.indexOf(tile);
      if (index > -1) tiles.splice(index, 1);
      tile.remove();
    });
    checkAndFill();
  }, 500);
}

// Проверка и заполнение
async function checkAndFill() {
  let matrix = to2D(tiles);
  let matches = findMatches(matrix);
  
  if (matches.length >= 3) {
    removeTiles(matches);
    await new Promise(r => setTimeout(r, 600));
    checkAndFill();
  } else {
    // Сдвиг плиток вниз
    for (let col = 0; col < gridSize; col++) {
      for (let row = gridSize - 1; row >= 0; row--) {
        const tile = matrix[row][col];
        if (!tile) continue;
        let dropRow = row;
        while (dropRow < gridSize - 1 && !matrix[dropRow + 1][col]) {
          dropRow++;
        }
        if (dropRow !== row) {
          const temp = matrix[row][col];
          matrix[row][col] = null;
          matrix[dropRow][col] = temp;
        }
      }
    }
    
    // Заполнение верхних пустот
    for (let col = 0; col < gridSize; col++) {
      for (let row = 0; row < gridSize; row++) {
        if (!matrix[row][col]) {
          const newTile = document.createElement('div');
          newTile.classList.add('tile', getRandomColor(matrix, col));
          newTile.addEventListener('click', selectTile);
          matrix[row][col] = newTile;
          gameContainer.appendChild(newTile);
          tiles = Array.from(gameContainer.children);
        }
      }
    }
    
    // Рекурсивная проверка
    if (findMatches(to2D(tiles)).length > 0) {
      checkAndFill();
    }
  }
}

// Генерация цвета без случайных совпадений
function getRandomColor(matrix, col) {
  const forbiddenColors = new Set();
  for (let row = 0; row < gridSize; row++) {
    if (matrix && matrix[row][col]) {
      forbiddenColors.add(matrix[row][col].classList[1]);
    }
  }
  let color;
  do {
    color = colors[Math.floor(Math.random() * colors.length)];
  } while (forbiddenColors.has(color));
  return color;
}

// Создание сетки
function createGrid() {
  let matrix = Array.from({length: gridSize}, () => []);
  let validGrid = false;
  
  while (!validGrid) {
    tiles = [];
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor(matrix, col));
        tile.addEventListener('click', selectTile);
        matrix[row][col] = tile;
        tiles.push(tile);
      }
    }
    
    if (findMatches(matrix).length === 0) {
      validGrid = true;
    }
  }
  
  tiles.forEach(tile => gameContainer.appendChild(tile));
}

// Выбор плитки
function selectTile(e) {
  if (selectedTile === e.target) return;
  
  if (!selectedTile) {
    selectedTile = e.target;
    selectedTile.style.border = '2px solid #000';
  } else {
    const currentTile = e.target;
    
    // Проверка на соседние плитки
    const selectedPos = Array.from(gameContainer.children).indexOf(selectedTile);
    const currentPos = Array.from(gameContainer.children).indexOf(currentTile);
    
    const dx = Math.abs(selectedPos % gridSize - currentPos % gridSize);
    const dy = Math.abs(Math.floor(selectedPos / gridSize) - Math.floor(currentPos / gridSize));
    
    if (dx + dy === 1) {
      // Меняем классы
      const temp = selectedTile.classList[1];
      selectedTile.classList.replace(selectedTile.classList[1], currentTile.classList[1]);
      currentTile.classList.replace(currentTile.classList[1], temp);
      
      // Проверяем совпадения
      const matrix = to2D(tiles);
      const newMatches = findMatches(matrix);
      
      if (newMatches.length >= 3) {
        removeTiles(newMatches);
      } else {
        // Отменяем ход, если нет совпадений
        selectedTile.classList.replace(currentTile.classList[1], temp);
        currentTile.classList.replace(temp, currentTile.classList[1]);
      }
    }
    
    selectedTile.style.border = '';
    selectedTile = null;
  }
}

createGrid();
</script>

</body>
</html>
