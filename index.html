<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .tile:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }

    .falling { transform: translateY(-50px); }
    .vanishing { opacity: 0; }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let grid = Array(gridSize).fill().map(() => Array(gridSize));
  let selectedTile = null;

  // Create the game grid
  function createGrid() {
    tiles = [];
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor());
        tile.dataset.row = row;
        tile.dataset.col = col;
        tile.addEventListener('click', selectTile);
        gameContainer.appendChild(tile);
        tiles.push(tile);
        grid[row][col] = tile;
      }
    }
  }

  // Get a random color from the colors array
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Select a tile to swap
  function selectTile(e) {
    if (selectedTile && selectedTile !== e.target) {
      swapTiles(selectedTile, e.target);
      selectedTile = null;
      checkMatches();
    } else {
      selectedTile = e.target;
    }
  }

  async function swapTiles(tileA, tileB) {
    const tempColor = tileA.classList[1];
    tileA.classList.replace(tileA.classList[1], tileB.classList[1]);
    tileB.classList.replace(tileB.classList[1], tempColor);
    
    // Обновляем grid
    const [aRow, aCol] = getTilePos(tileA);
    const [bRow, bCol] = getTilePos(tileB);
    grid[aRow][aCol] = tileB;
    grid[bRow][bCol] = tileA;
  }

  function getTilePos(tile) {
    return [parseInt(tile.dataset.row), parseInt(tile.dataset.col)];
  }

  async function checkMatches() {
    const matches = findMatches();
    if (matches.length) {
      await removeMatches(matches);
      await dropTiles();
      await refillGrid();
      await checkMatches(); // Проверка новых совпадений
    }
  }

  function findMatches() {
    const matches = new Set();
    
    // Горизонтальные линии
    for (let row = 0; row < gridSize; row++) {
      let currentColor = null;
      let count = 0;
      let startCol = 0;
      for (let col = 0; col < gridSize; col++) {
        const color = grid[row][col].classList[1];
        if (color === currentColor) count++;
        else {
          if (count >= 2) addMatchRange(row, startCol, row, col-1);
          currentColor = color;
          count = 1;
          startCol = col;
        }
      }
      if (count >= 2) addMatchRange(row, startCol, row, gridSize-1);
    }

    // Вертикальные линии
    for (let col = 0; col < gridSize; col++) {
      let currentColor = null;
      let count = 0;
      let startRow = 0;
      for (let row = 0; row < gridSize; row++) {
        const color = grid[row][col].classList[1];
        if (color === currentColor) count++;
        else {
          if (count >= 2) addMatchRange(startRow, col, row-1, col);
          currentColor = color;
          count = 1;
          startRow = row;
        }
      }
      if (count >= 2) addMatchRange(startRow, col, gridSize-1, col);
    }

    function addMatchRange(r1, c1, r2, c2) {
      for (let row = r1; row <= r2; row++) {
        for (let col = c1; col <= c2; col++) {
          matches.add(grid[row][col]);
        }
      }
    }

    return Array.from(matches);
  }

  async function removeMatches(matches) {
    matches.forEach(tile => tile.classList.add('vanishing'));
    await new Promise(resolve => setTimeout(resolve, 500));
    matches.forEach(tile => {
      const [row, col] = getTilePos(tile);
      grid[row][col] = null;
      tile.remove();
    });
    tiles = tiles.filter(tile => !matches.includes(tile));
  }

  async function dropTiles() {
    for (let col = 0; col < gridSize; col++) {
      const columnTiles = [];
      for (let row = 0; row < gridSize; row++) {
        if (grid[row][col]) columnTiles.push(grid[row][col]);
      }
      for (let row = 0; row < columnTiles.length; row++) {
        const tile = columnTiles[row];
        const targetRow = gridSize - row - 1;
        tile.style.transform = `translateY(${targetRow - row} * 50px)`;
        tile.classList.add('falling');
      }
      await new Promise(resolve => setTimeout(resolve, 500));
      for (let row = 0; row < columnTiles.length; row++) {
        const tile = columnTiles[row];
        const targetRow = gridSize - row - 1;
        grid[targetRow][col] = tile;
        tile.style.transform = '';
        tile.style.gridRow = targetRow + 1;
        tile.style.gridColumn = col + 1;
      }
    }
  }

  async function refillGrid() {
    for (let col = 0; col < gridSize; col++) {
      for (let row = 0; row < gridSize; row++) {
        if (!grid[row][col]) {
          const newTile = document.createElement('div');
          newTile.classList.add('tile', getRandomColor());
          newTile.dataset.row = row;
          newTile.dataset.col = col;
          newTile.addEventListener('click', selectTile);
          gameContainer.appendChild(newTile);
          grid[row][col] = newTile;
          tiles.push(newTile);
          newTile.style.transform = 'translateY(-50px)';
          newTile.classList.add('falling');
          await new Promise(resolve => setTimeout(resolve, 500));
          newTile.style.transform = '';
        }
      }
    }
  }

  createGrid();
</script>

</body>
</html>
