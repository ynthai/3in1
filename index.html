<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            grid-template-rows: repeat(6, 50px);
            gap: 2px;
        }

        .cell {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .cell.empty {
            background-color: #ddd;
        }

        .cell.red { background-color: #ff4d4d; }
        .cell.blue { background-color: #4d79ff; }
        .cell.green { background-color: #4dff4d; }
        .cell.yellow { background-color: #ffff4d; }
        .cell.purple { background-color: #b34dff; }

        .cell.match {
            animation: fadeOut 0.5s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.5); }
        }

        .cell.fall {
            animation: fall 0.5s ease-in-out;
        }

        @keyframes fall {
            from { transform: translateY(-50px); }
            to { transform: translateY(0); }
        }
    </style>
</head>
<body>

<div id="game-board" class="board"></div>

<script>
    const boardSize = 6;
    const colors = ['red', 'blue', 'green', 'yellow', 'purple'];

    let gameBoard = [];
    let isCheckingMatches = false;

    // Генерация случайного цвета
    function getRandomColor() {
        return colors[Math.floor(Math.random() * colors.length)];
    }

    // Создание игрового поля
    function generateBoard() {
        const board = [];
        for (let row = 0; row < boardSize; row++) {
            board[row] = [];
            for (let col = 0; col < boardSize; col++) {
                board[row][col] = getRandomColor();
            }
        }
        return board;
    }

    // Отрисовка игрового поля
    function drawBoard(board) {
        const boardElement = document.getElementById('game-board');
        boardElement.innerHTML = '';
        for (let row = 0; row < boardSize; row++) {
            for (let col = 0; col < boardSize; col++) {
                const cell = document.createElement('div');
                cell.classList.add('cell', board[row][col]);
                cell.dataset.row = row;
                cell.dataset.col = col;
                boardElement.appendChild(cell);
            }
        }
    }

    // Проверка совпадений
    function checkMatches(board) {
        const matches = [];

        // Проверка горизонтальных совпадений
        for (let row = 0; row < boardSize; row++) {
            for (let col = 0; col < boardSize - 2; col++) {
                if (board[row][col] && board[row][col] === board[row][col + 1] && board[row][col] === board[row][col + 2]) {
                    matches.push({ row: row, col: col });
                    matches.push({ row: row, col: col + 1 });
                    matches.push({ row: row, col: col + 2 });
                }
            }
        }

        // Проверка вертикальных совпадений
        for (let col = 0; col < boardSize; col++) {
            for (let row = 0; row < boardSize - 2; row++) {
                if (board[row][col] && board[row][col] === board[row + 1][col] && board[row][col] === board[row + 2][col]) {
                    matches.push({ row: row, col: col });
                    matches.push({ row: row + 1, col: col });
                    matches.push({ row: row + 2, col: col });
                }
            }
        }

        return matches;
    }

    // Удаление совпадений
    function removeMatches(matches, board) {
        matches.forEach(match => {
            const { row, col } = match;
            board[row][col] = null;
            const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
            if (cell) {
                cell.classList.add('match');
                setTimeout(() => {
                    cell.classList.remove('match');
                    cell.classList.add('empty');
                }, 500);
            }
        });

        // Сдвиг элементов вниз
        for (let col = 0; col < boardSize; col++) {
            let emptyRow = boardSize - 1;
            for (let row = boardSize - 1; row >= 0; row--) {
                if (board[row][col]) {
                    if (row !== emptyRow) {
                        board[emptyRow][col] = board[row][col];
                        board[row][col] = null;

                        const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                        if (cell) {
                            cell.classList.add('fall');
                            cell.dataset.row = emptyRow;
                            setTimeout(() => cell.classList.remove('fall'), 500);
                        }
                    }
                    emptyRow--;
                }
            }
        }

        // Заполнение пустых ячеек новыми элементами
        for (let col = 0; col < boardSize; col++) {
            for (let row = 0; row < boardSize; row++) {
                if (!board[row][col]) {
                    board[row][col] = getRandomColor();
                    const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                    if (cell) {
                        cell.classList.remove('empty');
                        cell.classList.add(board[row][col]);
                    }
                }
            }
        }
    }

    // Автоматическая проверка совпадений
    function autoCheckMatches() {
        if (isCheckingMatches) return;
        isCheckingMatches = true;

        const matches = checkMatches(gameBoard);
        if (matches.length > 0) {
            removeMatches(matches, gameBoard);
        }

        setTimeout(() => {
            isCheckingMatches = false;
        }, 500);
    }

    // Инициализация игры
    function initGame() {
        gameBoard = generateBoard();
        drawBoard(gameBoard);
        setInterval(autoCheckMatches, 500);
    }

    initGame();
</script>

</body>
</html>
