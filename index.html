<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle & Dragons</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff; /* Minimally soft blue */
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; } /* Soft pink */
    .color2 { background: #b0e0e6; } /* Powder blue */
    .color3 { background: #fff8dc; } /* Lemon chiffon */
    .color4 { background: #d1e231; } /* Lime green */
    .color5 { background: #deb887; } /* Burlywood */
    .color6 { background: #add8e6; } /* Light blue */
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;

  // Create the game grid
  function createGrid() {
    for (let i = 0; i < gridSize * gridSize; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile', getRandomColor());
      tile.setAttribute('draggable', true);
      tile.addEventListener('click', selectTile);
      gameContainer.appendChild(tile);
      tiles.push(tile);
    }
  }

  // Get a random color from the colors array
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Select a tile to swap
  function selectTile(e) {
    if (!selectedTile) {
      selectedTile = e.target;
      selectedTile.style.border = '2px solid #000';
    } else {
      const currentTile = e.target;
      if (selectedTile !== currentTile) {
        const temp = selectedTile.classList[1];
        selectedTile.classList.replace(selectedTile.classList[1], currentTile.classList[1]);
        currentTile.classList.replace(currentTile.classList[1], temp);

        // Check for matches after swapping
        checkAndRemoveMatches();
      }
      selectedTile.style.border = '';
      selectedTile = null;
    }
  }

  // Function to check and remove matches
  function checkAndRemoveMatches() {
    let hasMatches = false;

    // Helper function to check for matches in all directions
    function findMatches() {
      const matches = [];
      const grid = Array.from(tiles).map(tile => tile.classList[1]);

      // Check horizontal matches
      for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize - 2; col++) {
          const index = row * gridSize + col;
          if (
            grid[index] &&
            grid[index] === grid[index + 1] &&
            grid[index] === grid[index + 2]
          ) {
            matches.push(index, index + 1, index + 2);
          }
        }
      }

      // Check vertical matches
      for (let col = 0; col < gridSize; col++) {
        for (let row = 0; row < gridSize - 2; row++) {
          const index = row * gridSize + col;
          if (
            grid[index] &&
            grid[index] === grid[index + gridSize] &&
            grid[index] === grid[index + gridSize * 2]
          ) {
            matches.push(index, index + gridSize, index + gridSize * 2);
          }
        }
      }

      // Check L-shaped matches
      for (let row = 0; row < gridSize - 1; row++) {
        for (let col = 0; col < gridSize - 2; col++) {
          const index = row * gridSize + col;
          if (
            grid[index] &&
            grid[index] === grid[index + 1] &&
            grid[index] === grid[index + gridSize]
          ) {
            matches.push(index, index + 1, index + gridSize);
          }
        }
      }

      // Check T-shaped matches
      for (let row = 1; row < gridSize - 1; row++) {
        for (let col = 1; col < gridSize - 1; col++) {
          const index = row * gridSize + col;
          if (
            grid[index] &&
            grid[index] === grid[index - 1] &&
            grid[index] === grid[index + 1] &&
            grid[index] === grid[index - gridSize]
          ) {
            matches.push(index, index - 1, index + 1, index - gridSize);
          }
        }
      }

      return [...new Set(matches)];
    }

    // Remove matches with animation
    function removeMatches(matches) {
      matches.forEach(index => {
        tiles[index].classList.remove(...tiles[index].classList);
        tiles[index].classList.add('empty');
      });
      setTimeout(() => refillGrid(), 500); // Delay for animation
    }

    // Refill the grid with new tiles
    function refillGrid() {
      tiles.forEach((tile, index) => {
        if (tile.classList.contains('empty')) {
          tile.classList.remove('empty');
          tile.classList.add('tile', getRandomColor());
        }
      });
    }

    // Main loop to check and remove matches
    while (true) {
      const matches = findMatches();
      if (matches.length === 0) break;
      hasMatches = true;
      removeMatches(matches);
      setTimeout(() => {}, 500); // Add delay between checks
    }

    if (!hasMatches) {
      console.log('No matches found.');
    }
  }

  // Initialize the game
  createGrid();
</script>

</body>
</html>
