<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <style>
        /* ... (ваш существующий CSS) ... */
        #enemy-hp {
            width: 100%;
            height: 20px;
            background-color: red;
        }
        #combo-display {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="enemy-hp"></div>
        <div id="combo-display">Combo: 0 (Max: 0)</div>
        <div id="game-board"></div>
    </div>

    <script>
        const boardSize = 5;
        const colors = ['red', 'blue', 'green', 'lightblue', 'yellow'];
        let board = [];
        let currentCombo = 0;
        let maxCombo = 0;

        class Monster {
            constructor(type, hp, skill) {
                this.type = type;
                this.hp = hp;
                this.skill = skill;
            }

            takeDamage(damage) {
                this.hp -= damage;
            }
        }

        const playerMonsters = [
            new Monster('red', 100, () => console.log('Fire skill activated!')),
            new Monster('blue', 120, () => console.log('Water skill activated!')),
            new Monster('green', 110, null)
        ];

        const enemy = new Monster('enemy', 500, null);

        function createBoard() {
            const gameBoard = document.getElementById('game-board');
            for (let i = 0; i < boardSize * boardSize; i++) {
                const orb = document.createElement('div');
                orb.classList.add('orb');
                orb.dataset.color = colors[Math.floor(Math.random() * colors.length)];
                orb.style.backgroundColor = orb.dataset.color;
                orb.draggable = true;
                orb.addEventListener('dragstart', dragStart);
                orb.addEventListener('dragover', dragOver);
                orb.addEventListener('drop', drop);
                gameBoard.appendChild(orb);
                board.push(orb);
            }
        }

        function dragStart(e) {
            e.dataTransfer.setData("text", e.target.id);
        }

        function dragOver(e) {
            e.preventDefault();
        }

        function drop(e) {
            const draggedOrb = document.getElementById(e.dataTransfer.getData("text"));
            const targetOrb = e.target;

            if (draggedOrb && targetOrb && draggedOrb !== targetOrb) {
                const draggedColor = draggedOrb.dataset.color;
                const targetColor = targetOrb.dataset.color;

                draggedOrb.dataset.color = targetColor;
                targetOrb.dataset.color = draggedColor;

                draggedOrb.style.backgroundColor = draggedOrb.dataset.color;
                targetOrb.style.backgroundColor = targetOrb.dataset.color;

                checkMatches();
            }
        }

        function checkMatches() {
            let matches = [];

            // Проверка горизонтальных совпадений
            for (let row = 0; row < boardSize; row++) {
                let match = [];
                for (let col = 0; col < boardSize; col++) {
                    const index = row * boardSize + col;
                    if (match.length === 0 || board[index].dataset.color === match[0].dataset.color) {
                        match.push(board[index]);
                    } else {
                        if (match.length >= 3) matches.push(match);
                        match = [board[index]];
                    }
                }
                if (match.length >= 3) matches.push(match);
            }

            // Проверка вертикальных совпадений
            for (let col = 0; col < boardSize; col++) {
                let match = [];
                for (let row = 0; row < boardSize; row++) {
                    const index = row * boardSize + col;
                    if (match.length === 0 || board[index].dataset.color === match[0].dataset.color) {
                        match.push(board[index]);
                    } else {
                        if (match.length >= 3) matches.push(match);
                        match = [board[index]];
                    }
                }
                if (match.length >= 3) matches.push(match);
            }

            if (matches.length > 0) {
                checkCombos(matches);
                clearMatches(matches);
            }
        }

        function checkCombos(matches) {
            currentCombo += matches.length;
            if (currentCombo > maxCombo) {
                maxCombo = currentCombo;
            }
            updateComboDisplay();
            applyMonsterSkills(matches);
            calculateDamage(matches);
        }

        function applyMonsterSkills(matches) {
            matches.forEach(match => {
                playerMonsters.forEach(monster => {
                    if (monster.type === match[0].dataset.color && monster.skill) {
                        monster.skill();
                    }
                });
            });
        }

        function calculateDamage(matches) {
            let damage = 0;
            matches.forEach(match => {
                if (match.length >= 3) {
                    damage += match.length * 10;
                }
                if (match.length >= 4) {
                    damage += 20;
                }
            });
            damage *= (1 + currentCombo * 0.1);
            enemy.takeDamage(damage);
            updateEnemyHP();
        }

        function clearMatches(matches) {
            matches.forEach(match => {
                match.forEach(orb => {
                    orb.remove();
                });
            });
            setTimeout(() => {
                spawnNewOrbs();
                endTurn();
            }, 500);
        }

        function spawnNewOrbs() {
            const gameBoard = document.getElementById('game-board');
            for (let i = 0; i < boardSize * boardSize; i++) {
                if (!document.querySelector(`#game-board .orb:nth-child(${i+1})`)) {
                    const newOrb = document.createElement('div');
                    newOrb.classList.add('orb');
                    newOrb.dataset.color = colors[Math.floor(Math.random() * colors.length)];
                    newOrb.style.backgroundColor = newOrb.dataset.color;
                    newOrb.draggable = true;
                    newOrb.addEventListener('dragstart', dragStart);
                    newOrb.addEventListener('dragover', dragOver);
                    newOrb.addEventListener('drop', drop);
                    gameBoard.insertBefore(newOrb, gameBoard.children[i]);
                    board[i] = newOrb;
                }
            }
        }

        function updateEnemyHP() {
            const hpBar = document.getElementById('enemy-hp');
            hpBar.style.width = `${(enemy.hp / 500) * 100}%`;
            if (enemy.hp <= 0) {
                alert('You win!');
            }
        }

        function updateComboDisplay() {
            const comboDisplay = document.getElementById('combo-display');
            comboDisplay.textContent = `Combo: ${currentCombo} (Max: ${maxCombo})`;
        }

        function endTurn() {
            currentCombo = 0;
            checkEnemyActions();
        }

        function checkEnemyActions() {
            // Здесь можно добавить действия врага
        }

        createBoard();
    </script>
</body>
</html>
