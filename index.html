<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            grid-gap: 2px;
        }
        .cell {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            border-radius: 5px;
        }
        .red { background-color: red; }
        .blue { background-color: blue; }
        .green { background-color: green; }
        .yellow { background-color: yellow; }
        .purple { background-color: purple; }
        .orange { background-color: orange; }
    </style>
</head>
<body>
    <div id="game-board" class="board"></div>

    <script>
        const ROWS = 6;
        const COLS = 6;
        const COLORS = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];

        let board = [];
        let gameBoard = document.getElementById('game-board');

        // Инициализация игры
        function initGame() {
            board = generateBoard();
            drawBoard(board);
            autoCheckMatches(board);
        }

        // Генерация случайного цвета
        function getRandomColor() {
            return COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        // Создание игрового поля
        function generateBoard() {
            const newBoard = [];
            for (let row = 0; row < ROWS; row++) {
                newBoard[row] = [];
                for (let col = 0; col < COLS; col++) {
                    newBoard[row][col] = getRandomColor();
                }
            }
            return newBoard;
        }

        // Отрисовка игрового поля
        function drawBoard(board) {
            gameBoard.innerHTML = '';
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell', board[row][col]);
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.addEventListener('click', () => handleCellClick(row, col));
                    gameBoard.appendChild(cell);
                }
            }
        }

        // Обработка клика по ячейке
        let selectedCell = null;
        function handleCellClick(row, col) {
            if (selectedCell === null) {
                selectedCell = { row, col };
            } else {
                const { row: r1, col: c1 } = selectedCell;
                const { row: r2, col: c2 } = { row, col };

                if ((Math.abs(r1 - r2) === 1 && c1 === c2) || (Math.abs(c1 - c2) === 1 && r1 === r2)) {
                    swapCells(r1, c1, r2, c2);
                    const matches = checkMatches(board);

                    if (matches.length > 0) {
                        removeMatches(matches, board);
                    } else {
                        swapCells(r1, c1, r2, c2); // Возвращаем обратно, если нет совпадений
                    }
                }
                selectedCell = null;
            }
            drawBoard(board);
        }

        // Обмен элементами на поле
        function swapCells(r1, c1, r2, c2) {
            [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
        }

        // Проверка совпадений
        function checkMatches(board) {
            const rows = board.length;
            const cols = board[0].length;
            const matches = [];

            // Функция для проверки горизонтальных совпадений
            function checkHorizontal(row, col) {
                if (col > cols - 3) return false;
                const color = board[row][col];
                if (color === board[row][col + 1] && color === board[row][col + 2]) {
                    matches.push({ row, col });
                    matches.push({ row, col + 1 });
                    matches.push({ row, col + 2 });
                    return true;
                }
                return false;
            }

            // Функция для проверки вертикальных совпадений
            function checkVertical(row, col) {
                if (row > rows - 3) return false;
                const color = board[row][col];
                if (color === board[row + 1][col] && color === board[row + 2][col]) {
                    matches.push({ row, col });
                    matches.push({ row + 1, col });
                    matches.push({ row + 2, col });
                    return true;
                }
                return false;
            }

            // Функция для проверки "T"-образных совпадений
            function checkTShape(row, col) {
                if (col > 0 && col < cols - 1 && row < rows - 1) {
                    const color = board[row][col];
                    if (
                        color === board[row][col - 1] &&
                        color === board[row][col + 1] &&
                        color === board[row + 1][col]
                    ) {
                        matches.push({ row, col - 1 });
                        matches.push({ row, col });
                        matches.push({ row, col + 1 });
                        matches.push({ row + 1, col });
                        return true;
                    }
                }
                if (row > 0 && row < rows - 1 && col < cols - 1) {
                    const color = board[row][col];
                    if (
                        color === board[row - 1][col] &&
                        color === board[row + 1][col] &&
                        color === board[row][col + 1]
                    ) {
                        matches.push({ row - 1, col });
                        matches.push({ row, col });
                        matches.push({ row + 1, col });
                        matches.push({ row, col + 1 });
                        return true;
                    }
                }
                return false;
            }

            // Проверяем каждую ячейку
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    checkHorizontal(row, col);
                    checkVertical(row, col);
                    checkTShape(row, col);
                }
            }

            return matches;
        }

        // Удаление совпадений
        function removeMatches(matches, board) {
            matches.forEach(({ row, col }) => {
                board[row][col] = null;
            });

            // Сдвиг элементов сверху вниз
            for (let col = 0; col < board[0].length; col++) {
                let emptyRow = board.length - 1;
                for (let row = board.length - 1; row >= 0; row--) {
                    if (board[row][col] !== null) {
                        board[emptyRow][col] = board[row][col];
                        if (row !== emptyRow) {
                            board[row][col] = null;
                        }
                        emptyRow--;
                    }
                }
            }

            // Заполнение пустых ячеек новыми элементами
            for (let col = 0; col < board[0].length; col++) {
                for (let row = 0; row < board.length; row++) {
                    if (board[row][col] === null) {
                        board[row][col] = getRandomColor();
                    }
                }
            }
        }

        // Автоматическая проверка совпадений
        function autoCheckMatches(board) {
            setInterval(() => {
                const matches = checkMatches(board);
                if (matches.length > 0) {
                    removeMatches(matches, board);
                    drawBoard(board);
                }
            }, 500);
        }

        // Запуск игры
        initGame();
    </script>
</body>
</html>
