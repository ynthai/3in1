<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out, opacity 0.5s ease;
      position: relative;
      will-change: transform;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }

    /* Анимации */
    .tile.fade-out {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
    }

    .tile.fall {
      transition: transform 0.3s ease;
    }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;
  let isProcessing = false;

  // Создание сетки
  function createGrid() {
    tiles = [];
    gameContainer.innerHTML = '';
    for (let i = 0; i < gridSize * gridSize; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile');
      tile.style.transform = `translateY(0)`;
      tile.addEventListener('click', selectTile);
      gameContainer.appendChild(tile);
      tiles.push(tile);
    }
    refillGrid();
  }

  // Генерация случайного цвета
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Выбор плитки
  function selectTile(e) {
    if (isProcessing) return;
    if (selectedTile === e.target) return;

    if (!selectedTile) {
      selectedTile = e.target;
      selectedTile.style.border = '2px solid #000';
    } else {
      swapTiles(selectedTile, e.target);
      selectedTile.style.border = '';
      selectedTile = null;
      checkMatches();
    }
  }

  // Проверка совпадений
  function checkMatches() {
    const matches = findMatches();
    if (matches.length >= 3) {
      isProcessing = true;
      removeMatches(matches);
      setTimeout(() => {
        fallTiles();
        setTimeout(() => refillGrid(), 300);
        setTimeout(() => isProcessing = false, 800);
      }, 500);
    }
  }

  // Поиск совпадений
  function findMatches() {
    const matches = [];
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const index = row * gridSize + col;
        const currentColor = tiles[index].classList[1];

        // Горизонтальные проверки
        let horizontalCount = 1;
        for (let c = col + 1; c < gridSize; c++) {
          if (tiles[row * gridSize + c].classList[1] === currentColor) horizontalCount++;
          else break;
        }
        if (horizontalCount >= 3) {
          for (let c = 0; c < horizontalCount; c++) {
            const tileIndex = row * gridSize + col + c;
            if (!matches.includes(tiles[tileIndex])) matches.push(tiles[tileIndex]);
          }
        }

        // Вертикальные проверки
        let verticalCount = 1;
        for (let r = row + 1; r < gridSize; r++) {
          if (tiles[r * gridSize + col].classList[1] === currentColor) verticalCount++;
          else break;
        }
        if (verticalCount >= 3) {
          for (let r = 0; r < verticalCount; r++) {
            const tileIndex = (row + r) * gridSize + col;
            if (!matches.includes(tiles[tileIndex])) matches.push(tiles[tileIndex]);
          }
        }
      }
    }
    return matches;
  }

  // Удаление совпадений
  function removeMatches(matches) {
    matches.forEach(tile => {
      tile.classList.add('fade-out');
      setTimeout(() => {
        tile.classList.remove('fade-out');
        tile.classList.remove(tile.classList[1]);
      }, 500);
    });
  }

  // Падение плиток
  function fallTiles() {
    for (let col = 0; col < gridSize; col++) {
      const tilesInColumn = [];
      for (let row = 0; row < gridSize; row++) {
        const tile = tiles[row * gridSize + col];
        if (tile.classList[1]) tilesInColumn.push(tile);
      }
      tilesInColumn.forEach((tile, index) => {
        const newY = (gridSize - 1 - index) * 50;
        tile.style.transform = `translateY(${newY}px)`;
      });
    }
  }

  // Заполнение пустых мест
  function refillGrid() {
    for (let col = 0; col < gridSize; col++) {
      const tilesInColumn = [];
      for (let row = 0; row < gridSize; row++) {
        const tile = tiles[row * gridSize + col];
        if (tile.classList[1]) tilesInColumn.unshift(tile);
      }
      for (let row = 0; row < gridSize; row++) {
        const tile = tiles[row * gridSize + col];
        if (!tile.classList[1]) {
          const newColor = getRandomColor();
          tile.classList.add(newColor);
          tile.style.transform = `translateY(-${50 * (gridSize)}px)`;
          setTimeout(() => tile.style.transform = 'translateY(0)', 300);
        }
      }
    }
  }

  // Обмен плитками
  function swapTiles(tileA, tileB) {
    const temp = tileA.classList[1];
    tileA.classList.replace(tileA.classList[1], tileB.classList[1]);
    tileB.classList.replace(tileB.classList[1], temp);
  }

  // Инициализация
  createGrid();
</script>

</body>
</html>
