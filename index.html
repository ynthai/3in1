<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
      position: relative;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }

    /* Анимации */
    @keyframes removeTile {
      100% { 
        opacity: 0;
        transform: scale(0);
      }
    }

    @keyframes fallTile {
      from { transform: translateY(-50px); }
      to { transform: translateY(0); }
    }

    .removing {
      animation: removeTile 0.5s forwards;
    }

    .falling {
      animation: fallTile 0.5s forwards;
    }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;

  // Create the game grid
  function createGrid() {
    for (let i = 0; i < gridSize * gridSize; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile', getRandomColor());
      tile.setAttribute('draggable', true);
      tile.addEventListener('click', selectTile);
      gameContainer.appendChild(tile);
      tiles.push(tile);
    }
  }

  // Get a random color
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Select a tile
  function selectTile(e) {
    if (!selectedTile) {
      selectedTile = e.target;
    } else {
      swapTiles(selectedTile, e.target);
      checkMatches();
      selectedTile = null;
    }
  }

  // Swap two tiles
  function swapTiles(tile1, tile2) {
    const temp = tile1.style.order;
    tile1.style.order = tile2.style.order;
    tile2.style.order = temp;
    
    // Swap positions in array
    const index1 = tiles.indexOf(tile1);
    const index2 = tiles.indexOf(tile2);
    [tiles[index1], tiles[index2]] = [tiles[index2], tiles[index1]];
  }

  // Check for matches
  function checkMatches() {
    const matches = [];
    const grid = tiles.map((tile, i) => ({ 
      tile,
      row: Math.floor(i / gridSize),
      col: i % gridSize,
      color: tile.classList[1]
    }));

    // Horizontal matches
    for (let row = 0; row < gridSize; row++) {
      let currentColor;
      let count = 0;
      let startCol;
      for (let col = 0; col < gridSize; col++) {
        const tile = grid[row * gridSize + col];
        if (tile.color === currentColor) {
          count++;
        } else {
          if (count >= 3) {
            for (let i = startCol; i < startCol + count; i++) {
              matches.push(grid[row * gridSize + i].tile);
            }
          }
          currentColor = tile.color;
          count = 1;
          startCol = col;
        }
      }
      if (count >= 3) {
        for (let i = startCol; i < startCol + count; i++) {
          matches.push(grid[row * gridSize + i].tile);
        }
      }
    }

    // Vertical matches
    for (let col = 0; col < gridSize; col++) {
      let currentColor;
      let count = 0;
      let startRow;
      for (let row = 0; row < gridSize; row++) {
        const index = row * gridSize + col;
        const tile = grid[index];
        if (tile.color === currentColor) {
          count++;
        } else {
          if (count >= 3) {
            for (let i = startRow; i < startRow + count; i++) {
              matches.push(grid[i * gridSize + col].tile);
            }
          }
          currentColor = tile.color;
          count = 1;
          startRow = row;
        }
      }
      if (count >= 3) {
        for (let i = startRow; i < startRow + count; i++) {
          matches.push(grid[i * gridSize + col].tile);
        }
      }
    }

    // Process matches
    if (matches.length > 0) {
      handleMatches(matches);
    }
  }

  // Handle matches removal
  async function handleMatches(matches) {
    // Remove matched tiles
    matches.forEach(tile => {
      tile.classList.add('removing');
      tile.style.pointerEvents = 'none';
    });
    
    await new Promise(resolve => setTimeout(resolve, 500));

    // Clear removed tiles
    matches.forEach(tile => {
      tile.remove();
      const index = tiles.indexOf(tile);
      if (index > -1) tiles.splice(index, 1);
    });

    // Rebuild grid with falling tiles
    await fallTiles();
    
    // Fill empty spaces
    await refillGrid();
  }

  // Falling animation
  async function fallTiles() {
    const columns = Array.from({ length: gridSize }, () => []);

    // Collect tiles per column
    tiles.forEach((tile, i) => {
      const col = i % gridSize;
      columns[col].push(tile);
    });

    // Animate falling
    columns.forEach(col => {
      col.forEach((tile, row) => {
        const targetRow = gridSize - 1 - row;
        const currentRow = parseInt(tile.style.order) / gridSize;
        const deltaY = (targetRow - currentRow) * 55; // 50px + 5px gap

        tile.style.transform = `translateY(${deltaY}px)`;
        tile.classList.add('falling');
      });
    });

    await new Promise(resolve => setTimeout(resolve, 500));

    // Reset styles after animation
    tiles.forEach(tile => {
      tile.style.transform = '';
      tile.classList.remove('falling');
      tile.style.order = '';
    });
  }

  // Refill empty spaces
  async function refillGrid() {
    const newTiles = [];

    // Create new tiles for each column
    for (let col = 0; col < gridSize; col++) {
      const columnTiles = tiles.filter((_, i) => i % gridSize === col);
      const emptySpaces = gridSize - columnTiles.length;

      for (let i = 0; i < emptySpaces; i++) {
        const newTile = document.createElement('div');
        newTile.classList.add('tile', getRandomColor());
        newTile.style.order = `${i}`;
        newTiles.push(newTile);
      }
    }

    // Add new tiles
    newTiles.forEach(tile => {
      gameContainer.appendChild(tile);
      tiles.push(tile);
    });

    // Reorganize tiles
    tiles.sort((a, b) => {
      const aPos = a.style.order ? parseInt(a.style.order) : 0;
      const bPos = b.style.order ? parseInt(b.style.order) : 0;
      return aPos - bPos;
    });

    // Reset orders
    tiles.forEach((tile, i) => {
      tile.style.order = '';
      tile.style.transform = '';
      tile.style.pointerEvents = '';
    });
  }

  // Initialize
  createGrid();
</script>

</body>
</html>
