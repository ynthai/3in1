<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-template-rows: repeat(5, 60px);
      gap: 5px;
    }

    .tile {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .red { background-color: #ff5733; color: white; }
    .blue { background-color: #335bff; color: white; }
    .green { background-color: #33ff57; color: white; }
    .yellow { background-color: #ffff33; color: black; }
    .purple { background-color: #b333ff; color: white; }

    .score-board {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .error-animation {
      animation: error-shake 0.3s ease;
    }

    @keyframes error-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    @keyframes fade-out {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0); }
    }
  </style>
</head>
<body>
  <div class="game-container" id="gameContainer"></div>
  <div class="score-board">Score: <span id="score">0</span></div>

  <script>
    const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
    const gridSize = 5;
    let score = 0;

    const gameContainer = document.getElementById('gameContainer');
    const scoreDisplay = document.getElementById('score');

    /**
     * Создает игровое поле с заданным размером.
     */
    function createGrid() {
      for (let i = 0; i < gridSize * gridSize; i++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor());
        tile.dataset.index = i;
        gameContainer.appendChild(tile);
      }
    }

    /**
     * Возвращает случайный цвет из массива colors.
     */
    function getRandomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    let draggedTile = null;

    /**
     * Отключает пролистывание страницы на мобильных устройствах.
     */
    gameContainer.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    /**
     * Обработка перемещения плиток через мышь или сенсорное управление.
     */
    gameContainer.addEventListener('mousedown', (e) => {
      draggedTile = e.target.closest('.tile');
      if (draggedTile) draggedTile.style.opacity = '0.5';
    });

    gameContainer.addEventListener('mousemove', (e) => {
      if (!draggedTile) return;
      const targetTile = document.elementFromPoint(e.clientX, e.clientY);
      if (targetTile && targetTile.classList.contains('tile')) {
        swapTiles(draggedTile, targetTile);
      }
    });

    gameContainer.addEventListener('mouseup', () => {
      if (draggedTile) {
        draggedTile.style.opacity = '1';
        draggedTile = null;
      }
    });

    gameContainer.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      draggedTile = document.elementFromPoint(touch.clientX, touch.clientY);
      if (draggedTile) draggedTile.style.opacity = '0.5';
    });

    gameContainer.addEventListener('touchend', (e) => {
      if (!draggedTile) return;
      const touch = e.changedTouches[0];
      const targetTile = document.elementFromPoint(touch.clientX, touch.clientY);
      if (targetTile && targetTile.classList.contains('tile')) {
        swapTiles(draggedTile, targetTile);
      }
      draggedTile.style.opacity = '1';
      draggedTile = null;
    });

    /**
     * Проверяет, является ли движение допустимым.
     * @param {number} index1 Индекс первой плитки
     * @param {number} index2 Индекс второй плитки
     * @returns {boolean} true, если движение допустимо
     */
    function isValidMove(index1, index2) {
      const row1 = Math.floor(index1 / gridSize);
      const col1 = index1 % gridSize;
      const row2 = Math.floor(index2 / gridSize);
      const col2 = index2 % gridSize;

      return (
        (row1 === row2 && Math.abs(col1 - col2) === 1) || // Горизонтальное перемещение
        (col1 === col2 && Math.abs(row1 - row2) === 1)    // Вертикальное перемещение
      );
    }

    /**
     * Меняет местами две плитки.
     * @param {HTMLElement} tile1 Первая плитка
     * @param {HTMLElement} tile2 Вторая плитка
     */
    function swapTiles(tile1, tile2) {
      const index1 = parseInt(tile1.dataset.index);
      const index2 = parseInt(tile2.dataset.index);

      if (!isValidMove(index1, index2)) {
        tile1.classList.add('error-animation');
        setTimeout(() => tile1.classList.remove('error-animation'), 300);
        return;
      }

      const tempColor = tile1.classList[1];
      tile1.classList.replace(tile1.classList[1], tile2.classList[1]);
      tile2.classList.replace(tile2.classList[1], tempColor);

      checkMatches(index1);
    }

    /**
     * Проверяет наличие совпадений вокруг указанной плитки.
     * @param {number} startIndex Индекс начальной плитки
     */
    function checkMatches(startIndex) {
      const tiles = Array.from(document.querySelectorAll('.tile'));
      const visited = new Set();
      const matches = [];

      const neighbors = getNeighbors(startIndex);

      for (const neighbor of neighbors) {
        const match = findMatch(neighbor, tiles[neighbor].classList[1], visited, tiles);
        if (match.length >= 3) {
          matches.push(...match);
        }
      }

      if (matches.length > 0) {
        removeMatch(matches, tiles);
      }
    }

    /**
     * Возвращает соседние индексы для заданного индекса.
     * @param {number} index Индекс плитки
     * @returns {number[]} Массив соседних индексов
     */
    function getNeighbors(index) {
      const row = Math.floor(index / gridSize);
      const col = index % gridSize;

      const neighbors = [];
      if (row > 0) neighbors.push(index - gridSize); // Верх
      if (row < gridSize - 1) neighbors.push(index + gridSize); // Низ
      if (col > 0) neighbors.push(index - 1); // Лево
      if (col < gridSize - 1) neighbors.push(index + 1); // Право

      return neighbors;
    }

    /**
     * Находит все связанные плитки одного цвета через DFS.
     * @param {number} index Индекс текущей плитки
     * @param {string} color Цвет текущей плитки
     * @param {Set} visited Множество посещенных индексов
     * @param {HTMLElement[]} tiles Массив всех плиток
     * @returns {number[]} Массив индексов совпавших плиток
     */
    function findMatch(index, color, visited, tiles) {
      if (!color || visited.has(index)) return [];
      visited.add(index);

      const matches = [index];
      const directions = [-gridSize, -1, 1, gridSize]; // Вверх, влево, вправо, вниз

      for (const dir of directions) {
        const neighborIndex = index + dir;

        if (
          neighborIndex >= 0 &&
          neighborIndex < tiles.length &&
          tiles[neighborIndex].classList[1] === color
        ) {
          matches.push(...findMatch(neighborIndex, color, visited, tiles));
        }
      }

      return matches;
    }

    /**
     * Удаляет найденные совпадения и добавляет новые плитки.
     * @param {number[]} matches Индексы совпавших плиток
     * @param {HTMLElement[]} tiles Массив всех плиток
     */
    function removeMatch(matches, tiles) {
      const uniqueColors = [...new Set(matches.map((index) => tiles[index].classList[1]))];

      function animateColor(color, delay) {
        setTimeout(() => {
          matches
            .filter((index) => tiles[index].classList[1] === color)
            .forEach((index) => {
              const tile = tiles[index];
              tile.style.animation = 'fade-out 0.5s ease forwards';
              setTimeout(() => {
                tile.classList.remove(tile.classList[1]);
                tile.classList.add(getRandomColor());
                tile.style.animation = '';
              }, 500);
            });
        }, delay);
      }

      let delay = 0;
      uniqueColors.forEach((color) => {
        animateColor(color, delay);
        delay += 500; // Задержка между анимациями
      });

      setTimeout(() => {
        checkMatches(-1); // Проверяем все плитки после удаления
      }, 1000);
    }

    /**
     * Сохраняет прогресс в localStorage.
     */
    function saveProgress() {
      localStorage.setItem('puzzleGameScore', score);
    }

    /**
     * Загружает прогресс из localStorage.
     */
    function loadProgress() {
      const savedScore = localStorage.getItem('puzzleGameScore');
      if (savedScore) {
        score = parseInt(savedScore);
        scoreDisplay.textContent = score;
      }
    }

    window.addEventListener('beforeunload', saveProgress);
    loadProgress();

    createGrid();
  </script>
</body>
</html>
