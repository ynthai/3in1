<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Dragons</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff; /* Minimally soft blue */
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; } /* Soft pink */
    .color2 { background: #b0e0e6; } /* Powder blue */
    .color3 { background: #fff8dc; } /* Lemon chiffon */
    .color4 { background: #d1e231; } /* Lime green */
    .color5 { background: #deb887; } /* Burlywood */
    .color6 { background: #add8e6; } /* Light blue */
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;

  // Создание игрового поля
  function createGrid() {
    let validGrid = false;
    while (!validGrid) {
      tiles = [];
      gameContainer.innerHTML = '';
      for (let i = 0; i < gridSize * gridSize; i++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor());
        tile.setAttribute('draggable', true);
        tile.addEventListener('click', selectTile);
        gameContainer.appendChild(tile);
        tiles.push(tile);
      }
      if (!checkMatches()) {
        validGrid = true;
      } else {
        // Если есть совпадения, пересоздаем поле
        continue;
      }
    }
  }

  // Получение случайного цвета
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Выбор плитки для перемещения
  function selectTile(e) {
    if (!selectedTile) {
      selectedTile = e.target;
      selectedTile.style.border = '2px solid #000';
    } else {
      const currentTile = e.target;
      if (selectedTile !== currentTile && areNeighbors(selectedTile, currentTile)) {
        swapTiles(selectedTile, currentTile);
        selectedTile.style.border = '';
        selectedTile = null;
        checkAndRemoveMatches();
      } else {
        selectedTile.style.border = '';
        selectedTile = null;
      }
    }
  }

  // Проверка соседства плиток
  function areNeighbors(tile1, tile2) {
    const index1 = Array.from(gameContainer.children).indexOf(tile1);
    const index2 = Array.from(gameContainer.children).indexOf(tile2);
    if (Math.abs(index1 - index2) === 1 && Math.floor(index1 / gridSize) === Math.floor(index2 / gridSize)) {
      return true; // Горизонтальные соседи
    } else if (Math.abs(index1 - index2) === gridSize) {
      return true; // Вертикальные соседи
    }
    return false;
  }

  // Обмен плиток
  function swapTiles(tile1, tile2) {
    const temp = tile1.classList[1];
    tile1.classList.replace(tile1.classList[1], tile2.classList[1]);
    tile2.classList.replace(tile2.classList[1], temp);
  }

  // Проверка совпадений
  function checkMatches() {
    const matches = new Set();

    // Проверка горизонтальных совпадений
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col <= gridSize - 3; col++) {
        const firstTile = tiles[row * gridSize + col];
        const secondTile = tiles[row * gridSize + col + 1];
        const thirdTile = tiles[row * gridSize + col + 2];
        if (firstTile.classList[1] === secondTile.classList[1] &&
            secondTile.classList[1] === thirdTile.classList[1]) {
          matches.add(firstTile);
          matches.add(secondTile);
          matches.add(thirdTile);
          findLShape(row, col, firstTile.classList[1], matches);
          findTShape(row, col, firstTile.classList[1], matches);
        }
      }
    }

    // Проверка вертикальных совпадений
    for (let col = 0; col < gridSize; col++) {
      for (let row = 0; row <= gridSize - 3; row++) {
        const firstTile = tiles[row * gridSize + col];
        const secondTile = tiles[(row + 1) * gridSize + col];
        const thirdTile = tiles[(row + 2) * gridSize + col];
        if (firstTile.classList[1] === secondTile.classList[1] &&
            secondTile.classList[1] === thirdTile.classList[1]) {
          matches.add(firstTile);
          matches.add(secondTile);
          matches.add(thirdTile);
          findLShapeVertical(row, col, firstTile.classList[1], matches);
          findTShapeVertical(row, col, firstTile.classList[1], matches);
        }
      }
    }

    return Array.from(matches);
  }

  // Поиск L-образных совпадений
  function findLShape(row, col, color, matches) {
    if (row > 0 && tiles[(row - 1) * gridSize + col]?.classList.contains(color)) {
      matches.add(tiles[(row - 1) * gridSize + col]);
    }
    if (row < gridSize - 1 && tiles[(row + 1) * gridSize + col]?.classList.contains(color)) {
      matches.add(tiles[(row + 1) * gridSize + col]);
    }
  }

  // Поиск T-образных совпадений
  function findTShape(row, col, color, matches) {
    if (row > 0 && tiles[(row - 1) * gridSize + col]?.classList.contains(color) &&
        row < gridSize - 1 && tiles[(row + 1) * gridSize + col]?.classList.contains(color)) {
      matches.add(tiles[(row - 1) * gridSize + col]);
      matches.add(tiles[(row + 1) * gridSize + col]);
    }
  }

  // Поиск L-образных совпадений вертикально
  function findLShapeVertical(row, col, color, matches) {
    if (col > 0 && tiles[row * gridSize + col - 1]?.classList.contains(color)) {
      matches.add(tiles[row * gridSize + col - 1]);
    }
    if (col < gridSize - 1 && tiles[row * gridSize + col + 1]?.classList.contains(color)) {
      matches.add(tiles[row * gridSize + col + 1]);
    }
  }

  // Поиск T-образных совпадений вертикально
  function findTShapeVertical(row, col, color, matches) {
    if (col > 0 && tiles[row * gridSize + col - 1]?.classList.contains(color) &&
        col < gridSize - 1 && tiles[row * gridSize + col + 1]?.classList.contains(color)) {
      matches.add(tiles[row * gridSize + col - 1]);
      matches.add(tiles[row * gridSize + col + 1]);
    }
  }

  // Удаление совпадений
  function removeMatches(matches) {
    matches.forEach(match => {
      match.classList.remove(...match.classList);
      match.classList.add('empty');
    });

    setTimeout(() => {
      applyGravity();
      const remainingMatches = checkMatches();
      if (remainingMatches.length > 0) {
        removeMatches(remainingMatches);
      }
    }, 500); // Задержка для анимации
  }

  // Применение гравитации
  function applyGravity() {
    for (let col = 0; col < gridSize; col++) {
      let emptySpaces = 0;
      for (let row = gridSize - 1; row >= 0; row--) {
        const currentIndex = row * gridSize + col;
        if (tiles[currentIndex].classList.contains('empty')) {
          emptySpaces++;
        } else if (emptySpaces > 0) {
          tiles[currentIndex + emptySpaces * gridSize].classList.replace('empty', tiles[currentIndex].classList[1]);
          tiles[currentIndex].classList.remove(...tiles[currentIndex].classList);
          tiles[currentIndex].classList.add('empty');
        }
      }
    }
    fillEmptySpaces();
  }

  // Заполнение пустых пространств
  function fillEmptySpaces() {
    for (let i = 0; i < gridSize * gridSize; i++) {
      if (tiles[i].classList.contains('empty')) {
        tiles[i].classList.remove('empty');
        tiles[i].classList.add(getRandomColor());
      }
    }
  }

  // Основная функция проверки и удаления совпадений
  function checkAndRemoveMatches() {
    const matches = checkMatches();
    if (matches.length > 0) {
      removeMatches(matches);
    }
  }

  // Инициализация игры
  createGrid();
</script>

</body>
</html>
