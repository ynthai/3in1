<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Dragons</title>
  <style>
    /* [Стили оставлены без изменений] */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;

  // Создание игрового поля
  function createGrid() {
    while (true) {
      let grid = [];
      for (let i = 0; i < gridSize * gridSize; i++) {
        grid.push(getRandomColor());
      }
      if (!hasMatches(grid)) break;
    }
    for (let i = 0; i < gridSize * gridSize; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile', tiles[i]);
      tile.setAttribute('draggable', true);
      tile.addEventListener('click', selectTile);
      gameContainer.appendChild(tile);
      tiles.push(tile);
    }
  }

  // Проверка наличия совпадений при генерации
  function hasMatches(grid) {
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        if (checkMatch(row, col, grid)) return true;
      }
    }
    return false;
  }

  // Выбор плитки
  function selectTile(e) {
    if (!selectedTile) {
      selectedTile = e.target;
      selectedTile.style.border = '2px solid #000';
    } else {
      const currentTile = e.target;
      if (selectedTile !== currentTile && areAdjacent(selectedTile, currentTile)) {
        swapTiles(selectedTile, currentTile);
        setTimeout(() => checkAndRemoveMatches(), 500);
      }
      selectedTile.style.border = '';
      selectedTile = null;
    }
  }

  // Проверка соседства плиток
  function areAdjacent(tile1, tile2) {
    const index1 = Array.from(gameContainer.children).indexOf(tile1);
    const index2 = Array.from(gameContainer.children).indexOf(tile2);
    const row1 = Math.floor(index1 / gridSize);
    const row2 = Math.floor(index2 / gridSize);
    const col1 = index1 % gridSize;
    const col2 = index2 % gridSize;
    return (Math.abs(row1 - row2) + Math.abs(col1 - col2)) === 1;
  }

  // Обмен плиток
  function swapTiles(tile1, tile2) {
    const temp = tile1.classList[1];
    tile1.classList.replace(tile1.classList[1], tile2.classList[1]);
    tile2.classList.replace(tile2.classList[1], temp);
  }

  // Проверка и удаление совпадений
  function checkAndRemoveMatches() {
    let matches = [];
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const match = checkMatch(row, col);
        if (match) matches.push(...match);
      }
    }
    if (matches.length > 0) {
      removeMatches(matches);
      setTimeout(() => dropTiles(), 500);
    } else {
      checkStuck();
    }
  }

  // Проверка совпадений
  function checkMatch(row, col) {
    const color = getColor(row, col);
    if (!color) return null;

    // Проверка горизонтальных совпадений
    let horizontalMatch = [getTileIndex(row, col)];
    for (let i = col + 1; i < gridSize; i++) {
      if (getColor(row, i) === color) horizontalMatch.push(getTileIndex(row, i));
      else break;
    }
    for (let i = col - 1; i >= 0; i--) {
      if (getColor(row, i) === color) horizontalMatch.unshift(getTileIndex(row, i));
      else break;
    }
    if (horizontalMatch.length >= 3) return horizontalMatch;

    // Проверка вертикальных совпадений
    let verticalMatch = [getTileIndex(row, col)];
    for (let i = row + 1; i < gridSize; i++) {
      if (getColor(i, col) === color) verticalMatch.push(getTileIndex(i, col));
      else break;
    }
    for (let i = row - 1; i >= 0; i--) {
      if (getColor(i, col) === color) verticalMatch.unshift(getTileIndex(i, col));
      else break;
    }
    if (verticalMatch.length >= 3) return verticalMatch;

    // Проверка L-образных совпадений
    let lMatch = [];
    if (horizontalMatch.length >= 2 && verticalMatch.length >= 2) {
      lMatch = [...new Set([...horizontalMatch, ...verticalMatch])];
      if (lMatch.length >= 3) return lMatch;
    }

    return null;
  }

  // Удаление совпадений
  function removeMatches(matches) {
    matches.forEach(index => {
      const tile = gameContainer.children[index];
      tile.classList.remove(...colors);
      tile.classList.add('empty');
    });
  }

  // Опускание плиток
  function dropTiles() {
    for (let col = 0; col < gridSize; col++) {
      let emptySpaces = 0;
      for (let row = gridSize - 1; row >= 0; row--) {
        const index = getTileIndex(row, col);
        const tile = gameContainer.children[index];
        if (tile.classList.contains('empty')) {
          emptySpaces++;
        } else if (emptySpaces > 0) {
          swapTiles(tile, gameContainer.children[getTileIndex(row + emptySpaces, col)]);
        }
      }
    }
    fillEmptySpaces();
    setTimeout(() => checkAndRemoveMatches(), 500);
  }

  // Заполнение пустых мест
  function fillEmptySpaces() {
    for (let i = 0; i < gridSize * gridSize; i++) {
      const tile = gameContainer.children[i];
      if (tile.classList.contains('empty')) {
        tile.classList.remove('empty');
        tile.classList.add(getRandomColor());
      }
    }
  }

  // Проверка застревания
  function checkStuck() {
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        if (canMakeMove(row, col)) return;
      }
    }
    shuffleBoard();
  }

  // Перемешивание доски
  function shuffleBoard() {
    for (let i = 0; i < gridSize * gridSize; i++) {
      const randomIndex = Math.floor(Math.random() * (gridSize * gridSize));
      swapTiles(gameContainer.children[i], gameContainer.children[randomIndex]);
    }
    setTimeout(() => checkAndRemoveMatches(), 500);
  }

  // Вспомогательные функции
  function getColor(row, col) {
    const index = getTileIndex(row, col);
    if (index < 0 || index >= gridSize * gridSize) return null;
    return gameContainer.children[index].classList[1];
  }

  function getTileIndex(row, col) {
    return row * gridSize + col;
  }

  function canMakeMove(row, col) {
    const originalColor = getColor(row, col);
    if (originalColor === null) return false;

    // Проверка свапа вправо
    if (col < gridSize - 1) {
      swapTiles(getTileIndex(row, col), getTileIndex(row, col + 1));
      if (checkMatch(row, col) || checkMatch(row, col + 1)) {
        swapTiles(getTileIndex(row, col), getTileIndex(row, col + 1));
        return true;
      }
      swapTiles(getTileIndex(row, col), getTileIndex(row, col + 1));
    }

    // Проверка свапа вниз
    if (row < gridSize - 1) {
      swapTiles(getTileIndex(row, col), getTileIndex(row + 1, col));
      if (checkMatch(row, col) || checkMatch(row + 1, col)) {
        swapTiles(getTileIndex(row, col), getTileIndex(row + 1, col));
        return true;
      }
      swapTiles(getTileIndex(row, col), getTileIndex(row + 1, col));
    }

    return false;
  }

  // Инициализация игры
  createGrid();
</script>

</body>
</html>
