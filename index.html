<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- Устанавливает кодировку документа -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Настройки отображения на мобильных устройствах -->
    <title>Puzzle & Dragons</title> <!-- Заголовок страницы -->
    <style>
        body {
            font-family: Arial, sans-serif; /* Основной шрифт */
            background-color: #f4f4f4; /* Цвет фона страницы */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Полная высота viewport */
        }
        .container {
            text-align: center; /* Центрирование содержимого по горизонтали */
            background-color: white; /* Фон контейнера */
            padding: 20px; /* Внутренние отступы */
            border-radius: 10px; /* Скругление углов */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Тень вокруг блока */
        }
        h1 {
            color: #333; /* Цвет заголовка */
        }
        canvas {
            border: 1px solid #ccc; /* Граница игрового поля */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Puzzle & Dragons</h1> <!-- Главный заголовок игры -->
        <canvas id="gameCanvas" width="300" height="500"></canvas> <!-- Игровое поле -->
        <button id="startButton">Start Game</button> <!-- Кнопка начала игры -->
    </div>

    <script>
        // JavaScript код будет здесь
    </script>

</body>
</html>
