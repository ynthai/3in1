<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle & Dragons</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff; /* Minimally soft blue */
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; } /* Soft pink */
    .color2 { background: #b0e0e6; } /* Powder blue */
    .color3 { background: #fff8dc; } /* Lemon chiffon */
    .color4 { background: #d1e231; } /* Lime green */
    .color5 { background: #deb887; } /* Burlywood */
    .color6 { background: #add8e6; } /* Light blue */
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;

  // Создание игрового поля
  function createGrid() {
    for (let i = 0; i < gridSize * gridSize; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile', getRandomColor());
      tile.setAttribute('draggable', true);
      tile.addEventListener('click', selectTile);
      gameContainer.appendChild(tile);
      tiles.push(tile);
    }
    removeInitialMatches();
  }

  // Получение случайного цвета
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Выбор плитки для свапа
  function selectTile(e) {
    if (!selectedTile) {
      selectedTile = e.target;
      selectedTile.style.border = '2px solid #000';
    } else {
      const currentTile = e.target;
      if (selectedTile !== currentTile) {
        swapTiles(selectedTile, currentTile);
        checkAndRemoveMatches();
      }
      selectedTile.style.border = '';
      selectedTile = null;
    }
  }

  // Свап двух плиток
  function swapTiles(tile1, tile2) {
    const temp = tile1.classList[1];
    tile1.classList.replace(tile1.classList[1], tile2.classList[1]);
    tile2.classList.replace(tile2.classList[1], temp);
  }

  // Проверка и удаление совпадений
  function checkAndRemoveMatches() {
    const matches = findMatches();
    if (matches.length > 0) {
      setTimeout(() => {
        removeMatches(matches);
        dropTiles();
        fillEmptySpaces();
        checkAndRemoveMatches(); // Рекурсивная проверка
      }, 500); // Задержка для анимации
    }
  }

  // Поиск совпадений
  function findMatches() {
    const matches = [];
    const grid = Array.from(tiles).map(tile => tile.classList[1]);

    // Проверка горизонтальных и L/T-образных совпадений
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize - 2; col++) {
        const color = grid[row * gridSize + col];
        if (color && isLShapeMatch(row, col, color) || isTShapeMatch(row, col, color)) {
          matches.push(...getMatchCoordinates(row, col, color));
        }
      }
    }

    // Проверка вертикальных совпадений
    for (let col = 0; col < gridSize; col++) {
      for (let row = 0; row < gridSize - 2; row++) {
        const color = grid[row * gridSize + col];
        if (color && isLShapeMatch(row, col, color) || isTShapeMatch(row, col, color)) {
          matches.push(...getMatchCoordinates(row, col, color));
        }
      }
    }

    return [...new Set(matches)];
  }

  // Проверка L-образных совпадений
  function isLShapeMatch(row, col, color) {
    const indices = [
      [row, col],
      [row, col + 1],
      [row, col + 2],
      [row + 1, col + 2]
    ];
    return indices.every(([r, c]) => isValidIndex(r, c) && tiles[r * gridSize + c]?.classList.contains(color));
  }

  // Проверка T-образных совпадений
  function isTShapeMatch(row, col, color) {
    const indices = [
      [row, col],
      [row, col + 1],
      [row, col + 2],
      [row + 1, col + 1]
    ];
    return indices.every(([r, c]) => isValidIndex(r, c) && tiles[r * gridSize + c]?.classList.contains(color));
  }

  // Получение координат совпадений
  function getMatchCoordinates(row, col, color) {
    const matches = [];
    for (let r = row; r < row + 2; r++) {
      for (let c = col; c < col + 3; c++) {
        if (isValidIndex(r, c) && tiles[r * gridSize + c]?.classList.contains(color)) {
          matches.push(r * gridSize + c);
        }
      }
    }
    return matches;
  }

  // Проверка индекса на валидность
  function isValidIndex(row, col) {
    return row >= 0 && row < gridSize && col >= 0 && col < gridSize;
  }

  // Удаление совпадений
  function removeMatches(matches) {
    matches.forEach(index => {
      tiles[index].classList.remove(...tiles[index].classList);
      tiles[index].classList.add('empty');
    });
  }

  // Опускание плиток
  function dropTiles() {
    for (let col = 0; col < gridSize; col++) {
      for (let row = gridSize - 1; row >= 0; row--) {
        const index = row * gridSize + col;
        if (tiles[index].classList.contains('empty')) {
          for (let r = row - 1; r >= 0; r--) {
            const aboveIndex = r * gridSize + col;
            if (!tiles[aboveIndex].classList.contains('empty')) {
              swapTiles(tiles[index], tiles[aboveIndex]);
              break;
            }
          }
        }
      }
    }
  }

  // Заполнение пустых клеток
  function fillEmptySpaces() {
    for (let i = 0; i < tiles.length; i++) {
      if (tiles[i].classList.contains('empty')) {
        tiles[i].classList.remove('empty');
        tiles[i].classList.add('tile', getRandomColor());
      }
    }
  }

  // Удаление начальных совпадений
  function removeInitialMatches() {
    let hasMatches = true;
    while (hasMatches) {
      const matches = findMatches();
      if (matches.length === 0) {
        hasMatches = false;
      } else {
        removeMatches(matches);
        fillEmptySpaces();
      }
    }
  }

  // Инициализация игры
  createGrid();
</script>

</body>
</html>
