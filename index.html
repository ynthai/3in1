<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Dragons</title>
  <style>
    /* Стили оставлены без изменений */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;

  // Создание игрового поля
  function createGrid() {
    while (true) {
      tiles = [];
      gameContainer.innerHTML = '';
      for (let i = 0; i < gridSize * gridSize; i++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor());
        tile.setAttribute('draggable', true);
        tile.addEventListener('click', selectTile);
        gameContainer.appendChild(tile);
        tiles.push(tile);
      }
      if (!checkMatches()) break; // Пересоздаем пока нет начальных совпадений
    }
  }

  // Получение случайного цвета
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Выбор плитки для обмена
  function selectTile(e) {
    if (!selectedTile) {
      selectedTile = e.target;
      selectedTile.style.border = '2px solid #000';
    } else {
      const currentTile = e.target;
      if (selectedTile !== currentTile) {
        swapTiles(selectedTile, currentTile);
        checkAndResolveMatches();
      }
      selectedTile.style.border = '';
      selectedTile = null;
    }
  }

  // Обмен плиток
  function swapTiles(tile1, tile2) {
    const temp = tile1.classList[1];
    tile1.classList.replace(tile1.classList[1], tile2.classList[1]);
    tile2.classList.replace(tile2.classList[1], temp);
  }

  // Проверка совпадений
  function checkMatches() {
    const matches = [];
    const grid = Array.from(tiles).map(tile => tile.classList[1]);

    // Проверка строк и столбцов
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const color = grid[row * gridSize + col];
        if (!color) continue;

        // Горизонтальные совпадения
        if (col <= gridSize - 3 && 
            grid[row * gridSize + col] === grid[row * gridSize + col + 1] &&
            grid[row * gridSize + col] === grid[row * gridSize + col + 2]) {
          matches.push(row * gridSize + col, row * gridSize + col + 1, row * gridSize + col + 2);
          if (col >= 1 && grid[row * gridSize + col] === grid[row * gridSize + col - 1]) {
            matches.push(row * gridSize + col - 1); // L/T-образная форма
          }
          if (col <= gridSize - 4 && grid[row * gridSize + col] === grid[row * gridSize + col + 3]) {
            matches.push(row * gridSize + col + 3); // Длинная линия
          }
        }

        // Вертикальные совпадения
        if (row <= gridSize - 3 && 
            grid[row * gridSize + col] === grid[(row + 1) * gridSize + col] &&
            grid[row * gridSize + col] === grid[(row + 2) * gridSize + col]) {
          matches.push(row * gridSize + col, (row + 1) * gridSize + col, (row + 2) * gridSize + col);
          if (row >= 1 && grid[row * gridSize + col] === grid[(row - 1) * gridSize + col]) {
            matches.push((row - 1) * gridSize + col); // L/T-образная форма
          }
          if (row <= gridSize - 4 && grid[row * gridSize + col] === grid[(row + 3) * gridSize + col]) {
            matches.push((row + 3) * gridSize + col); // Длинная линия
          }
        }
      }
    }

    return [...new Set(matches)];
  }

  // Удаление совпадений
  async function resolveMatches(matches) {
    if (matches.length === 0) return;

    await new Promise(resolve => setTimeout(resolve, 500)); // Задержка для анимации

    matches.forEach(index => {
      tiles[index].classList.remove(...tiles[index].classList);
      tiles[index].classList.add('tile', 'empty');
    });

    dropTiles();
    fillEmptySpaces();
    checkAndResolveMatches();
  }

  // Опускание плиток
  function dropTiles() {
    for (let col = 0; col < gridSize; col++) {
      let emptySpaces = 0;
      for (let row = gridSize - 1; row >= 0; row--) {
        const index = row * gridSize + col;
        if (tiles[index].classList.contains('empty')) {
          emptySpaces++;
        } else if (emptySpaces > 0) {
          tiles[index].classList.replace(tiles[index].classList[1], 'empty');
          const swapIndex = index + emptySpaces * gridSize;
          tiles[swapIndex].classList.replace('empty', tiles[index].classList[1]);
        }
      }
    }
  }

  // Заполнение пустых мест
  function fillEmptySpaces() {
    for (let i = 0; i < gridSize * gridSize; i++) {
      if (tiles[i].classList.contains('empty')) {
        tiles[i].classList.replace('empty', getRandomColor());
      }
    }
  }

  // Проверка и решение совпадений
  function checkAndResolveMatches() {
    let matches = checkMatches();
    if (matches.length > 0) {
      resolveMatches(matches);
    }
  }

  // Инициализация игры
  createGrid();
</script>

</body>
</html>
