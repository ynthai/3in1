<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Dagons</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #2c3e50;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(8, 50px);
      grid-template-rows: repeat(8, 50px);
      gap: 2px;
      background-color: #34495e;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .tile:hover {
      transform: scale(1.1);
    }

    .red { background-color: #e74c3c; }
    .blue { background-color: #3498db; }
    .green { background-color: #2ecc71; }
    .yellow { background-color: #f1c40f; }
    .purple { background-color: #9b59b6; }
    .orange { background-color: #e67e22; }
  </style>
</head>
<body>
  <div class="game-container" id="game-container"></div>

  <script>
    const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
    const rows = 8;
    const cols = 8;
    const gameContainer = document.getElementById('game-container');
    let board = [];

    // Initialize the board
    function createBoard() {
      for (let r = 0; r < rows; r++) {
        let row = [];
        for (let c = 0; c < cols; c++) {
          const tileColor = colors[Math.floor(Math.random() * colors.length)];
          const tile = document.createElement('div');
          tile.classList.add('tile', tileColor);
          tile.setAttribute('data-row', r);
          tile.setAttribute('data-col', c);
          gameContainer.appendChild(tile);
          row.push(tileColor);
        }
        board.push(row);
      }
    }

    // Check for matches in all directions
    function checkMatches() {
      let hasMatch = false;

      // Check horizontal matches
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols - 2; c++) {
          if (board[r][c] && board[r][c] === board[r][c + 1] && board[r][c] === board[r][c + 2]) {
            markMatch(r, c, r, c + 1, r, c + 2);
            hasMatch = true;
          }
        }
      }

      // Check vertical matches
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows - 2; r++) {
          if (board[r][c] && board[r][c] === board[r + 1][c] && board[r][c] === board[r + 2][c]) {
            markMatch(r, c, r + 1, c, r + 2, c);
            hasMatch = true;
          }
        }
      }

      // Check T-shaped matches (horizontal + vertical)
      for (let r = 1; r < rows - 1; r++) {
        for (let c = 1; c < cols - 1; c++) {
          if (
            board[r][c] &&
            board[r][c] === board[r][c - 1] &&
            board[r][c] === board[r][c + 1] &&
            board[r][c] === board[r - 1][c] ||
            board[r][c] === board[r + 1][c]
          ) {
            markMatch(r, c, r, c - 1, r, c + 1, r - 1, c, r + 1, c);
            hasMatch = true;
          }
        }
      }

      return hasMatch;
    }

    // Mark tiles to be removed
    function markMatch(...positions) {
      positions.forEach(([r, c]) => {
        if (board[r][c]) {
          const tile = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
          tile.classList.add('matched');
          board[r][c] = null;
        }
      });
    }

    // Remove matched tiles and refill the board
    function removeMatches() {
      let hasRemoved = false;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!board[r][c]) {
            const tile = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
            tile.remove();
            gameContainer.appendChild(createNewTile(c));
            hasRemoved = true;
          }
        }
      }
      return hasRemoved;
    }

    // Create a new tile
    function createNewTile(col) {
      const tileColor = colors[Math.floor(Math.random() * colors.length)];
      const tile = document.createElement('div');
      tile.classList.add('tile', tileColor);
      tile.setAttribute('data-row', '-1'); // Temporary row value
      tile.setAttribute('data-col', col);
      return tile;
    }

    // Main game loop
    function gameLoop() {
      if (checkMatches()) {
        setTimeout(() => {
          if (removeMatches()) {
            setTimeout(gameLoop, 500); // Recursive call after refilling
          }
        }, 500);
      }
    }

    // Event listener for swapping tiles
    let selectedTile = null;
    gameContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('tile')) {
        if (selectedTile === null) {
          selectedTile = e.target;
        } else {
          const [r1, c1] = [parseInt(selectedTile.getAttribute('data-row')), parseInt(selectedTile.getAttribute('data-col'))];
          const [r2, c2] = [parseInt(e.target.getAttribute('data-row')), parseInt(e.target.getAttribute('data-col'))];

          if (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1) {
            [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
            [selectedTile.classList.value, e.target.classList.value] = [e.target.classList.value, selectedTile.classList.value];

            if (!checkMatches()) {
              [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
              [selectedTile.classList.value, e.target.classList.value] = [e.target.classList.value, selectedTile.classList.value];
            } else {
              gameLoop();
            }
          }
          selectedTile = null;
        }
      }
    });

    createBoard();
  </script>
</body>
</html>
