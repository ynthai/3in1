<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle & Dragons</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(7, 50px);
      gap: 5px;
    }

    .cell {
      width: 50px;
      height: 50px;
      background-color: #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 5px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .cell.empty {
      background-color: transparent;
      border: 1px dashed #aaa;
    }

    .cell.falling {
      transform: translateY(50px);
      opacity: 0;
    }

    .cell.matched {
      animation: fadeOut 0.3s ease forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div id="game-board" class="board"></div>

  <script>
    const board = [];
    const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
    const rows = 7;
    const cols = 6;

    function createBoard() {
      const gameBoard = document.getElementById('game-board');
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.row = r;
          cell.dataset.col = c;
          const color = colors[Math.floor(Math.random() * colors.length)];
          cell.style.backgroundColor = color;
          cell.dataset.color = color;
          gameBoard.appendChild(cell);
          row.push({ color });
        }
        board.push(row);
      }
    }

    function checkMatches() {
      let hasMatches = false;

      // Check horizontal matches
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols - 2; c++) {
          if (board[r][c].color === board[r][c + 1].color &&
              board[r][c].color === board[r][c + 2].color &&
              board[r][c].color !== '') {
            markCellsForRemoval(r, c, r, c + 1, r, c + 2);
            hasMatches = true;
          }
        }
      }

      // Check vertical matches
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows - 2; r++) {
          if (board[r][c].color === board[r + 1][c].color &&
              board[r][c].color === board[r + 2][c].color &&
              board[r][c].color !== '') {
            markCellsForRemoval(r, c, r + 1, c, r + 2, c);
            hasMatches = true;
          }
        }
      }

      // Check L-shaped matches (two horizontal + one vertical)
      for (let r = 0; r < rows - 1; r++) {
        for (let c = 0; c < cols - 2; c++) {
          if (board[r][c].color === board[r][c + 1].color &&
              board[r][c].color === board[r + 1][c + 1].color &&
              board[r][c].color !== '') {
            markCellsForRemoval(r, c, r, c + 1, r + 1, c + 1);
            hasMatches = true;
          }
        }
      }

      return hasMatches;
    }

    function markCellsForRemoval(...coords) {
      coords.forEach(([r, c]) => {
        const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
        if (cell) {
          cell.classList.add('matched');
          board[r][c].color = '';
        }
      });
    }

    function removeMatchedCells() {
      board.forEach((row, r) => {
        row.forEach((cell, c) => {
          const el = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
          if (cell.color === '') {
            el.classList.add('falling');
            setTimeout(() => {
              el.remove();
              board[r][c] = { color: '' };
            }, 300);
          }
        });
      });
    }

    function dropCells() {
      for (let c = 0; c < cols; c++) {
        let emptySpaces = 0;
        for (let r = rows - 1; r >= 0; r--) {
          if (board[r][c].color === '') {
            emptySpaces++;
          } else if (emptySpaces > 0) {
            board[r + emptySpaces][c] = { color: board[r][c].color };
            board[r][c] = { color: '' };

            const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
            if (cell) {
              cell.style.transform = `translateY(${emptySpaces * 55}px)`;
              setTimeout(() => {
                cell.style.transform = '';
                cell.setAttribute('data-row', r + emptySpaces);
              }, 300);
            }
          }
        }
      }
    }

    function refillBoard() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c].color === '') {
            const color = colors[Math.floor(Math.random() * colors.length)];
            board[r][c] = { color };
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.row = r;
            cell.dataset.col = c;
            cell.style.backgroundColor = color;
            cell.dataset.color = color;
            document.querySelector('.board').appendChild(cell);
          }
        }
      }
    }

    function handleMove(startRow, startCol, endRow, endCol) {
      if (Math.abs(startRow - endRow) + Math.abs(startCol - endCol) !== 1) return;

      const temp = board[startRow][startCol];
      board[startRow][startCol] = board[endRow][endCol];
      board[endRow][endCol] = temp;

      const startCell = document.querySelector(`[data-row="${startRow}"][data-col="${startCol}"]`);
      const endCell = document.querySelector(`[data-row="${endRow}"][data-col="${endCol}"]`);

      [startCell.dataset.row, endCell.dataset.row] = [endCell.dataset.row, startCell.dataset.row];
      [startCell.dataset.col, endCell.dataset.col] = [endCell.dataset.col, startCell.dataset.col];

      startCell.style.backgroundColor = board[startRow][startCol].color;
      endCell.style.backgroundColor = board[endRow][endCol].color;

      if (!checkMatches()) {
        [board[startRow][startCol], board[endRow][endCol]] = [board[endRow][endCol], board[startRow][startCol]];
        [startCell.dataset.row, endCell.dataset.row] = [endCell.dataset.row, startCell.dataset.row];
        [startCell.dataset.col, endCell.dataset.col] = [endCell.dataset.col, startCell.dataset.col];
        startCell.style.backgroundColor = board[startRow][startCol].color;
        endCell.style.backgroundColor = board[endRow][endCol].color;
      } else {
        processMatches();
      }
    }

    function processMatches() {
      if (checkMatches()) {
        removeMatchedCells();
        setTimeout(() => {
          dropCells();
          refillBoard();
          setTimeout(processMatches, 500);
        }, 300);
      }
    }

    function initGame() {
      createBoard();
      document.querySelectorAll('.cell').forEach(cell => {
        cell.addEventListener('click', () => {
          const startCell = document.querySelector('.selected');
          if (startCell && startCell !== cell) {
            const startRow = parseInt(startCell.dataset.row);
            const startCol = parseInt(startCell.dataset.col);
            const endRow = parseInt(cell.dataset.row);
            const endCol = parseInt(cell.dataset.col);
            handleMove(startRow, startCol, endRow, endCol);
            startCell.classList.remove('selected');
          } else {
            cell.classList.add('selected');
          }
        });
      });
    }

    initGame();
  </script>
</body>
</html>
