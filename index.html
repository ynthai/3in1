<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <style>
        /* Стиль игрового поля */
        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            grid-template-rows: repeat(6, 50px);
            gap: 2px;
        }

        /* Стиль ячеек игрового поля */
        .cell {
            width: 50px;
            height: 50px;
            background-color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Выбранный стиль игры - это мATCH-3 ПУЗЛ, где игрок должен создавать линии из 3+ одинаковых элементов */
        /* Важно сохранить этот стиль при внесении изменений */
    </style>
</head>
<body>
    <h1>Puzzle & Dragons</h1>
    <div id="game-board" class="game-board"></div>

    <script>
        // Размер игрового поля
        const boardSize = 6;

        // Возможные цвета (или типы) драгонов
        const colors = ['🔴', '🔵', '🟢', '🟡', '🟣'];

        // Игровое поле как двумерный массив
        let board = [];

        // Создание игрового поля
        function createBoard() {
            const gameBoard = document.getElementById('game-board');
            for (let row = 0; row < boardSize; row++) {
                board[row] = [];
                for (let col = 0; col < boardSize; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];
                    cell.textContent = randomColor;
                    board[row][col] = randomColor;
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.addEventListener('click', selectCell);
                    gameBoard.appendChild(cell);
                }
            }
        }

        // Выбор ячейки
        let selectedCell = null;
        function selectCell(event) {
            const currentCell = event.target;
            if (selectedCell === currentCell) {
                selectedCell = null;
                currentCell.style.border = '';
                return;
            }
            if (selectedCell) {
                swapCells(selectedCell, currentCell);
            } else {
                selectedCell = currentCell;
                selectedCell.style.border = '2px solid black';
            }
        }

        // Обмен двух ячеек
        function swapCells(cell1, cell2) {
            const row1 = parseInt(cell1.dataset.row);
            const col1 = parseInt(cell1.dataset.col);
            const row2 = parseInt(cell2.dataset.row);
            const col2 = parseInt(cell2.dataset.col);

            // Проверка на соседство ячеек
            if (!areNeighbors(row1, col1, row2, col2)) {
                return;
            }

            // Обмен значениями
            [board[row1][col1], board[row2][col2]] = [board[row2][col2], board[row1][col1]];
            [cell1.textContent, cell2.textContent] = [cell2.textContent, cell1.textContent];

            // Проверка совпадений после обмена
            if (!checkMatches()) {
                // Если совпадений нет, отменяем обмен
                [board[row1][col1], board[row2][col2]] = [board[row2][col2], board[row1][col1]];
                [cell1.textContent, cell2.textContent] = [cell2.textContent, cell1.textContent];
            }

            selectedCell = null;
            cell1.style.border = '';
        }

        // Проверка, являются ли две ячейки соседними
        function areNeighbors(row1, col1, row2, col2) {
            return (
                (Math.abs(row1 - row2) === 1 && col1 === col2) || // Вертикальные соседи
                (Math.abs(col1 - col2) === 1 && row1 === row2)    // Горизонтальные соседи
            );
        }

        // Проверка совпадений на игровом поле
        function checkMatches() {
            let hasMatches = false;

            // Проверка горизонтальных совпадений
            for (let row = 0; row < boardSize; row++) {
                for (let col = 0; col <= boardSize - 3; col++) {
                    if (board[row][col] === board[row][col + 1] &&
                        board[row][col] === board[row][col + 2]) {
                        markMatch(row, col, 'horizontal', 3); // Маркируем совпадение
                        hasMatches = true;
                    }
                }
            }

            // Проверка вертикальных совпадений
            for (let col = 0; col < boardSize; col++) {
                for (let row = 0; row <= boardSize - 3; row++) {
                    if (board[row][col] === board[row + 1][col] &&
                        board[row][col] === board[row + 2][col]) {
                        markMatch(row, col, 'vertical', 3); // Маркируем совпадение
                        hasMatches = true;
                    }
                }
            }

            return hasMatches;
        }

        // Маркировка совпадений
        function markMatch(startRow, startCol, direction, length) {
            for (let i = 0; i < length; i++) {
                const row = direction === 'vertical' ? startRow + i : startRow;
                const col = direction === 'horizontal' ? startCol + i : startCol;
                const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                cell.style.backgroundColor = 'pink'; // Временная маркировка
                setTimeout(() => {
                    cell.textContent = ''; // Удаляем содержимое ячейки
                    board[row][col] = ''; // Очищаем значение в массиве
                }, 500);
            }
        }

        createBoard();
    </script>
</body>
</html>
