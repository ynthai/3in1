<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        canvas {
            border: 1px solid #ccc; /* Толщина и цвет границы сохранены */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Puzzle & Dragons</h1>
        <canvas id="gameCanvas" width="300" height="500"></canvas>
        <button id="startButton">Start Game</button>
    </div>

    <script>
        const ROWS = 10; // Количество строк
        const COLS = 6; // Количество столбцов
        const TILE_SIZE = 50; // Размер одной плитки
        const COLORS = ['red', 'blue', 'green', 'yellow', 'purple']; // Доступные цвета

        let gameBoard = [];
        let canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');

        // Инициализация игры
        function initGame() {
            gameBoard = createBoard();
            drawBoard();
        }

        // Создание игрового поля
        function createBoard() {
            let board = [];
            for (let row = 0; row < ROWS; row++) {
                let boardRow = [];
                for (let col = 0; col < COLS; col++) {
                    let randomColor = Math.floor(Math.random() * COLORS.length);
                    boardRow.push(randomColor);
                }
                board.push(boardRow);
            }
            return board;
        }

        // Отрисовка игрового поля
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Очистка холста
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    let tile = gameBoard[row][col];
                    if (tile !== -1) { // Не рисуем удаленные плитки
                        drawTile(col * TILE_SIZE, row * TILE_SIZE, COLORS[tile]);
                    }
                }
            }
        }

        // Отрисовка одной плитки
        function drawTile(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = '#ccc';
            ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
        }

        // Проверка совпадений
        function checkMatches() {
            let matches = [];

            // Проверка горизонтальных совпадений
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS - 2; col++) {
                    if (
                        gameBoard[row][col] !== -1 &&
                        gameBoard[row][col] === gameBoard[row][col + 1] &&
                        gameBoard[row][col] === gameBoard[row][col + 2]
                    ) {
                        matches.push({ row, col });
                        matches.push({ row, col: col + 1 });
                        matches.push({ row, col: col + 2 });
                    }
                }
            }

            // Проверка вертикальных совпадений
            for (let col = 0; col < COLS; col++) {
                for (let row = 0; row < ROWS - 2; row++) {
                    if (
                        gameBoard[row][col] !== -1 &&
                        gameBoard[row][col] === gameBoard[row + 1][col] &&
                        gameBoard[row][col] === gameBoard[row + 2][col]
                    ) {
                        matches.push({ row, col });
                        matches.push({ row: row + 1, col });
                        matches.push({ row: row + 2, col });
                    }
                }
            }

            return matches;
        }

        // Удаление совпадений
        function removeMatches(matches) {
            matches.forEach(match => {
                gameBoard[match.row][match.col] = -1; // Метка удаления
            });
            drawBoard(); // Перерисовка поля
        }

        // Заполнение пустых ячеек новыми плитками
        function refillBoard() {
            for (let col = 0; col < COLS; col++) {
                for (let row = ROWS - 1; row >= 0; row--) {
                    if (gameBoard[row][col] === -1) {
                        for (let r = row; r > 0; r--) {
                            gameBoard[r][col] = gameBoard[r - 1][col]; // Сдвиг вниз
                        }
                        gameBoard[0][col] = Math.floor(Math.random() * COLORS.length); // Новая плитка сверху
                    }
                }
            }
            drawBoard();
        }

        // Обработчик кнопки "Start Game"
        document.getElementById('startButton').addEventListener('click', () => {
            initGame();
            setTimeout(() => {
                let matches = checkMatches();
                if (matches.length > 0) {
                    console.log('Найдены совпадения:', matches);
                    removeMatches(matches);
                    refillBoard();
                } else {
                    console.log('Совпадений не найдено');
                }
            }, 1000); // Проверка совпадений через секунду после старта
        });
    </script>

</body>
</html>
