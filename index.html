<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <!-- Стили CSS будут подключены позже -->
    <style>
        /* Основной стиль для игрового поля */
        .game-container {
            display: grid;
            grid-template-columns: repeat(6, 50px); /* Размер сетки 6x6 */
            grid-gap: 5px; /* Промежуток между ячейками */
            justify-content: center;
            margin: 20px auto;
            width: fit-content;
        }

        /* Стиль для отдельных плиток */
        .tile {
            width: 50px;
            height: 50px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Активный стиль для выбранной плитки */
        .tile.active {
            background-color: #ffcccb; /* Цвет при выборе плитки */
        }
    </style>
</head>
<body>
    <h1>Puzzle & Dragons</h1>
    <p>Выберите стиль игры:</p>
    <div>
        <!-- Выбор стиля игры -->
        <label><input type="radio" name="game-style" value="classic" checked> Классический режим</label>
        <label><input type="radio" name="game-style" value="timed"> Режим с таймером</label>
    </div>

    <div class="game-container" id="game-board">
        <!-- Игровое поле будет动生成иться динамически -->
    </div>

    <script>
        // Глобальная переменная для хранения выбранного стиля игры
        let selectedGameStyle = 'classic'; // По умолчанию классический режим

        // Функция для создания игрового поля
        function createGameBoard() {
            const gameBoard = document.getElementById('game-board');
            gameBoard.innerHTML = ''; // Очищаем текущее поле

            // Создаем сетку 6x6
            for (let i = 0; i < 36; i++) {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.textContent = '○'; // Временный символ для плитки
                tile.addEventListener('click', () => handleTileClick(tile));
                gameBoard.appendChild(tile);
            }
        }

        // Обработчик клика по плитке
        function handleTileClick(tile) {
            if (!tile.classList.contains('active')) {
                // Если плитка не активна, делаем ее активной
                tile.classList.add('active');
            } else {
                // Если плитка уже активна, деактивируем ее
                tile.classList.remove('active');
            }
        }

        // Сохранение выбранного стиля игры
        function saveGameStyle() {
            const radios = document.querySelectorAll('input[name="game-style"]');
            radios.forEach(radio => {
                if (radio.checked) {
                    selectedGameStyle = radio.value; // Сохраняем выбранный стиль
                    localStorage.setItem('selectedGameStyle', selectedGameStyle); // Сохраняем в localStorage
                }
            });
        }

        // Загрузка сохраненного стиля игры
        function loadGameStyle() {
            const savedStyle = localStorage.getItem('selectedGameStyle');
            if (savedStyle) {
                selectedGameStyle = savedStyle;
                const radios = document.querySelectorAll('input[name="game-style"]');
                radios.forEach(radio => {
                    if (radio.value === savedStyle) {
                        radio.checked = true; // Устанавливаем радио кнопку как выбранную
                    }
                });
            }
        }

        // Инициализация игры
        function initGame() {
            loadGameStyle(); // Загружаем сохраненный стиль игры
            createGameBoard(); // Создаем игровое поле
        }

        // Добавляем слушателя для изменения стиля игры
        document.querySelectorAll('input[name="game-style"]').forEach(radio => {
            radio.addEventListener('change', saveGameStyle);
        });

        // Запускаем игру
        initGame();
    </script>
</body>
</html>
