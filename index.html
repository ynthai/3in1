<script>

  // Drop tiles down after removal
  function dropTiles() {
    const columns = Array(gridSize).fill().map(() => []);
    
    // Collect tiles column-wise
    tiles.forEach((tile, i) => {
      const col = i % gridSize;
      columns[col].push(tile);
    });

    // Prepare columns with empty slots at the bottom
    columns.forEach(col => {
      while (col.length < gridSize) {
        col.unshift(null); // Add empty slots at the top of the column
      }
    });

    // Build new tiles array in row-major order (left-to-right, top-to-bottom)
    let newTiles = [];
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const cell = columns[col][row]; // Get the cell from column's row position
        newTiles.push(cell);
      }
    }

    // Update game container and tiles array
    gameContainer.innerHTML = '';
    tiles = [];
    newTiles.forEach((tile, i) => {
      if (tile) {
        gameContainer.appendChild(tile);
        tiles[i] = tile;
      } else {
        const newTile = document.createElement('div');
        newTile.classList.add('tile');
        newTile.style.opacity = 0;
        gameContainer.appendChild(newTile);
        tiles[i] = newTile;
      }
    });

    // Animate falling
    tiles.forEach(tile => {
      if (!tile) return;
      if (!tile.classList.contains('tile')) return;
      tile.style.transform = 'translateY(-100%)';
      tile.classList.add('falling');
    });

    setTimeout(() => {
      tiles.forEach(tile => {
        if (tile) {
          tile.style.transform = '';
          tile.classList.remove('falling');
        }
      });
      generateNewTiles();
    }, 500); // 0.5s animation
  }

  // ... (остальной код остается без изменений)
</script>
