<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <style>
        /* Стиль сохранен без изменений для сохранения выбранного дизайна */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            grid-gap: 5px;
        }
        .cell {
            width: 60px;
            height: 60px;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: #fff;
        }
        .cell.active {
            border: 2px solid blue;
        }
        .red { background-color: red; }
        .blue { background-color: blue; }
        .green { background-color: green; }
        .yellow { background-color: yellow; }
        .purple { background-color: purple; }
    </style>
</head>
<body>
    <div id="game-grid" class="grid"></div>

    <script>
        // Основная логика игры
        const grid = [];
        const gridSize = 5;
        const colors = ['red', 'blue', 'green', 'yellow', 'purple'];

        // Функция для создания игровой сетки
        function createGrid() {
            const gameGrid = document.getElementById('game-grid');
            for (let i = 0; i < gridSize * gridSize; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.style.backgroundColor = getRandomColor();
                cell.addEventListener('click', () => selectCell(cell));
                gameGrid.appendChild(cell);
                grid.push(cell);
            }
        }

        // Функция для получения случайного цвета
        function getRandomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Переменные для отслеживания выбранных ячеек
        let selectedCell = null;

        // Функция для выбора ячейки
        function selectCell(cell) {
            if (selectedCell === cell) {
                // Если выбрана та же ячейка, снимаем выделение
                cell.classList.remove('active');
                selectedCell = null;
            } else if (selectedCell) {
                // Если уже выбрана другая ячейка, меняем их местами
                swapCells(selectedCell, cell);
                selectedCell.classList.remove('active');
                selectedCell = null;

                // Проверяем совпадения после перемещения
                checkMatches();
            } else {
                // Выбираем новую ячейку
                cell.classList.add('active');
                selectedCell = cell;
            }
        }

        // Функция для обмена двух ячеек
        function swapCells(cell1, cell2) {
            const tempColor = cell1.style.backgroundColor;
            cell1.style.backgroundColor = cell2.style.backgroundColor;
            cell2.style.backgroundColor = tempColor;
        }

        // Функция для проверки совпадений
        function checkMatches() {
            const matches = [];

            // Проверяем горизонтальные совпадения
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col <= gridSize - 3; col++) {
                    const index = row * gridSize + col;
                    const color = grid[index].style.backgroundColor;
                    if (
                        color === grid[index + 1].style.backgroundColor &&
                        color === grid[index + 2].style.backgroundColor
                    ) {
                        matches.push(index, index + 1, index + 2);
                    }
                }
            }

            // Проверяем вертикальные совпадения
            for (let col = 0; col < gridSize; col++) {
                for (let row = 0; row <= gridSize - 3; row++) {
                    const index = row * gridSize + col;
                    const color = grid[index].style.backgroundColor;
                    if (
                        color === grid[index + gridSize].style.backgroundColor &&
                        color === grid[index + gridSize * 2].style.backgroundColor
                    ) {
                        matches.push(index, index + gridSize, index + gridSize * 2);
                    }
                }
            }

            // Удаляем совпавшие ячейки
            if (matches.length > 0) {
                matches.forEach(index => {
                    grid[index].style.backgroundColor = getRandomColor();
                });
            }
        }

        // Инициализация игры
        createGrid();
    </script>

    <!-- Комментарий: Визуальная составляющая игры сохранена без изменений. 
         Все изменения касаются только логики игры, чтобы не нарушать дизайн. -->
</body>
</html>
