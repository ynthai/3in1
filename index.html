<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff; /* Minimally soft blue */
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; } /* Soft pink */
    .color2 { background: #b0e0e6; } /* Powder blue */
    .color3 { background: #fff8dc; } /* Lemon chiffon */
    .color4 { background: #d1e231; } /* Lime green */
    .color5 { background: #deb887; } /* Burlywood */
    .color6 { background: #add8e6; } /* Light blue */

    .fade-out {
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;

  // Create the game grid
  function createGrid() {
    for (let i = 0; i < gridSize * gridSize; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile', getRandomColor());
      tile.setAttribute('draggable', true);
      tile.addEventListener('click', selectTile);
      gameContainer.appendChild(tile);
      tiles.push(tile);
    }
    checkAndRemoveMatches();
  }

  // Get a random color from the colors array
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Select a tile to swap
  function selectTile(e) {
    if (!selectedTile) {
      selectedTile = e.target;
      selectedTile.style.border = '2px solid #000';
    } else {
      const currentTile = e.target;
      if (selectedTile !== currentTile) {
        const temp = selectedTile.classList[1];
        selectedTile.classList.replace(selectedTile.classList[1], currentTile.classList[1]);
        currentTile.classList.replace(currentTile.classList[1], temp);

        // Check for matches after the swap
        setTimeout(() => {
          checkAndRemoveMatches();
        }, 500);
      }
      selectedTile.style.border = '';
      selectedTile = null;
    }
  }

  // Function to find all matches on the board
  function findMatches(board) {
    const matches = new Set();

    // Horizontal matches
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col <= gridSize - 3; col++) {
        const index1 = row * gridSize + col;
        const index2 = index1 + 1;
        const index3 = index1 + 2;
        if (
          board[index1] &&
          board[index1] === board[index2] &&
          board[index1] === board[index3]
        ) {
          matches.add(index1);
          matches.add(index2);
          matches.add(index3);
        }
      }
    }

    // Vertical matches
    for (let col = 0; col < gridSize; col++) {
      for (let row = 0; row <= gridSize - 3; row++) {
        const index1 = row * gridSize + col;
        const index2 = index1 + gridSize;
        const index3 = index1 + gridSize * 2;
        if (
          board[index1] &&
          board[index1] === board[index2] &&
          board[index1] === board[index3]
        ) {
          matches.add(index1);
          matches.add(index2);
          matches.add(index3);
        }
      }
    }

    // L-shaped matches
    for (let row = 0; row <= gridSize - 2; row++) {
      for (let col = 0; col <= gridSize - 2; col++) {
        const index1 = row * gridSize + col;
        const index2 = index1 + 1;
        const index3 = index1 + gridSize;
        if (
          board[index1] &&
          board[index1] === board[index2] &&
          board[index1] === board[index3]
        ) {
          matches.add(index1);
          matches.add(index2);
          matches.add(index3);
        }
      }
    }

    // T-shaped matches
    for (let row = 1; row <= gridSize - 2; row++) {
      for (let col = 1; col <= gridSize - 2; col++) {
        const index1 = row * gridSize + col;
        const index2 = index1 - 1;
        const index3 = index1 + 1;
        const index4 = index1 - gridSize;
        if (
          board[index1] &&
          board[index1] === board[index2] &&
          board[index1] === board[index3] &&
          board[index1] === board[index4]
        ) {
          matches.add(index1);
          matches.add(index2);
          matches.add(index3);
          matches.add(index4);
        }
      }
    }

    return Array.from(matches);
  }

  // Check and remove matches
  function checkAndRemoveMatches() {
    let hasMatches = false;

    // Convert tiles to a flat array for easier processing
    const board = Array.from(tiles).map(tile => tile.classList[1]);

    // Find all matches
    const matches = findMatches(board);

    if (matches.length > 0) {
      hasMatches = true;

      // Add fade-out class to matched tiles
      matches.forEach(index => {
        tiles[index].classList.add('fade-out');
        tiles[index].classList.remove(tiles[index].classList[1]);
      });

      // Remove tiles after animation
      setTimeout(() => {
        matches.forEach(index => {
          tiles[index].classList.remove('fade-out');
          tiles[index].classList.add(getRandomColor());
        });
        dropTiles();
        checkAndRemoveMatches(); // Recursive call to check for new matches
      }, 500);
    }

    if (!hasMatches) {
      console.log("No more matches!");
    }
  }

  // Drop tiles to fill empty spaces
  function dropTiles() {
    for (let col = 0; col < gridSize; col++) {
      const column = [];
      for (let row = 0; row < gridSize; row++) {
        const index = row * gridSize + col;
        if (!tiles[index].classList[1]) {
          column.push(index);
        }
      }

      if (column.length > 0) {
        for (let i = column.length - 1; i >= 0; i--) {
          const emptyIndex = column[i];
          const aboveIndex = emptyIndex - gridSize;

          if (aboveIndex >= 0 && tiles[aboveIndex].classList[1]) {
            tiles[emptyIndex].classList.add(tiles[aboveIndex].classList[1]);
            tiles[aboveIndex].classList.remove(tiles[aboveIndex].classList[1]);
          } else if (aboveIndex < 0) {
            tiles[emptyIndex].classList.add(getRandomColor());
          }
        }
      }
    }
  }

  // Initialize the game
  createGrid();
</script>

</body>
</html>
