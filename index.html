<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .game-container {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
            gap: 2px;
            background-color: #333;
            border-radius: 10px;
            overflow: hidden;
        }

        .cell {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .cell.empty {
            opacity: 0;
        }

        .cell.fall {
            animation: fall 0.3s ease-out;
        }

        @keyframes fall {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .red {
            background-color: #ff4d4d;
        }

        .blue {
            background-color: #4d79ff;
        }

        .green {
            background-color: #4dff4d;
        }

        .yellow {
            background-color: #ffff4d;
        }

        .purple {
            background-color: #b34db3;
        }

        .orange {
            background-color: #ff8c4d;
        }
    </style>
</head>
<body>
    <div class="game-container" id="game-container"></div>

    <script>
        const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
        const rows = 8;
        const cols = 8;

        let board = [];
        let isChecking = false;

        // Инициализация игры
        function initGame() {
            board = createBoard();
            drawBoard();
            autoCheckMatches();
        }

        // Создание игрового поля
        function createBoard() {
            const newBoard = [];
            for (let row = 0; row < rows; row++) {
                newBoard[row] = [];
                for (let col = 0; col < cols; col++) {
                    newBoard[row][col] = getRandomColor();
                }
            }
            return newBoard;
        }

        // Генерация случайного цвета
        function getRandomColor() {
            const randomIndex = Math.floor(Math.random() * colors.length);
            return colors[randomIndex];
        }

        // Отрисовка игрового поля
        function drawBoard() {
            const container = document.getElementById('game-container');
            container.innerHTML = '';
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell', board[row][col]);
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    container.appendChild(cell);
                }
            }
        }

        // Проверка совпадений
        function checkMatches() {
            const matches = [];

            // Проверка по горизонтали
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col <= cols - 3; col++) {
                    if (
                        board[row][col] &&
                        board[row][col] === board[row][col + 1] &&
                        board[row][col] === board[row][col + 2]
                    ) {
                        matches.push({ row, col });
                        matches.push({ row, col + 1 });
                        matches.push({ row, col + 2 });
                    }
                }
            }

            // Проверка по вертикали
            for (let col = 0; col < cols; col++) {
                for (let row = 0; row <= rows - 3; row++) {
                    if (
                        board[row][col] &&
                        board[row][col] === board[row + 1][col] &&
                        board[row][col] === board[row + 2][col]
                    ) {
                        matches.push({ row, col });
                        matches.push({ row + 1, col });
                        matches.push({ row + 2, col });
                    }
                }
            }

            // Проверка "T"-образных совпадений
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    if (
                        row > 0 &&
                        row < rows - 1 &&
                        col > 0 &&
                        col < cols - 1 &&
                        board[row][col] &&
                        board[row][col] === board[row - 1][col] &&
                        board[row][col] === board[row + 1][col] &&
                        board[row][col] === board[row][col + 1]
                    ) {
                        matches.push({ row - 1, col });
                        matches.push({ row, col });
                        matches.push({ row + 1, col });
                        matches.push({ row, col + 1 });
                    }
                }
            }

            return matches;
        }

        // Удаление совпадений
        function removeMatches(matches) {
            matches.forEach(({ row, col }) => {
                board[row][col] = null;
            });

            for (let col = 0; col < cols; col++) {
                let emptyRow = rows - 1;
                for (let row = rows - 1; row >= 0; row--) {
                    if (board[row][col]) {
                        board[emptyRow][col] = board[row][col];
                        if (row !== emptyRow) {
                            board[row][col] = null;
                        }
                        emptyRow--;
                    }
                }
            }

            for (let col = 0; col < cols; col++) {
                for (let row = 0; row < rows; row++) {
                    if (!board[row][col]) {
                        board[row][col] = getRandomColor();
                    }
                }
            }

            drawBoard();
        }

        // Автоматическая проверка совпадений
        function autoCheckMatches() {
            setInterval(() => {
                if (!isChecking) {
                    isChecking = true;
                    const matches = checkMatches();
                    if (matches.length > 0) {
                        removeMatches(matches);
                    }
                    isChecking = false;
                }
            }, 500);
        }

        // Обработка кликов
        let selectedCell = null;

        document.getElementById('game-container').addEventListener('click', (e) => {
            if (e.target.classList.contains('cell')) {
                const row = parseInt(e.target.dataset.row);
                const col = parseInt(e.target.dataset.col);

                if (selectedCell) {
                    const selectedRow = parseInt(selectedCell.dataset.row);
                    const selectedCol = parseInt(selectedCell.dataset.col);

                    if (
                        Math.abs(row - selectedRow) + Math.abs(col - selectedCol) === 1
                    ) {
                        [board[row][col], board[selectedRow][selectedCol]] = [
                            board[selectedRow][selectedCol],
                            board[row][col],
                        ];
                        drawBoard();

                        const matches = checkMatches();
                        if (matches.length === 0) {
                            [board[row][col], board[selectedRow][selectedCol]] = [
                                board[selectedRow][selectedCol],
                                board[row][col],
                            ];
                            drawBoard();
                        } else {
                            removeMatches(matches);
                        }
                    }

                    selectedCell.classList.remove('selected');
                    selectedCell = null;
                } else {
                    selectedCell = e.target;
                    selectedCell.classList.add('selected');
                }
            }
        });

        // Запуск игры
        initGame();
    </script>
</body>
</html>
