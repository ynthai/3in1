<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Battle</title>
  <style>
    /* [1] Основные настройки стиля */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #333;
      color: white;
      text-align: center;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-gap: 5px;
    }

    .tile {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s ease-in-out;
    }

    .red { background-color: red; }
    .blue { background-color: blue; }
    .green { background-color: green; }
    .yellow { background-color: yellow; }
    .purple { background-color: purple; }

    .score-board {
      margin: 20px 0;
      font-size: 24px;
    }

    /* [2] Анимация для тайлов */
    .tile.matched {
      animation: pop 0.3s ease-in-out;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(0); opacity: 0; }
    }

    /* [3] Стиль для босса */
    .boss {
      width: 100%;
      max-width: 300px;
      margin-top: 20px;
    }

    .boss-health {
      height: 20px;
      background-color: gray;
      border-radius: 10px;
      overflow: hidden;
    }

    .boss-health-bar {
      height: 100%;
      background-color: red;
      width: 100%;
      transition: width 0.2s linear;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="score-board">Score: <span id="score">0</span></div>
  
  <div class="grid" id="grid"></div>

  <img src="boss.png" alt="Boss" class="boss">
  <div class="boss-health">
    <div class="boss-health-bar" id="bossHealth"></div>
  </div>
</div>

<script>
  // [4] Настройка игровой сетки
  const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
  const gridSize = 5;
  let score = 0;
  let matches = [];
  let bossHealth = 100;

  const gridElement = document.getElementById('grid');
  const scoreDisplay = document.getElementById('score');
  const bossHealthBar = document.getElementById('bossHealth');

  let grid = [];

  function createGrid() {
    for (let i = 0; i < gridSize * gridSize; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile');
      tile.dataset.index = i;
      tile.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      grid.push(tile);
      gridElement.appendChild(tile);

      tile.addEventListener('touchstart', handleTouchStart);
      tile.addEventListener('touchmove', handleTouchMove);
      tile.addEventListener('touchend', handleTouchEnd);
    }
  }

  createGrid();

  // [5] Логика перетаскивания
  let startX, startY, moveX, moveY, swapTile;

  function handleTouchStart(e) {
    const tile = e.target;
    if (!tile.classList.contains('tile')) return;

    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }

  function handleTouchMove(e) {
    moveX = e.touches[0].clientX;
    moveY = e.touches[0].clientY;
  }

  function handleTouchEnd() {
    const dx = moveX - startX;
    const dy = moveY - startY;

    const tile = gridElement.children[swapTile];
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0 && swapTile < 24) {
        swapTiles(swapTile, swapTile + 1);
      } else if (dx < 0 && swapTile > 0) {
        swapTiles(swapTile, swapTile - 1);
      }
    } else {
      if (dy > 0 && swapTile < 20) {
        swapTiles(swapTile, swapTile + 5);
      } else if (dy < 0 && swapTile > 4) {
        swapTiles(swapTile, swapTile - 5);
      }
    }
  }

  function swapTiles(first, second) {
    const temp = grid[first].style.backgroundColor;
    grid[first].style.backgroundColor = grid[second].style.backgroundColor;
    grid[second].style.backgroundColor = temp;

    checkMatches();
  }

  // [6] Проверка совпадений
  function checkMatches() {
    for (let i = 0; i < grid.length; i++) {
      const row = Math.floor(i / gridSize);
      const col = i % gridSize;

      const horizontalMatch = checkRowCol(i, row, col, 1, 0);
      const verticalMatch = checkRowCol(i, row, col, 0, 1);

      if (horizontalMatch || verticalMatch) {
        matches.push(i);
      }
    }

    if (matches.length > 2) {
      updateScore(matches.length);
      removeMatches();
    }
  }

  function checkRowCol(startIndex, startRow, startCol, rowDir, colDir) {
    let count = 1;

    for (let step = 1; step < 5; step++) {
      const newRow = startRow + rowDir * step;
      const newCol = startCol + colDir * step;
      const index = newRow * gridSize + newCol;

      if (newRow < 0 || newRow >= gridSize || newCol < 0 || newCol >= gridSize) break;

      if (grid[startIndex].style.backgroundColor === grid[index].style.backgroundColor) {
        count++;
        matches.push(index);
      } else {
        break;
      }
    }

    return count >= 3;
  }

  // [7] Обновление очков и здоровья босса
  function updateScore(points) {
    score += points * points; // Квадратичное увеличение очков
    scoreDisplay.textContent = score;

    const damage = points * 2;
    bossHealth -= damage;
    bossHealthBar.style.width = `${bossHealth}%`;

    if (bossHealth <= 0) {
      alert('You Win!');
      resetGame();
    }
  }

  function removeMatches() {
    matches.forEach(index => {
      grid[index].classList.add('matched');
      setTimeout(() => {
        grid[index].style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        grid[index].classList.remove('matched');
      }, 300);
    });

    matches = [];
  }

  function resetGame() {
    score = 0;
    bossHealth = 100;
    scoreDisplay.textContent = score;
    bossHealthBar.style.width = '100%';

    grid.forEach(tile => {
      tile.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    });
  }
</script>

</body>
</html>
