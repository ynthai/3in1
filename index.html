<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out, opacity 0.5s ease-out;
    }

    /* Новые анимации */
    @keyframes fadeOut {
      100% { opacity: 0; transform: scale(0.5); }
    }

    @keyframes fallDown {
      from { transform: translateY(-100%); }
      to { transform: translateY(0); }
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
const gridSize = 6;
const gameContainer = document.getElementById('game-container');
let tiles = [];
let selectedTile = null;

// Добавленные переменные
let isProcessing = false;
const delay = 500; // 0.5 секунды

// Переработанная функция создания сетки
function createGrid() {
  gameContainer.innerHTML = '';
  tiles = [];
  for (let i = 0; i < gridSize * gridSize; i++) {
    const tile = document.createElement('div');
    tile.classList.add('tile', getRandomColor());
    tile.setAttribute('draggable', true);
    tile.addEventListener('click', selectTile);
    gameContainer.appendChild(tile);
    tiles.push(tile);
  }
}

// Функция проверки совпадений
function checkMatches() {
  const matches = [];
  const grid = tiles.map(tile => tile.classList[1]);

  // Горизонтальные линии
  for (let row = 0; row < gridSize; row++) {
    let current = null;
    let count = 0;
    let start = row * gridSize;
    for (let col = 0; col < gridSize; col++) {
      const index = start + col;
      if (grid[index] === current) count++;
      else {
        if (count >= 2) matches.push({ type: 'horizontal', start: start + col - count - 1, count: count + 1 });
        current = grid[index];
        count = 1;
      }
      if (col === gridSize - 1 && count >= 2) {
        matches.push({ type: 'horizontal', start: start + col - count, count });
      }
    }
  }

  // Вертикальные линии
  for (let col = 0; col < gridSize; col++) {
    let current = null;
    let count = 0;
    for (let row = 0; row < gridSize; row++) {
      const index = row * gridSize + col;
      if (grid[index] === current) count++;
      else {
        if (count >= 2) matches.push({ type: 'vertical', start: (row - count - 1) * gridSize + col, count: count + 1 });
        current = grid[index];
        count = 1;
      }
      if (row === gridSize - 1 && count >= 2) {
        matches.push({ type: 'vertical', start: (row - count) * gridSize + col, count });
      }
    }
  }

  return matches;
}

// Функция удаления плиток
async function removeMatches(matches) {
  const removed = new Set();
  matches.forEach(match => {
    if (match.type === 'horizontal') {
      for (let i = 0; i < match.count; i++) {
        removed.add(match.start + i);
      }
    } else {
      for (let i = 0; i < match.count; i++) {
        removed.add(match.start + i * gridSize);
      }
    }
  });

  if (removed.size === 0) return;

  // Анимация удаления
  removed.forEach(index => {
    tiles[index].style.animation = 'fadeOut 0.5s forwards';
  });

  await new Promise(resolve => setTimeout(resolve, 500));

  removed.forEach(index => {
    tiles[index].classList.remove(tiles[index].classList[1]);
    tiles[index].classList.add('empty');
  });
  
  return Array.from(removed);
}

// Функция падения плиток
async function fallTiles(removedIndices) {
  // Падение плиток по столбцам
  const columns = Array.from({ length: gridSize }, () => []);
  tiles.forEach((tile, index) => {
    const col = index % gridSize;
    if (!tile.classList.contains('empty')) {
      columns[col].push(tile);
    }
  });

  tiles.forEach(tile => tile.style.transform = '');

  // Перемещение плиток вниз
  for (let col = 0; col < gridSize; col++) {
    const emptyCount = gridSize - columns[col].length;
    columns[col].forEach((tile, i) => {
      const targetRow = emptyCount + i;
      const from = tile.offsetTop;
      const to = targetRow * 55 + 10; // учет пробелов между плитками
      tile.style.transition = 'all 0.5s ease-in-out';
      tile.style.transform = `translateY(${to - from}px)`;
    });
  }

  await new Promise(resolve => setTimeout(resolve, 500));

  // Обновление позиций плиток
  tiles = [];
  for (let col = 0; col < gridSize; col++) {
    const emptyCount = gridSize - columns[col].length;
    for (let row = 0; row < gridSize; row++) {
      const index = row * gridSize + col;
      if (row < emptyCount) {
        tiles[index] = document.createElement('div');
        tiles[index].classList.add('tile', 'empty');
      } else {
        tiles[index] = columns[col][row - emptyCount];
      }
      gameContainer.appendChild(tiles[index]);
    }
  }

  // Удаление пустых плиток
  tiles = tiles.filter(tile => !tile.classList.contains('empty'));
}

// Функция генерации новых плиток
async function generateNewTiles() {
  const newTiles = [];
  for (let i = 0; i < gridSize * gridSize; i++) {
    const tile = tiles[i];
    if (tile.classList.contains('empty')) {
      const newTile = document.createElement('div');
      newTile.classList.add('tile', getRandomColor());
      newTile.style.animation = 'fallDown 0.5s forwards';
      newTiles.push(newTile);
    } else {
      newTiles.push(tile);
    }
  }
  tiles = newTiles;
  gameContainer.innerHTML = '';
  tiles.forEach(tile => gameContainer.appendChild(tile));
}

// Основная функция обработки хода
async function processMove() {
  if (isProcessing) return;
  isProcessing = true;

  let hasMatches = true;
  while (hasMatches) {
    const matches = checkMatches();
    if (matches.length === 0) {
      hasMatches = false;
      break;
    }
    
    const removedIndices = await removeMatches(matches);
    await fallTiles(removedIndices);
    await generateNewTiles();
    
    // Проверка на возможные ходы
    const nextMatches = checkMatches();
    if (nextMatches.length === 0) {
      hasMatches = false;
    }
  }

  isProcessing = false;
}

// Переработанная функция выбора плитки
function selectTile(e) {
  if (isProcessing) return;
  const currentTile = e.target;
  if (selectedTile && selectedTile !== currentTile) {
    // Обмен плиток
    const temp = selectedTile.classList[1];
    selectedTile.classList.replace(selectedTile.classList[1], currentTile.classList[1]);
    currentTile.classList.replace(currentTile.classList[1], temp);
    
    selectedTile.style.border = '';
    selectedTile = null;
    
    // Обработка хода
    processMove();
  } else {
    selectedTile = selectedTile === currentTile ? null : currentTile;
    selectedTile.style.border = selectedTile ? '2px solid #000' : '';
  }
}

// Инициализация
createGrid();
</script>

</body>
</html>
