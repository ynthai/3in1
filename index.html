<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-template-rows: repeat(5, 60px);
      gap: 5px;
    }

    .tile {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .red { background-color: #ff5733; color: white; }
    .blue { background-color: #335bff; color: white; }
    .green { background-color: #33ff57; color: white; }
    .yellow { background-color: #ffff33; color: black; }
    .purple { background-color: #b333ff; color: white; }

    .empty {
      background-color: transparent !important;
      pointer-events: none;
    }

    .score-board {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    @keyframes fade-out {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0); }
    }
  </style>
</head>
<body>
  <div class="game-container" id="gameContainer"></div>
  <div class="score-board">Score: <span id="score">0</span></div>

  <script>
    const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
    const gridSize = 5;
    let score = 0;

    const gameContainer = document.getElementById('gameContainer');
    const scoreDisplay = document.getElementById('score');

    function createGrid() {
      for (let i = 0; i < gridSize * gridSize; i++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor());
        tile.dataset.index = i;
        gameContainer.appendChild(tile);
      }
    }

    function getRandomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    // Удаление совпадений и анимация
    function removeMatch(matchedIndices) {
      const tiles = Array.from(document.querySelectorAll('.tile'));

      matchedIndices.forEach((index) => {
        const tile = tiles[index];
        tile.classList.remove(tile.classList[1]);
        tile.style.animation = 'fade-out 0.5s ease forwards';
        setTimeout(() => (tile.classList.add('empty')), 500);
      });

      setTimeout(() => dropTiles(tiles), 500);
    }

    // Анимация падения плиток
    function dropTiles(tiles) {
      let isDropped = true;

      while (isDropped) {
        isDropped = false;

        for (let i = 0; i < tiles.length; i++) {
          if (!tiles[i].classList.contains('empty')) continue;

          const aboveIndex = i - gridSize;
          if (aboveIndex >= 0 && !tiles[aboveIndex].classList.contains('empty')) {
            const aboveTile = tiles[aboveIndex];
            const currentTile = tiles[i];

            aboveTile.style.transition = 'transform 0.3s ease';
            aboveTile.style.transform = `translateY(${60 + 5}px)`;

            setTimeout(() => {
              aboveTile.classList.remove(aboveTile.classList[1]);
              currentTile.classList.remove('empty');
              currentTile.classList.add(aboveTile.classList[1]);
              aboveTile.classList.add('empty');
              aboveTile.style.transform = '';
            }, 300);

            isDropped = true;
          }
        }
      }

      setTimeout(() => fillEmptySpaces(tiles), 300);
    }

    // Заполнение пустых ячеек новыми плитками
    function fillEmptySpaces(tiles) {
      tiles.forEach((tile, index) => {
        if (tile.classList.contains('empty')) {
          const newColor = getRandomColor();
          tile.classList.remove('empty');
          tile.classList.add(newColor);

          tile.style.opacity = '0';
          tile.style.transform = 'scale(0)';
          tile.style.transition = 'opacity 0.3s ease, transform 0.3s ease';

          setTimeout(() => {
            tile.style.opacity = '1';
            tile.style.transform = 'scale(1)';
          }, 100);
        }
      });
    }

    // Проверка совпадений через DFS
    function checkMatches() {
      const tiles = Array.from(document.querySelectorAll('.tile'));
      const visited = new Set();
      const matches = [];

      for (let i = 0; i < tiles.length; i++) {
        const match = findMatch(i, tiles[i].classList[1], visited, tiles);
        if (match.length >= 3) {
          matches.push(...match);
        }
      }

      if (matches.length > 0) {
        removeMatch(matches);
        score += matches.length * 10;
        scoreDisplay.textContent = score;
      }
    }

    function findMatch(index, color, visited, tiles) {
      if (!color || visited.has(index)) return [];
      visited.add(index);

      const matches = [index];
      const directions = [-gridSize, -1, 1, gridSize];

      for (const dir of directions) {
        const neighborIndex = index + dir;

        if (
          neighborIndex >= 0 &&
          neighborIndex < tiles.length &&
          tiles[neighborIndex].classList[1] === color
        ) {
          matches.push(...findMatch(neighborIndex, color, visited, tiles));
        }
      }

      return matches;
    }

    // МОБИЛЬНОЕ УПРАВЛЕНИЕ: Обработка нажатий и перемещений
    let draggedTile = null;

    function handleTouchStart(e) {
      const touch = e.touches[0];
      const targetTile = document.elementFromPoint(touch.clientX, touch.clientY);

      if (targetTile && targetTile.classList.contains('tile')) {
        draggedTile = targetTile;
        draggedTile.style.opacity = '0.5'; // Визуальный эффект при перетаскивании
      }
    }

    function handleTouchMove(e) {
      if (!draggedTile) return;

      const touch = e.touches[0];
      const targetTile = document.elementFromPoint(touch.clientX, touch.clientY);

      if (targetTile && targetTile.classList.contains('tile')) {
        swapTiles(draggedTile, targetTile);
      }
    }

    function handleTouchEnd() {
      if (draggedTile) {
        draggedTile.style.opacity = '1';
        draggedTile = null; // Сброс состояния перетаскивания
      }
    }

    // МОБИЛЬНОЕ УПРАВЛЕНИЕ: Добавление событий touch
    gameContainer.addEventListener('touchstart', handleTouchStart);
    gameContainer.addEventListener('touchmove', handleTouchMove);
    gameContainer.addEventListener('touchend', handleTouchEnd);

    // Обработка перемещения плиток
    function swapTiles(tile1, tile2) {
      const index1 = parseInt(tile1.dataset.index);
      const index2 = parseInt(tile2.dataset.index);

      if (!isValidMove(index1, index2)) {
        tile1.classList.add('error-animation'); // Анимация ошибки
        setTimeout(() => tile1.classList.remove('error-animation'), 300);
        return;
      }

      const tempColor = tile1.classList[1];
      tile1.classList.replace(tile1.classList[1], tile2.classList[1]);
      tile2.classList.replace(tile2.classList[1], tempColor);

      checkMatches(); // Проверка совпадений после перемещения
    }

    function isValidMove(index1, index2) {
      const row1 = Math.floor(index1 / gridSize);
      const col1 = index1 % gridSize;
      const row2 = Math.floor(index2 / gridSize);
      const col2 = index2 % gridSize;

      return (
        (row1 === row2 && Math.abs(col1 - col2) === 1) || // Горизонтальное перемещение
        (col1 === col2 && Math.abs(row1 - row2) === 1)    // Вертикальное перемещение
      );
    }

    createGrid();
  </script>
</body>
</html>
