<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Dagons</title>
  <style>
    /* Существующие стили */
    body {
      background-color: #2c3e50;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(8, 50px);
      grid-template-rows: repeat(8, 50px);
      gap: 2px;
      background-color: #34495e;
      padding: 5px;
      border-radius: 10px;
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* Новые анимации */
    .fade-out {
      opacity: 0;
      transform: scale(0.7);
    }
  </style>
</head>
<body>
  <div class="game-board" id="game-board"></div>

  <script>
    const boardSize = 8;
    const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
    let board = [];
    let isChecking = false;

    function createBoard() {
      const gameBoard = document.getElementById('game-board');
      for (let row = 0; row < boardSize; row++) {
        const boardRow = [];
        for (let col = 0; col < boardSize; col++) {
          const tileColor = colors[Math.floor(Math.random() * colors.length)];
          const tile = document.createElement('div');
          tile.classList.add('tile');
          tile.style.backgroundColor = tileColor;
          tile.dataset.row = row;
          tile.dataset.col = col;
          gameBoard.appendChild(tile);
          boardRow.push(tileColor);
        }
        board.push(boardRow);
      }
    }

    function checkMatches() {
      if (isChecking) return;
      isChecking = true;

      const matches = findMatches();
      if (matches.length > 0) {
        removeMatches(matches);
        setTimeout(() => fillEmptySpaces(), 500);
        setTimeout(checkMatches, 500); // Проверяем новые совпадения
      } else {
        isChecking = false;
      }
    }

    function findMatches() {
      const matches = [];

      // Проверка горизонтальных совпадений
      for (let row = 0; row < boardSize; row++) {
        for (let col = 0; col < boardSize - 2; col++) {
          const color = board[row][col];
          if (color && color === board[row][col + 1] && color === board[row][col + 2]) {
            matches.push({ row, col });
            matches.push({ row, col: col + 1 });
            matches.push({ row, col: col + 2 });
          }
        }
      }

      // Проверка вертикальных совпадений
      for (let col = 0; col < boardSize; col++) {
        for (let row = 0; row < boardSize - 2; row++) {
          const color = board[row][col];
          if (color && color === board[row + 1][col] && color === board[row + 2][col]) {
            matches.push({ row, col });
            matches.push({ row: row + 1, col });
            matches.push({ row: row + 2, col });
          }
        }
      }

      // Проверка L-образных совпадений
      for (let row = 0; row < boardSize - 1; row++) {
        for (let col = 0; col < boardSize - 2; col++) {
          const color = board[row][col];
          if (
            color &&
            color === board[row][col + 1] &&
            color === board[row + 1][col]
          ) {
            matches.push({ row, col });
            matches.push({ row, col: col + 1 });
            matches.push({ row: row + 1, col });
          }
        }
      }

      return matches;
    }

    function removeMatches(matches) {
      matches.forEach(({ row, col }) => {
        board[row][col] = null;
        const tile = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        if (tile) {
          tile.classList.add('fade-out');
          setTimeout(() => {
            tile.remove();
          }, 300);
        }
      });
    }

    function fillEmptySpaces() {
      for (let col = 0; col < boardSize; col++) {
        for (let row = boardSize - 1; row >= 0; row--) {
          if (!board[row][col]) {
            let emptyRow = row;
            while (emptyRow > 0 && !board[emptyRow][col]) {
              emptyRow--;
            }
            if (emptyRow >= 0) {
              board[row][col] = board[emptyRow][col];
              board[emptyRow][col] = null;

              const tile = document.querySelector(`[data-row="${emptyRow}"][data-col="${col}"]`);
              if (tile) {
                tile.dataset.row = row;
                tile.style.transform = `translateY(${(emptyRow - row) * 52}px)`;
                setTimeout(() => {
                  tile.style.transform = '';
                }, 300);
              }
            } else {
              const newTile = document.createElement('div');
              newTile.classList.add('tile');
              newTile.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
              newTile.dataset.row = row;
              newTile.dataset.col = col;
              document.getElementById('game-board').appendChild(newTile);
              board[row][col] = newTile.style.backgroundColor;
            }
          }
        }
      }
    }

    function swapTiles(tile1, tile2) {
      const row1 = parseInt(tile1.dataset.row);
      const col1 = parseInt(tile1.dataset.col);
      const row2 = parseInt(tile2.dataset.row);
      const col2 = parseInt(tile2.dataset.col);

      [board[row1][col1], board[row2][col2]] = [board[row2][col2], board[row1][col1]];
      [tile1.style.backgroundColor, tile2.style.backgroundColor] = [tile2.style.backgroundColor, tile1.style.backgroundColor];

      checkMatches();
    }

    function initGame() {
      createBoard();
      const tiles = document.querySelectorAll('.tile');
      tiles.forEach((tile) => {
        tile.addEventListener('click', () => {
          if (selectedTile) {
            swapTiles(selectedTile, tile);
            selectedTile = null;
          } else {
            selectedTile = tile;
          }
        });
      });
    }

    let selectedTile = null;
    initGame();
  </script>
</body>
</html>
