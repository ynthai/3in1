<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff; /* Minimally soft blue */
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; } /* Soft pink */
    .color2 { background: #b0e0e6; } /* Powder blue */
    .color3 { background: #fff8dc; } /* Lemon chiffon */
    .color4 { background: #d1e231; } /* Lime green */
    .color5 { background: #deb887; } /* Burlywood */
    .color6 { background: #add8e6; } /* Light blue */
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;

  // Create the game grid
  function createGrid() {
    while (true) {
      tiles = [];
      gameContainer.innerHTML = '';
      for (let i = 0; i < gridSize * gridSize; i++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor());
        tile.setAttribute('draggable', true);
        tile.addEventListener('click', selectTile);
        gameContainer.appendChild(tile);
        tiles.push(tile);
      }
      if (!hasInitialMatches()) break;
    }
  }

  // Get a random color from the colors array
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Select a tile to swap
  function selectTile(e) {
    if (!selectedTile) {
      selectedTile = e.target;
      selectedTile.style.border = '2px solid #000';
    } else {
      const currentTile = e.target;
      if (selectedTile !== currentTile && areAdjacent(selectedTile, currentTile)) {
        const temp = selectedTile.classList[1];
        selectedTile.classList.replace(selectedTile.classList[1], currentTile.classList[1]);
        currentTile.classList.replace(currentTile.classList[1], temp);
        checkAndRemoveMatches();
      }
      selectedTile.style.border = '';
      selectedTile = null;
    }
  }

  // Check if two tiles are adjacent
  function areAdjacent(tile1, tile2) {
    const index1 = Array.from(tiles).indexOf(tile1);
    const index2 = Array.from(tiles).indexOf(tile2);
    if (index1 === -1 || index2 === -1) return false;
    const row1 = Math.floor(index1 / gridSize);
    const row2 = Math.floor(index2 / gridSize);
    const col1 = index1 % gridSize;
    const col2 = index2 % gridSize;
    return (row1 === row2 && Math.abs(col1 - col2) === 1) || (col1 === col2 && Math.abs(row1 - row2) === 1);
  }

  // Check and remove matches
  async function checkAndRemoveMatches() {
    while (true) {
      let matchesFound = false;
      const matches = findMatches();
      if (matches.length > 0) {
        matches.forEach(match => {
          match.forEach(tile => {
            tile.classList.remove(...tile.classList);
            tile.classList.add('tile');
          });
        });
        await new Promise(resolve => setTimeout(resolve, 500));
        dropTiles();
        matchesFound = true;
      }
      if (!matchesFound) break;
    }
  }

  // Find all matches on the board
  function findMatches() {
    const matches = [];
    // Horizontal matches
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col <= gridSize - 3; col++) {
        const start = row * gridSize + col;
        const group = [tiles[start], tiles[start + 1], tiles[start + 2]];
        if (group.every(tile => tile.classList.contains(group[0].classList[1]))) {
          matches.push(group);
          checkLShape(start, group[0].classList[1], matches);
          checkTShape(start, group[0].classList[1], matches);
        }
      }
    }
    // Vertical matches
    for (let col = 0; col < gridSize; col++) {
      for (let row = 0; row <= gridSize - 3; row++) {
        const start = row * gridSize + col;
        const group = [tiles[start], tiles[start + gridSize], tiles[start + gridSize * 2]];
        if (group.every(tile => tile.classList.contains(group[0].classList[1]))) {
          matches.push(group);
          checkLShapeVertical(start, group[0].classList[1], matches);
          checkTShapeVertical(start, group[0].classList[1], matches);
        }
      }
    }
    return matches;
  }

  // Check L-shaped matches
  function checkLShape(start, color, matches) {
    const directions = [
      [-1, 0],
      [1, 0],
      [0, -1],
      [0, 1]
    ];
    directions.forEach(([dx, dy]) => {
      const cornerIndex = start + dx + dy * gridSize;
      if (cornerIndex >= 0 && cornerIndex < tiles.length && tiles[cornerIndex].classList.contains(color)) {
        matches.push([tiles[start], tiles[start + 1], tiles[start + 2], tiles[cornerIndex]]);
      }
    });
  }

  // Check T-shaped matches
  function checkTShape(start, color, matches) {
    const middleIndex = start + 1;
    const topIndex = middleIndex - gridSize;
    const bottomIndex = middleIndex + gridSize;
    const leftIndex = middleIndex - 1;
    const rightIndex = middleIndex + 1;
    if (topIndex >= 0 && bottomIndex < tiles.length && leftIndex >= 0 && rightIndex < tiles.length &&
        tiles[topIndex].classList.contains(color) && tiles[bottomIndex].classList.contains(color) &&
        tiles[leftIndex].classList.contains(color) && tiles[rightIndex].classList.contains(color)) {
      matches.push([tiles[middleIndex], tiles[topIndex], tiles[bottomIndex], tiles[leftIndex], tiles[rightIndex]]);
    }
  }

  // Check L-shaped matches vertically
  function checkLShapeVertical(start, color, matches) {
    const directions = [
      [-1, 0],
      [1, 0],
      [0, -1],
      [0, 1]
    ];
    directions.forEach(([dx, dy]) => {
      const cornerIndex = start + dx + dy * gridSize;
      if (cornerIndex >= 0 && cornerIndex < tiles.length && tiles[cornerIndex].classList.contains(color)) {
        matches.push([tiles[start], tiles[start + gridSize], tiles[start + gridSize * 2], tiles[cornerIndex]]);
      }
    });
  }

  // Check T-shaped matches vertically
  function checkTShapeVertical(start, color, matches) {
    const middleIndex = start + gridSize;
    const topIndex = middleIndex - gridSize;
    const bottomIndex = middleIndex + gridSize;
    const leftIndex = middleIndex - 1;
    const rightIndex = middleIndex + 1;
    if (topIndex >= 0 && bottomIndex < tiles.length && leftIndex >= 0 && rightIndex < tiles.length &&
        tiles[topIndex].classList.contains(color) && tiles[bottomIndex].classList.contains(color) &&
        tiles[leftIndex].classList.contains(color) && tiles[rightIndex].classList.contains(color)) {
      matches.push([tiles[middleIndex], tiles[topIndex], tiles[bottomIndex], tiles[leftIndex], tiles[rightIndex]]);
    }
  }

  // Drop tiles to fill empty spaces
  function dropTiles() {
    for (let col = 0; col < gridSize; col++) {
      let emptySpaces = 0;
      for (let row = gridSize - 1; row >= 0; row--) {
        const index = row * gridSize + col;
        if (tiles[index].classList.length === 1) {
          emptySpaces++;
        } else if (emptySpaces > 0) {
          tiles[index].classList.replace(tiles[index].classList[1], getRandomColor());
          tiles[index + emptySpaces * gridSize].classList.remove(...tiles[index + emptySpaces * gridSize].classList);
          tiles[index + emptySpaces * gridSize].classList.add('tile');
        }
      }
      for (let i = 0; i < emptySpaces; i++) {
        tiles[i * gridSize + col].classList.remove(...tiles[i * gridSize + col].classList);
        tiles[i * gridSize + col].classList.add('tile', getRandomColor());
      }
    }
  }

  // Check for initial matches
  function hasInitialMatches() {
    return findMatches().length > 0;
  }

  // Initialize the game
  createGrid();
</script>

</body>
</html>
