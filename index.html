<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle & Dragons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #2c3e50;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background-color: #ecf0f1;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      color: white;
      border-radius: 5px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .tile[data-color="red"] {
      background-color: #e74c3c;
    }

    .tile[data-color="blue"] {
      background-color: #3498db;
    }

    .tile[data-color="green"] {
      background-color: #2ecc71;
    }

    .tile[data-color="yellow"] {
      background-color: #f1c40f;
    }

    .tile[data-color="purple"] {
      background-color: #9b59b6;
    }

    .tile[data-color="orange"] {
      background-color: #e67e22;
    }

    .tile.match {
      opacity: 0;
      transform: scale(0.8);
    }
  </style>
</head>
<body>
  <div class="game-board" id="gameBoard"></div>

  <script>
    const boardSize = 6;
    const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
    let board = [];

    function createBoard() {
      const gameBoard = document.getElementById('gameBoard');
      gameBoard.innerHTML = '';
      board = [];
      for (let row = 0; row < boardSize; row++) {
        const boardRow = [];
        for (let col = 0; col < boardSize; col++) {
          const tileColor = colors[Math.floor(Math.random() * colors.length)];
          const tile = document.createElement('div');
          tile.classList.add('tile');
          tile.setAttribute('data-color', tileColor);
          tile.dataset.row = row;
          tile.dataset.col = col;
          tile.textContent = tileColor[0].toUpperCase();
          gameBoard.appendChild(tile);
          boardRow.push(tileColor);
        }
        board.push(boardRow);
      }
    }

    function findMatches() {
      const matches = [];
      const directions = [
        { dx: 1, dy: 0 }, // Horizontal
        { dx: 0, dy: 1 }, // Vertical
        { dx: 1, dy: 1 }, // Diagonal down-right
        { dx: -1, dy: 1 } // Diagonal up-right
      ];

      for (let row = 0; row < boardSize; row++) {
        for (let col = 0; col < boardSize; col++) {
          const color = board[row][col];
          if (!color) continue;

          for (const { dx, dy } of directions) {
            const match = [`${row},${col}`];
            let count = 1;

            for (let step = 1; step < boardSize; step++) {
              const newRow = row + step * dy;
              const newCol = col + step * dx;

              if (newRow < 0 || newRow >= boardSize || newCol < 0 || newCol >= boardSize) break;

              if (board[newRow][newCol] === color) {
                match.push(`${newRow},${newCol}`);
                count++;
              } else {
                break;
              }
            }

            if (count >= 3) {
              matches.push(...match);
            }
          }
        }
      }

      return [...new Set(matches)];
    }

    function removeMatches(matches) {
      matches.forEach(match => {
        const [row, col] = match.split(',').map(Number);
        board[row][col] = null;
        const tile = document.querySelector(`.tile[data-row="${row}"][data-col="${col}"]`);
        if (tile) {
          tile.classList.add('match');
        }
      });

      setTimeout(() => {
        matches.forEach(match => {
          const [row, col] = match.split(',').map(Number);
          const tile = document.querySelector(`.tile[data-row="${row}"][data-col="${col}"]`);
          if (tile) {
            tile.remove();
          }
        });
        fillEmptySpaces();
      }, 300); // Wait for animation
    }

    function fillEmptySpaces() {
      for (let col = 0; col < boardSize; col++) {
        for (let row = boardSize - 1; row >= 0; row--) {
          if (!board[row][col]) {
            for (let upperRow = row - 1; upperRow >= 0; upperRow--) {
              if (board[upperRow][col]) {
                board[row][col] = board[upperRow][col];
                board[upperRow][col] = null;
                const upperTile = document.querySelector(`.tile[data-row="${upperRow}"][data-col="${col}"]`);
                if (upperTile) {
                  upperTile.dataset.row = row;
                  upperTile.style.transform = `translateY(${(row - upperRow) * 55}px)`;
                  setTimeout(() => {
                    upperTile.style.transform = '';
                  }, 300);
                }
                break;
              }
            }
          }
        }
      }

      for (let col = 0; col < boardSize; col++) {
        for (let row = 0; row < boardSize; row++) {
          if (!board[row][col]) {
            const newColor = colors[Math.floor(Math.random() * colors.length)];
            board[row][col] = newColor;

            const tile = document.createElement('div');
            tile.classList.add('tile');
            tile.setAttribute('data-color', newColor);
            tile.dataset.row = row;
            tile.dataset.col = col;
            tile.textContent = newColor[0].toUpperCase();
            tile.style.opacity = 0;
            document.getElementById('gameBoard').appendChild(tile);

            setTimeout(() => {
              tile.style.opacity = 1;
            }, 300);
          }
        }
      }
    }

    function checkForMatches() {
      let matches = findMatches();
      if (matches.length > 0) {
        removeMatches(matches);
        setTimeout(checkForMatches, 500); // Check again after removing matches
      }
    }

    function swapTiles(tile1, tile2) {
      const row1 = parseInt(tile1.dataset.row);
      const col1 = parseInt(tile1.dataset.col);
      const row2 = parseInt(tile2.dataset.row);
      const col2 = parseInt(tile2.dataset.col);

      [board[row1][col1], board[row2][col2]] = [board[row2][col2], board[row1][col1]];
      [tile1.dataset.color, tile2.dataset.color] = [tile2.dataset.color, tile1.dataset.color];
      [tile1.textContent, tile2.textContent] = [tile2.textContent, tile1.textContent];

      setTimeout(() => {
        checkForMatches();
      }, 300);
    }

    function handleTileClick(e) {
      const clickedTile = e.target.closest('.tile');
      if (!clickedTile || !selectedTile) return;

      const row1 = parseInt(selectedTile.dataset.row);
      const col1 = parseInt(selectedTile.dataset.col);
      const row2 = parseInt(clickedTile.dataset.row);
      const col2 = parseInt(clickedTile.dataset.col);

      if (Math.abs(row1 - row2) + Math.abs(col1 - col2) === 1) {
        swapTiles(selectedTile, clickedTile);
      }

      selectedTile.classList.remove('selected');
      selectedTile = null;
    }

    let selectedTile = null;

    document.getElementById('gameBoard').addEventListener('click', (e) => {
      const clickedTile = e.target.closest('.tile');
      if (!clickedTile) return;

      if (selectedTile) {
        handleTileClick(e);
      } else {
        selectedTile = clickedTile;
        selectedTile.classList.add('selected');
      }
    });

    createBoard();
  </script>
</body>
</html>
