<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out, opacity 0.3s;
      position: relative;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }

    .tile.removing {
      animation: removeTile 0.5s ease-out forwards;
    }

    @keyframes removeTile {
      100% { opacity: 0; transform: scale(0.1); }
    }

    .tile.falling {
      animation: fallTile 0.5s ease-out forwards;
    }

    @keyframes fallTile {
      from { transform: translateY(-50px); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;
  let isProcessing = false;

  // Create the game grid
  function createGrid() {
    for (let i = 0; i < gridSize * gridSize; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile', getRandomColor());
      tile.setAttribute('data-row', Math.floor(i / gridSize));
      tile.setAttribute('data-col', i % gridSize);
      tile.addEventListener('click', selectTile);
      gameContainer.appendChild(tile);
      tiles.push(tile);
    }
  }

  // Get a random color from the colors array
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Select a tile to swap
  function selectTile(e) {
    if (isProcessing) return;
    if (!selectedTile) {
      selectedTile = e.target;
      selectedTile.style.boxShadow = '0 0 8px 2px rgba(0,0,0,0.3)';
    } else {
      const currentTile = e.target;
      if (selectedTile !== currentTile) {
        swapTiles(selectedTile, currentTile);
      }
      selectedTile.style.boxShadow = '';
      selectedTile = null;
    }
  }

  // Swap two tiles
  function swapTiles(tileA, tileB) {
    // Swap colors
    const tempColor = tileA.classList[1];
    tileA.classList.replace(tempColor, tileB.classList[1]);
    tileB.classList.replace(tileB.classList[1], tempColor);

    // Update coordinates
    const tempRow = tileA.getAttribute('data-row');
    const tempCol = tileA.getAttribute('data-col');
    tileA.setAttribute('data-row', tileB.getAttribute('data-row'));
    tileA.setAttribute('data-col', tileB.getAttribute('data-col'));
    tileB.setAttribute('data-row', tempRow);
    tileB.setAttribute('data-col', tempCol);

    // Check matches after swap
    checkMatches();
  }

  // Check for matching tiles
  function checkMatches() {
    const grid = getGrid();
    const matches = [];

    // Horizontal checks
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize - 2; col++) {
        const color = grid[row][col].classList[1];
        if (color === grid[row][col + 1].classList[1] &&
            color === grid[row][col + 2].classList[1]) {
          markMatched(row, col, row, col + 2, matches);
        }
      }
    }

    // Vertical checks
    for (let col = 0; col < gridSize; col++) {
      for (let row = 0; row < gridSize - 2; row++) {
        const color = grid[row][col].classList[1];
        if (color === grid[row + 1][col].classList[1] &&
            color === grid[row + 2][col].classList[1]) {
          markMatched(row, col, row + 2, col, matches);
        }
      }
    }

    // Process matches if found
    if (matches.length > 0) {
      processMatches(matches);
    } else {
      // Revert swap if no matches found
      swapTiles(tileA, tileB);
    }
  }

  // Mark matched tiles
  function markMatched(r1, c1, r2, c2, matches) {
    const startRow = Math.min(r1, r2);
    const endRow = Math.max(r1, r2);
    const startCol = Math.min(c1, c2);
    const endCol = Math.max(c1, c2);

    for (let row = startRow; row <= endRow; row++) {
      for (let col = startCol; col <= endCol; col++) {
        const tile = getTileByCoordinates(row, col);
        if (tile && !matches.includes(tile)) {
          matches.push(tile);
        }
      }
    }
  }

  // Process matches
  function processMatches(matches) {
    isProcessing = true;
    const uniqueMatches = [...new Set(matches)];

    // Animate removal
    uniqueMatches.forEach(tile => {
      tile.classList.add('removing');
    });

    setTimeout(() => {
      uniqueMatches.forEach(tile => {
        tile.remove();
      });
      tiles = tiles.filter(tile => !uniqueMatches.includes(tile));
      fallTiles();
    }, 500);
  }

  // Tiles falling animation
  function fallTiles() {
    const grid = getGrid();
    for (let col = 0; col < gridSize; col++) {
      for (let row = gridSize - 1; row >= 0; row--) {
        const tile = grid[row][col];
        if (!tile) {
          let fallRow = row - 1;
          while (fallRow >= 0 && grid[fallRow][col]) {
            const fallingTile = grid[fallRow][col];
            fallingTile.classList.add('falling');
            fallingTile.style.transform = `translateY(${(row - fallRow) * 50}px)`;
            fallRow--;
          }
        }
      }
    }

    setTimeout(() => {
      refillGrid();
    }, 500);
  }

  // Refill grid with new tiles
  function refillGrid() {
    const grid = getGrid();
    for (let col = 0; col < gridSize; col++) {
      for (let row = 0; row < gridSize; row++) {
        if (!grid[row][col]) {
          const newTile = document.createElement('div');
          newTile.classList.add('tile', getRandomColor());
          newTile.setAttribute('data-row', row);
          newTile.setAttribute('data-col', col);
          newTile.addEventListener('click', selectTile);
          gameContainer.appendChild(newTile);
          tiles.push(newTile);
        }
      }
    }

    isProcessing = false;
    checkMatches();
  }

  // Get current grid state
  function getGrid() {
    const grid = Array.from({ length: gridSize }, () => []);
    tiles.forEach(tile => {
      const row = parseInt(tile.getAttribute('data-row'));
      const col = parseInt(tile.getAttribute('data-col'));
      grid[row][col] = tile;
    });
    return grid;
  }

  // Get tile by coordinates
  function getTileByCoordinates(row, col) {
    return tiles.find(tile => 
      parseInt(tile.getAttribute('data-row')) === row &&
      parseInt(tile.getAttribute('data-col')) === col
    );
  }

  // Initialize the game
  createGrid();
</script>

</body>
</html>
