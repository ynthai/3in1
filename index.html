<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-template-rows: repeat(5, 60px);
      gap: 5px;
    }

    .tile {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .red { background-color: #ff5733; color: white; }
    .blue { background-color: #335bff; color: white; }
    .green { background-color: #33ff57; color: white; }
    .yellow { background-color: #ffff33; color: black; }
    .purple { background-color: #b333ff; color: white; }

    .selected {
      border: 3px solid #000;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .score-board {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    @keyframes fade-out {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0); }
    }
  </style>
</head>
<body>
  <div class="game-container" id="gameContainer"></div>
  <div class="score-board">Score: <span id="score">0</span></div>

  <script>
    const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
    const gridSize = 5;
    let score = 0;

    const gameContainer = document.getElementById('gameContainer');
    const scoreDisplay = document.getElementById('score');

    // Создаем игровое поле
    function createGrid() {
      for (let i = 0; i < gridSize * gridSize; i++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor());
        tile.dataset.index = i;
        tile.addEventListener('click', () => selectTile(tile));
        gameContainer.appendChild(tile);
      }
    }

    function getRandomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    let selectedTile = null;

    // Выбор плитки для перемещения
    function selectTile(tile) {
      if (!selectedTile) {
        // Если нет выбранной плитки, выбираем текущую
        selectedTile = tile;
        selectedTile.classList.add('selected');
      } else {
        // Если уже есть выбранная плитка, меняем их местами
        if (isValidMove(selectedTile, tile)) {
          swapTiles(selectedTile, tile);
          checkMatches();
        } else {
          // Если ход недопустим, показываем ошибку
          selectedTile.classList.add('error-animation');
          setTimeout(() => selectedTile.classList.remove('error-animation'), 300);
        }
        selectedTile.classList.remove('selected');
        selectedTile = null;
      }
    }

    function isValidMove(tile1, tile2) {
      const index1 = parseInt(tile1.dataset.index);
      const index2 = parseInt(tile2.dataset.index);

      const row1 = Math.floor(index1 / gridSize);
      const col1 = index1 % gridSize;
      const row2 = Math.floor(index2 / gridSize);
      const col2 = index2 % gridSize;

      return (
        (row1 === row2 && Math.abs(col1 - col2) === 1) || // Горизонтальное перемещение
        (col1 === col2 && Math.abs(row1 - row2) === 1)    // Вертикальное перемещение
      );
    }

    function swapTiles(tile1, tile2) {
      const tempColor = tile1.classList[1];
      tile1.classList.replace(tile1.classList[1], tile2.classList[1]);
      tile2.classList.replace(tile2.classList[1], tempColor);
    }

    // Проверка совпадений через DFS
    function checkMatches() {
      const tiles = Array.from(document.querySelectorAll('.tile'));
      const visited = new Set();
      const matches = [];

      for (let i = 0; i < tiles.length; i++) {
        const match = findMatch(i, tiles[i].classList[1], visited, tiles);
        if (match.length >= 3) {
          matches.push(...match);
        }
      }

      if (matches.length > 0) {
        removeMatch(matches);
      }
    }

    function findMatch(index, color, visited, tiles) {
      if (!color || visited.has(index)) return [];
      visited.add(index);

      const matches = [index];
      const directions = [-gridSize, -1, 1, gridSize]; // Вверх, влево, вправо, вниз

      for (const dir of directions) {
        const neighborIndex = index + dir;

        if (
          neighborIndex >= 0 &&
          neighborIndex < tiles.length &&
          tiles[neighborIndex].classList[1] === color
        ) {
          matches.push(...findMatch(neighborIndex, color, visited, tiles));
        }
      }

      return matches;
    }

    function removeMatch(matchedIndices) {
      matchedIndices.forEach((index) => {
        const tile = gameContainer.children[index];
        tile.classList.remove(tile.classList[1]);
        tile.style.animation = 'fade-out 0.5s ease forwards';
        setTimeout(() => (tile.style.animation = ''), 500);
      });
      score += matchedIndices.length * 10;
      scoreDisplay.textContent = score;

      fillEmptySpaces();
    }

    // Заполняем пустые места
    function fillEmptySpaces() {
      const tiles = Array.from(document.querySelectorAll('.tile'));

      for (let col = 0; col < gridSize; col++) {
        let emptySpaces = [];

        // Найдем все пустые места в столбце
        for (let row = gridSize - 1; row >= 0; row--) {
          const index = row * gridSize + col;
          const tile = tiles[index];

          if (!tile.classList[1]) {
            emptySpaces.push(index);
          } else if (emptySpaces.length > 0) {
            // Перемещаем плитку вниз
            const targetIndex = emptySpaces.pop();
            tiles[targetIndex].classList.add(...tile.classList);
            tile.classList.remove(...tile.classList);
            emptySpaces.push(index); // Проверяем следующие пустые места
          }
        }

        // Добавляем новые плитки наверху
        emptySpaces.forEach((index) => {
          const tile = tiles[index];
          tile.classList.add('tile', getRandomColor());
        });
      }
    }

    // Сохранение прогресса
    function saveProgress() {
      localStorage.setItem('puzzleGameScore', score);
    }

    function loadProgress() {
      const savedScore = localStorage.getItem('puzzleGameScore');
      if (savedScore) {
        score = parseInt(savedScore);
        scoreDisplay.textContent = score;
      }
    }

    window.addEventListener('beforeunload', saveProgress);
    loadProgress();

    createGrid();
  </script>
</body>
</html>
