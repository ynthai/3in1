<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iSafari Adventures</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f0f0;
    }
    .safari-bar {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    .safari-bar input {
      border: none;
      outline: none;
      font-size: 16px;
      width: 80%;
      padding: 5px;
      background: #f9f9f9;
    }
    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-gap: 5px;
      margin: 20px auto;
      justify-content: center;
    }
    .tile {
      width: 50px;
      height: 50px;
      background: #ccc;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="safari-bar">
    <input type="text" value="https://isafarigame.com" readonly>
  </div>
  <div class="game-container" id="game-board"></div>

  <script>
    const board = document.getElementById('game-board');
    const colors = ['red', 'blue', 'green', 'yellow', 'purple'];

    function createBoard() {
      for (let i = 0; i < 30; i++) {
        const tile = document.createElement('div');
        tile.classList.add('tile');
        tile.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        board.appendChild(tile);
      }
    }

    createBoard();
  </script>
</body>
</html>
