<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Dragons</title>
  <style>
    /* Стили оставляем без изменений */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;

  function createGrid() {
    for (let i = 0; i < gridSize * gridSize; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile');
      tile.setAttribute('draggable', true);
      tile.addEventListener('click', selectTile);
      gameContainer.appendChild(tile);
      tiles.push(tile);
    }
    fillTiles();
    while (findMatches().length > 0) {
      fillTiles();
    }
  }

  function fillTiles() {
    tiles.forEach(tile => {
      if (!tile.classList.contains('color1') && !tile.classList.contains('color2') &&
          !tile.classList.contains('color3') && !tile.classList.contains('color4') &&
          !tile.classList.contains('color5') && !tile.classList.contains('color6')) {
        tile.classList.add(getRandomColor());
      }
    });
  }

  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  function selectTile(e) {
    if (!selectedTile) {
      selectedTile = e.target;
      selectedTile.style.border = '2px solid #000';
    } else {
      const currentTile = e.target;
      if (selectedTile !== currentTile) {
        swapTiles(selectedTile, currentTile);
        setTimeout(checkMatches, 500);
      }
      selectedTile.style.border = '';
      selectedTile = null;
    }
  }

  function swapTiles(tile1, tile2) {
    const temp = [...tile1.classList];
    tile1.className = 'tile';
    tile1.classList.add(...tile2.classList);
    tile2.className = 'tile';
    tile2.classList.add(...temp);
  }

  function checkMatches() {
    const matches = findMatches();
    if (matches.length > 0) {
      removeMatches(matches);
      setTimeout(() => {
        dropTiles();
        fillEmptySpaces();
        checkMatches();
      }, 500);
    }
  }

  function findMatches() {
    const matches = [];
    const grid = Array.from(tiles).map(tile => tile.classList[1] || '');

    // Горизонтальные совпадения
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize - 2; col++) {
        const color = grid[row * gridSize + col];
        if (isHorizontalMatch(row, col, color)) {
          matches.push(...getHorizontalMatchCoordinates(row, col));
        }
      }
    }

    // Вертикальные совпадения
    for (let col = 0; col < gridSize; col++) {
      for (let row = 0; row < gridSize - 2; row++) {
        const color = grid[row * gridSize + col];
        if (isVerticalMatch(row, col, color)) {
          matches.push(...getVerticalMatchCoordinates(row, col));
        }
      }
    }

    // L-образные совпадения
    for (let row = 0; row < gridSize - 1; row++) {
      for (let col = 0; col < gridSize - 2; col++) {
        const color = grid[row * gridSize + col];
        if (isLShapeMatch(row, col, color)) {
          matches.push(...getLShapeMatchCoordinates(row, col));
        }
      }
    }

    // T-образные совпадения
    for (let row = 0; row < gridSize - 1; row++) {
      for (let col = 0; col < gridSize - 2; col++) {
        const color = grid[row * gridSize + col];
        if (isTShapeMatch(row, col, color)) {
          matches.push(...getTShapeMatchCoordinates(row, col));
        }
      }
    }

    return [...new Set(matches)];
  }

  function isHorizontalMatch(row, col, color) {
    return (
      isValidIndex(row, col) &&
      isValidIndex(row, col + 1) &&
      isValidIndex(row, col + 2) &&
      tiles[row * gridSize + col].classList.contains(color) &&
      tiles[row * gridSize + col + 1].classList.contains(color) &&
      tiles[row * gridSize + col + 2].classList.contains(color)
    );
  }

  function getHorizontalMatchCoordinates(row, col) {
    return [row * gridSize + col, row * gridSize + col + 1, row * gridSize + col + 2];
  }

  function isVerticalMatch(row, col, color) {
    return (
      isValidIndex(row, col) &&
      isValidIndex(row + 1, col) &&
      isValidIndex(row + 2, col) &&
      tiles[row * gridSize + col].classList.contains(color) &&
      tiles[(row + 1) * gridSize + col].classList.contains(color) &&
      tiles[(row + 2) * gridSize + col].classList.contains(color)
    );
  }

  function getVerticalMatchCoordinates(row, col) {
    return [row * gridSize + col, (row + 1) * gridSize + col, (row + 2) * gridSize + col];
  }

  function isLShapeMatch(row, col, color) {
    return (
      isHorizontalMatch(row, col, color) &&
      isValidIndex(row + 1, col + 2) &&
      tiles[(row + 1) * gridSize + col + 2]?.classList.contains(color)
    );
  }

  function getLShapeMatchCoordinates(row, col) {
    return [
      row * gridSize + col,
      row * gridSize + col + 1,
      row * gridSize + col + 2,
      (row + 1) * gridSize + col + 2
    ];
  }

  function isTShapeMatch(row, col, color) {
    return (
      isHorizontalMatch(row, col, color) &&
      isValidIndex(row + 1, col + 1) &&
      tiles[(row + 1) * gridSize + col + 1]?.classList.contains(color)
    );
  }

  function getTShapeMatchCoordinates(row, col) {
    return [
      row * gridSize + col,
      row * gridSize + col + 1,
      row * gridSize + col + 2,
      (row + 1) * gridSize + col + 1
    ];
  }

  function isValidIndex(row, col) {
    return row >= 0 && row < gridSize && col >= 0 && col < gridSize;
  }

  function removeMatches(matches) {
    matches.forEach(index => {
      tiles[index].className = 'tile';
    });
  }

  function dropTiles() {
    for (let col = 0; col < gridSize; col++) {
      for (let row = gridSize - 1; row >= 0; row--) {
        const currentIndex = row * gridSize + col;
        if (!tiles[currentIndex].classList.length) {
          for (let r = row - 1; r >= 0; r--) {
            const aboveIndex = r * gridSize + col;
            if (tiles[aboveIndex].classList.length) {
              swapTiles(tiles[currentIndex], tiles[aboveIndex]);
              break;
            }
          }
        }
      }
    }
  }

  function fillEmptySpaces() {
    tiles.forEach(tile => {
      if (!tile.classList.length || tile.classList[0] === 'tile') {
        tile.classList.add(getRandomColor());
      }
    });
  }

  createGrid();
</script>

</body>
</html>
