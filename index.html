<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
      opacity: 1;
      transform: translateY(0);
      transition-duration: 0.5s;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }

    .tile-deleting {
      animation: delete 0.5s ease-in-out;
    }
    @keyframes delete {
      0% { opacity: 1; }
      100% { opacity: 0; transform: scale(0); }
    }

    .tile-falling {
      animation: fall 0.5s ease-in-out;
    }
    @keyframes fall {
      0% { transform: translateY(-50px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;

  // Создаем двумерный массив для хранения плиток
  const grid = Array.from({ length: gridSize }, () => Array(gridSize));

  // Создание сетки
  function createGrid() {
    tiles = [];
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor());
        tile.dataset.row = row;
        tile.dataset.col = col;
        tile.addEventListener('click', selectTile);
        gameContainer.appendChild(tile);
        grid[row][col] = tile;
        tiles.push(tile);
      }
    }
  }

  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  function selectTile(e) {
    if (!selectedTile) {
      selectedTile = e.target;
    } else {
      const currentTile = e.target;
      if (selectedTile !== currentTile) {
        swapTiles(selectedTile, currentTile);
      }
      selectedTile = null;
    }
  }

  async function swapTiles(tileA, tileB) {
    const tempColor = tileA.classList[1];
    const tempRowA = parseInt(tileA.dataset.row);
    const tempColA = parseInt(tileA.dataset.col);
    const tempRowB = parseInt(tileB.dataset.row);
    const tempColB = parseInt(tileB.dataset.col);

    // Меняем местами
    tileA.classList.replace(tileA.classList[1], tileB.classList[1]);
    tileB.classList.replace(tileB.classList[1], tempColor);
    
    // Проверка совпадений
    await checkMatchesAndAnimate();
  }

  async function checkMatchesAndAnimate() {
    const matches = findMatches();
    if (matches.length > 0) {
      await deleteMatches(matches);
      await fallTiles();
      await generateNewTiles();
      await checkMatchesAndAnimate(); // Рекурсивная проверка
    }
  }

  function findMatches() {
    const matches = new Set();
    
    // Горизонтальные совпадения
    for (let row = 0; row < gridSize; row++) {
      let currentColor = null;
      let count = 0;
      let startCol = 0;
      for (let col = 0; col < gridSize; col++) {
        const tile = grid[row][col];
        if (tile.classList[1] === currentColor) {
          count++;
        } else {
          if (count >= 3) {
            for (let i = startCol; i < startCol + count; i++) {
              matches.add(grid[row][i]);
            }
          }
          currentColor = tile.classList[1];
          count = 1;
          startCol = col;
        }
      }
      if (count >= 3) {
        for (let i = startCol; i < startCol + count; i++) {
          matches.add(grid[row][i]);
        }
      }
    }

    // Вертикальные совпадения
    for (let col = 0; col < gridSize; col++) {
      let currentColor = null;
      let count = 0;
      let startRow = 0;
      for (let row = 0; row < gridSize; row++) {
        const tile = grid[row][col];
        if (tile.classList[1] === currentColor) {
          count++;
        } else {
          if (count >= 3) {
            for (let i = startRow; i < startRow + count; i++) {
              matches.add(grid[i][col]);
            }
          }
          currentColor = tile.classList[1];
          count = 1;
          startRow = row;
        }
      }
      if (count >= 3) {
        for (let i = startRow; i < startRow + count; i++) {
          matches.add(grid[i][col]);
        }
      }
    }

    return Array.from(matches);
  }

  async function deleteMatches(matches) {
    matches.forEach(tile => {
      tile.classList.add('tile-deleting');
    });
    await new Promise(r => setTimeout(r, 500));
    matches.forEach(tile => {
      tile.remove();
      const row = parseInt(tile.dataset.row);
      const col = parseInt(tile.dataset.col);
      grid[row][col] = null;
    });
  }

  async function fallTiles() {
    for (let col = 0; col < gridSize; col++) {
      for (let row = gridSize - 1; row >= 0; row--) {
        if (!grid[row][col]) {
          for (let i = row - 1; i >= 0; i--) {
            if (grid[i][col]) {
              grid[i][col].dataset.row = row;
              grid[i][col].classList.add('tile-falling');
              grid[row][col] = grid[i][col];
              grid[i][col] = null;
              break;
            }
          }
        }
      }
    }
    await new Promise(r => setTimeout(r, 500));
    tiles = Array.from(gameContainer.children);
    updateGrid();
  }

  function generateNewTiles() {
    for (let col = 0; col < gridSize; col++) {
      for (let row = gridSize - 1; row >= 0; row--) {
        if (!grid[row][col]) {
          const newTile = document.createElement('div');
          newTile.classList.add('tile', getRandomColor());
          newTile.dataset.row = row;
          newTile.dataset.col = col;
          newTile.addEventListener('click', selectTile);
          grid[row][col] = newTile;
          gameContainer.appendChild(newTile);
        }
      }
    }
    updateGrid();
  }

  function updateGrid() {
    gameContainer.innerHTML = '';
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        if (grid[row][col]) {
          gameContainer.appendChild(grid[row][col]);
        }
      }
    }
    tiles = Array.from(gameContainer.children);
    for (const tile of tiles) {
      tile.style.transform = '';
      tile.style.opacity = '1';
      tile.classList.remove('tile-deleting', 'tile-falling');
    }
  }

  createGrid();
</script>

</body>
</html>
