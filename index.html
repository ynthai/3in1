<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Puzzle & Dragons</title>
    <!-- Стили для игры -->
    <style>
        /* Основной контейнер игрового поля */
        #game-container {
            display: flex;
            flex-wrap: wrap;
            width: 300px;
            height: 300px;
            border: 2px solid black;
        }

        /* Клетки игрового поля */
        .cell {
            width: 50px;
            height: 50px;
            border: 1px solid gray;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
        }

        /* Цвета для различных типов элементов */
        .fire { background-color: red; }
        .water { background-color: blue; }
        .wood { background-color: green; }
        .light { background-color: yellow; }
        .dark { background-color: purple; }

        /* Панель управления */
        #controls {
            margin-top: 20px;
        }

        /* Радиокнопки выбора стиля игры */
        .style-option {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="controls">
        <!-- Выбор стиля игры -->
        <label class="style-option">
            <input type="radio" name="game-style" value="classic" checked> Classic
        </label>
        <label class="style-option">
            <input type="radio" name="game-style" value="modern"> Modern
        </label>
    </div>

    <script>
        // Размер игрового поля (количество клеток по горизонтали и вертикали)
        const gridSize = 6;

        // Элементы игрового поля
        const gameContainer = document.getElementById('game-container');

        // Создание игрового поля
        function createGameGrid() {
            for (let i = 0; i < gridSize * gridSize; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.type = getRandomType(); // Присвоение случайного типа клетке
                cell.addEventListener('click', handleCellClick); // Обработка клика на клетку
                gameContainer.appendChild(cell);
            }
        }

        // Получение случайного типа элемента (огонь, вода, дерево, свет, тьма)
        function getRandomType() {
            const types = ['fire', 'water', 'wood', 'light', 'dark'];
            return types[Math.floor(Math.random() * types.length)];
        }

        // Обработка клика на клетку (заглушка для дальнейшего расширения логики)
        function handleCellClick(event) {
            console.log(`Clicked on cell with type: ${event.target.dataset.type}`);
        }

        // Сохранение выбранного стиля игры в localStorage
        function saveGameStyle(style) {
            localStorage.setItem('selectedGameStyle', style);
        }

        // Загрузка сохраненного стиля игры из localStorage
        function loadGameStyle() {
            return localStorage.getItem('selectedGameStyle') || 'classic';
        }

        // Установка активного стиля игры
        function setGameStyle(style) {
            document.querySelectorAll('input[name="game-style"]').forEach(radio => {
                radio.checked = radio.value === style;
            });
        }

        // Инициализация игры
        function initGame() {
            createGameGrid();

            // Загрузка сохраненного стиля игры
            const savedStyle = loadGameStyle();
            setGameStyle(savedStyle);

            // Обработка изменения стиля игры
            document.querySelectorAll('input[name="game-style"]').forEach(radio => {
                radio.addEventListener('change', event => {
                    saveGameStyle(event.target.value);
                });
            });
        }

        // Запуск игры
        initGame();
    </script>
</body>
</html>
