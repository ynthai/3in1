<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
      position: relative; /* Добавлено для позиционирования */
      transition: all 0.3s ease-in-out; /* Анимация падения */
    }

    .tile:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }

    /* Анимация удаления */
    .tile.fade-out {
      animation: fadeOut 0.5s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; }
    }

    /* Позиционирование при падении */
    .tile.falling {
      animation: fall 0.5s ease-in-out;
    }

    @keyframes fall {
      from { transform: translateY(-50px); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;

  // Двумерный массив для координат
  const grid = Array.from({ length: gridSize }, () => []);

  // Создание сетки
  function createGrid() {
    tiles = [];
    gameContainer.innerHTML = '';
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const tile = createTile(row, col);
        gameContainer.appendChild(tile);
        tiles.push(tile);
      }
    }
    updateGrid();
  }

  // Создание отдельной плитки
  function createTile(row, col) {
    const tile = document.createElement('div');
    tile.className = `tile ${getRandomColor()}`;
    tile.dataset.row = row;
    tile.dataset.col = col;
    tile.addEventListener('click', selectTile);
    return tile;
  }

  // Обновление двумерного массива
  function updateGrid() {
    grid.forEach(row => row.splice(0, row.length));
    tiles.forEach(tile => {
      const row = parseInt(tile.dataset.row);
      const col = parseInt(tile.dataset.col);
      grid[row][col] = tile;
    });
  }

  // Получение случайного цвета
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Выбор плитки
  function selectTile(e) {
    const currentTile = e.target;
    
    if (!selectedTile) {
      selectedTile = currentTile;
    } else {
      swapTiles(selectedTile, currentTile);
      checkMatches()
        .then(() => setTimeout(dropTiles, 500))
        .then(() => setTimeout(fillEmpty, 500))
        .then(() => selectedTile = null);
    }
  }

  // Обмен плиток
  function swapTiles(tileA, tileB) {
    // Меняем местами координаты
    const tempRow = tileA.dataset.row;
    const tempCol = tileA.dataset.col;
    
    tileA.dataset.row = tileB.dataset.row;
    tileA.dataset.col = tileB.dataset.col;
    
    tileB.dataset.row = tempRow;
    tileB.dataset.col = tempCol;
    
    // Обновляем позиции в DOM
    const temp = tileA.style.gridColumn;
    tileA.style.gridColumn = tileB.style.gridColumn;
    tileB.style.gridColumn = temp;
    
    // Обновляем двумерный массив
    updateGrid();
    
    // Проверка совпадений
    const matches = checkMatches();
    if (!matches.length) {
      // Если нет совпадений, отменяем обмен
      swapTiles(tileA, tileB);
      alert("Invalid move - no matches found!");
    }
  }

  // Проверка совпадений
  async function checkMatches() {
    const matches = [];
    const visited = Array.from({ length: gridSize }, () => Array(gridSize).fill(false));

    // Горизонтальные совпадения
    for (let row = 0; row < gridSize; row++) {
      let currentColor = null;
      let count = 0;
      let startCol = 0;
      
      for (let col = 0; col < gridSize; col++) {
        const tile = grid[row][col];
        if (tile.classList[1] === currentColor) {
          count++;
        } else {
          if (count >= 3) markHorizontalMatches(row, startCol, col - 1, currentColor, visited);
          currentColor = tile.classList[1];
          count = 1;
          startCol = col;
        }
      }
      if (count >= 3) markHorizontalMatches(row, startCol, gridSize - 1, currentColor, visited);
    }

    // Вертикальные совпадения
    for (let col = 0; col < gridSize; col++) {
      let currentColor = null;
      let count = 0;
      let startRow = 0;
      
      for (let row = 0; row < gridSize; row++) {
        const tile = grid[row][col];
        if (tile.classList[1] === currentColor) {
          count++;
        } else {
          if (count >= 3) markVerticalMatches(startRow, row - 1, col, currentColor, visited);
          currentColor = tile.classList[1];
          count = 1;
          startRow = row;
        }
      }
      if (count >= 3) markVerticalMatches(startRow, gridSize - 1, col, currentColor, visited);
    }

    // Фильтруем уникальные совпадения
    const uniqueMatches = Array.from(new Set(matches));
    return uniqueMatches;
  }

  // Отмечает горизонтальные совпадения
  function markHorizontalMatches(row, startCol, endCol, color, visited) {
    for (let col = startCol; col <= endCol; col++) {
      const tile = grid[row][col];
      if (tile.classList[1] === color) {
        visited[row][col] = true;
        matches.push(tile);
      }
    }
  }

  // Отмечает вертикальные совпадения
  function markVerticalMatches(startRow, endRow, col, color, visited) {
    for (let row = startRow; row <= endRow; row++) {
      const tile = grid[row][col];
      if (tile.classList[1] === color) {
        visited[row][col] = true;
        matches.push(tile);
      }
    }
  }

  // Удаление совпадений
  async function removeMatches(matches) {
    matches.forEach(tile => {
      tile.classList.add('fade-out');
      setTimeout(() => {
        tile.remove();
        tiles = tiles.filter(t => t !== tile);
      }, 500);
    });
  }

  // Падение плиток
  function dropTiles() {
    for (let col = 0; col < gridSize; col++) {
      for (let row = gridSize - 1; row >= 0; row--) {
        const tile = grid[row][col];
        if (!tile) {
          // Смещаем плитки выше
          for (let i = row - 1; i >= 0; i--) {
            const upperTile = grid[i][col];
            if (upperTile) {
              upperTile.style.transform = `translateY(${(row - i) * 50}px)`;
              upperTile.dataset.row = row.toString();
              grid[row][col] = upperTile;
              grid[i][col] = null;
              break;
            }
          }
        }
      }
    }
  }

  // Заполнение пустых ячеек
  function fillEmpty() {
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        if (!grid[row][col]) {
          const newTile = createTile(row, col);
          gameContainer.appendChild(newTile);
          tiles.push(newTile);
          grid[row][col] = newTile;
        }
      }
    }
  }
  
  // Инициализация
  createGrid();
</script>

</body>
</html>
