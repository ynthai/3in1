<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .tile:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }

    .removed {
      opacity: 0;
      transform: scale(0.1);
      transition: all 0.3s ease;
    }

    .falling {
      transition: transform 0.3s ease;
    }

    .new-tile {
      opacity: 0;
      transform: translateY(-100%);
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let grid = Array.from({ length: gridSize }, () => Array(gridSize));
  let selectedTile = null;
  let isProcessing = false;

  // Инициализация сетки
  function createGrid() {
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor());
        tile.dataset.row = row;
        tile.dataset.col = col;
        tile.addEventListener('click', selectTile);
        gameContainer.appendChild(tile);
        grid[row][col] = tile;
        tiles.push(tile);
      }
    }
  }

  // Получение случайного цвета
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Выбор плитки
  function selectTile(e) {
    if (isProcessing) return;
    const tile = e.target;
    if (!selectedTile) {
      selectedTile = tile;
    } else {
      swapTiles(selectedTile, tile);
      selectedTile = null;
      checkAndProcess();
    }
  }

  // Обмен плиток
  function swapTiles(tileA, tileB) {
    const tempColor = tileA.classList[1];
    tileA.classList.replace(tileA.classList[1], tileB.classList[1]);
    tileB.classList.replace(tileB.classList[1], tempColor);

    // Обновляем позиции в сетке
    const tempRow = parseInt(tileA.dataset.row);
    const tempCol = parseInt(tileA.dataset.col);
    tileA.dataset.row = tileB.dataset.row;
    tileA.dataset.col = tileB.dataset.col;
    tileB.dataset.row = tempRow.toString();
    tileB.dataset.col = tempCol.toString();

    // Обновляем grid
    const rowA = tempRow;
    const colA = tempCol;
    const rowB = parseInt(tileB.dataset.row);
    const colB = parseInt(tileB.dataset.col);
    grid[rowA][colA] = tileB;
    grid[rowB][colB] = tileA;
  }

  // Проверка совпадений и обработка
  async function checkAndProcess() {
    isProcessing = true;
    await processMatches();
    if (selectedTile) selectedTile = null; // Сброс выбора
    isProcessing = false;
  }

  // Поиск совпадений
  function findMatches() {
    const matches = new Set();
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const currentTile = grid[row][col];
        if (!currentTile) continue;
        const color = currentTile.classList[1];
        
        // Горизонтальные
        let count = 1;
        for (let c = col + 1; c < gridSize; c++) {
          if (grid[row][c]?.classList[1] === color) count++;
          else break;
        }
        if (count >= 3) {
          for (let i = 0; i < count; i++) {
            matches.add(grid[row][col + i]);
          }
        }

        // Вертикальные
        count = 1;
        for (let r = row + 1; r < gridSize; r++) {
          if (grid[r][col]?.classList[1] === color) count++;
          else break;
        }
        if (count >= 3) {
          for (let i = 0; i < count; i++) {
            matches.add(grid[row + i][col]);
          }
        }
      }
    }
    return Array.from(matches);
  }

  // Удаление совпадений с анимацией
  async function processMatches() {
    const matches = findMatches();
    if (!matches.length) return;
    matches.forEach(tile => tile.classList.add('removed'));
    await new Promise(resolve => setTimeout(resolve, 300));
    matches.forEach(tile => {
      gameContainer.removeChild(tile);
      tiles = tiles.filter(t => t !== tile);
    });
    grid = Array.from({ length: gridSize }, () => Array(gridSize));
    tiles.forEach(tile => {
      const row = parseInt(tile.dataset.row);
      const col = parseInt(tile.dataset.col);
      grid[row][col] = tile;
    });
    await processFalling();
    await refillGrid();
  }

  // Падение плиток
  async function processFalling() {
    const newGrid = Array.from({ length: gridSize }, () => Array(gridSize));
    for (let col = 0; col < gridSize; col++) {
      let emptyRows = [];
      for (let row = gridSize - 1; row >= 0; row--) {
        const tile = grid[row][col];
        if (tile) {
          const targetRow = emptyRows.length ? emptyRows.pop() : row;
          newGrid[targetRow][col] = tile;
          if (targetRow !== row) {
            tile.style.transform = `translateY(${(targetRow - row) * 55}px)`;
            tile.classList.add('falling');
          }
        } else {
          emptyRows.push(row);
        }
      }
    }
    grid = newGrid;
    await new Promise(resolve => setTimeout(resolve, 300));
    tiles.forEach(tile => tile.style.transform = '');
  }

  // Добавление новых плиток
  async function refillGrid() {
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        if (!grid[row][col]) {
          const newTile = document.createElement('div');
          newTile.classList.add('tile', getRandomColor());
          newTile.dataset.row = row;
          newTile.dataset.col = col;
          newTile.classList.add('new-tile');
          gameContainer.appendChild(newTile);
          grid[row][col] = newTile;
          tiles.push(newTile);
          await new Promise(resolve => setTimeout(resolve, 100));
          newTile.classList.remove('new-tile');
        }
      }
    }
  }

  // Инициализация
  createGrid();
</script>

</body>
</html>
