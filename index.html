<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <style>
        /* Стили для игрового поля */
        .game-board {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
            gap: 2px;
        }

        .tile {
            width: 50px;
            height: 50px;
            background-color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .red { background-color: red; }
        .blue { background-color: blue; }
        .green { background-color: green; }
        .yellow { background-color: yellow; }
        .purple { background-color: purple; }
    </style>
</head>
<body>
    <h1>Puzzle & Dragons</h1>
    <div id="game-board" class="game-board"></div>

    <script>
        // Размер игрового поля
        const boardSize = 8;

        // Цвета плиток
        const colors = ['red', 'blue', 'green', 'yellow', 'purple'];

        // Игровое поле
        let board = [];

        // Создание игрового поля
        function createBoard() {
            const gameBoard = document.getElementById('game-board');
            for (let i = 0; i < boardSize * boardSize; i++) {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                const color = colors[Math.floor(Math.random() * colors.length)];
                tile.classList.add(color);
                board.push(color); // Добавляем цвет в массив игрового поля
                gameBoard.appendChild(tile);
            }
        }

        // Проверка на наличие совпадений
        function checkMatches() {
            let hasMatches = false;
            const matches = [];

            // Проверка горизонтальных совпадений
            for (let row = 0; row < boardSize; row++) {
                for (let col = 0; col < boardSize - 2; col++) {
                    const index = row * boardSize + col;
                    if (
                        board[index] &&
                        board[index] === board[index + 1] &&
                        board[index] === board[index + 2]
                    ) {
                        matches.push(index, index + 1, index + 2);
                        hasMatches = true;
                    }
                }
            }

            // Проверка вертикальных совпадений
            for (let col = 0; col < boardSize; col++) {
                for (let row = 0; row < boardSize - 2; row++) {
                    const index = row * boardSize + col;
                    if (
                        board[index] &&
                        board[index] === board[index + boardSize] &&
                        board[index] === board[index + boardSize * 2]
                    ) {
                        matches.push(index, index + boardSize, index + boardSize * 2);
                        hasMatches = true;
                    }
                }
            }

            // Удаление совпадений
            if (hasMatches) {
                matches.forEach(index => {
                    board[index] = null; // Удаляем совпадение из массива
                    const tile = document.querySelectorAll('.tile')[index];
                    tile.classList.remove(...colors); // Убираем класс цвета
                    tile.textContent = ''; // Очищаем содержимое плитки
                });
            }

            return hasMatches;
        }

        // Смещение плиток вниз после удаления совпадений
        function dropTiles() {
            for (let col = 0; col < boardSize; col++) {
                for (let row = boardSize - 1; row >= 0; row--) {
                    const index = row * boardSize + col;
                    if (!board[index]) { // Если ячейка пуста
                        for (let r = row - 1; r >= 0; r--) {
                            const aboveIndex = r * boardSize + col;
                            if (board[aboveIndex]) { // Находим ближайшую плитку сверху
                                board[index] = board[aboveIndex]; // Перемещаем её вниз
                                board[aboveIndex] = null; // Очищаем исходную позицию

                                // Обновляем внешний вид плитки
                                const tile = document.querySelectorAll('.tile')[index];
                                const aboveTile = document.querySelectorAll('.tile')[aboveIndex];
                                tile.classList.add(board[index]);
                                aboveTile.classList.remove(...colors);
                                aboveTile.textContent = '';

                                break; // Прекращаем поиск после перемещения
                            }
                        }
                    }
                }
            }
        }

        // Заполнение пустых ячеек новыми плитками
        function fillEmptySpaces() {
            for (let i = 0; i < board.length; i++) {
                if (!board[i]) { // Если ячейка пуста
                    const newColor = colors[Math.floor(Math.random() * colors.length)];
                    board[i] = newColor;

                    // Обновляем внешний вид плитки
                    const tile = document.querySelectorAll('.tile')[i];
                    tile.classList.add(newColor);
                }
            }
        }

        // Главный цикл игры
        function gameLoop() {
            let hasMatches = true;
            while (hasMatches) { // Повторяем, пока есть совпадения
                hasMatches = checkMatches(); // Проверяем совпадения
                if (hasMatches) {
                    dropTiles(); // Смещаем плитки вниз
                    fillEmptySpaces(); // Заполняем пустые ячейки
                }
            }
        }

        // Инициализация игры
        createBoard();
        gameLoop();
    </script>
</body>
</html>
