<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-template-rows: repeat(5, 60px);
      gap: 5px;
    }

    .tile {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .red { background-color: #ff5733; color: white; }
    .blue { background-color: #335bff; color: white; }
    .green { background-color: #33ff57; color: white; }
    .yellow { background-color: #ffff33; color: black; }
    .purple { background-color: #b333ff; color: white; }

    .score-board {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .controls {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 10px;
      font-size: 20px;
      cursor: pointer;
    }

    .error-animation {
      animation: error-shake 0.3s ease;
    }

    @keyframes error-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    @keyframes fade-out {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0); }
    }
  </style>
</head>
<body>
  <div class="game-container" id="gameContainer"></div>
  <div class="score-board">Score: <span id="score">0</span></div>
  <div class="controls">
    <button id="up">↑</button>
    <button id="left">←</button>
    <button id="right">→</button>
    <button id="down">↓</button>
  </div>

  <script>
    const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
    const gridSize = 5;
    let score = 0;

    const gameContainer = document.getElementById('gameContainer');
    const scoreDisplay = document.getElementById('score');

    // Создаем игровое поле
    function createGrid() {
      for (let i = 0; i < gridSize * gridSize; i++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor());
        tile.dataset.index = i;
        gameContainer.appendChild(tile);
      }
    }

    function getRandomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    let draggedTile = null;

    // Сенсорное управление
    function handleTouchStart(e) {
      const touch = e.touches[0];
      const targetTile = document.elementFromPoint(touch.clientX, touch.clientY);
      if (targetTile && targetTile.classList.contains('tile')) {
        draggedTile = targetTile;
        draggedTile.style.opacity = '0.5';
      }
    }

    function handleTouchMove(e) {
      if (!draggedTile) return;
      const touch = e.touches[0];
      const targetTile = document.elementFromPoint(touch.clientX, touch.clientY);

      if (targetTile && targetTile.classList.contains('tile')) {
        swapTiles(draggedTile, targetTile);
      }
    }

    function handleTouchEnd() {
      if (draggedTile) {
        draggedTile.style.opacity = '1';
        draggedTile = null;
      }
    }

    // Управление мышью
    gameContainer.addEventListener('mousedown', (e) => {
      draggedTile = e.target.closest('.tile');
      if (draggedTile) draggedTile.style.opacity = '0.5';
    });

    gameContainer.addEventListener('mousemove', (e) => {
      if (!draggedTile) return;
      const targetTile = document.elementFromPoint(e.clientX, e.clientY);
      if (targetTile && targetTile.classList.contains('tile')) {
        swapTiles(draggedTile, targetTile);
      }
    });

    gameContainer.addEventListener('mouseup', () => {
      if (draggedTile) {
        draggedTile.style.opacity = '1';
        draggedTile = null;
      }
    });

    // Обработка перемещения плиток
    function swapTiles(tile1, tile2) {
      const index1 = parseInt(tile1.dataset.index);
      const index2 = parseInt(tile2.dataset.index);

      if (!isValidMove(index1, index2)) {
        tile1.classList.add('error-animation');
        setTimeout(() => tile1.classList.remove('error-animation'), 300);
        return;
      }

      const tempColor = tile1.classList[1];
      tile1.classList.replace(tile1.classList[1], tile2.classList[1]);
      tile2.classList.replace(tile2.classList[1], tempColor);

      checkMatches();
    }

    function isValidMove(index1, index2) {
      const row1 = Math.floor(index1 / gridSize);
      const col1 = index1 % gridSize;
      const row2 = Math.floor(index2 / gridSize);
      const col2 = index2 % gridSize;

      return (
        (row1 === row2 && Math.abs(col1 - col2) === 1) || // Горизонтальное перемещение
        (col1 === col2 && Math.abs(row1 - row2) === 1)    // Вертикальное перемещение
      );
    }

    // Проверка совпадений через DFS
    function checkMatches() {
      const tiles = Array.from(document.querySelectorAll('.tile'));
      const visited = new Set();
      const matches = [];

      for (let i = 0; i < tiles.length; i++) {
        const match = findMatch(i, tiles[i].classList[1], visited, tiles);
        if (match.length >= 3) {
          matches.push(...match);
        }
      }

      if (matches.length > 0) {
        removeMatch(matches);
      }
    }

    function findMatch(index, color, visited, tiles) {
      if (!color || visited.has(index)) return [];
      visited.add(index);

      const matches = [index];
      const directions = [-gridSize, -1, 1, gridSize]; // Вверх, влево, вправо, вниз

      for (const dir of directions) {
        const neighborIndex = index + dir;

        if (
          neighborIndex >= 0 &&
          neighborIndex < tiles.length &&
          tiles[neighborIndex].classList[1] === color
        ) {
          matches.push(...findMatch(neighborIndex, color, visited, tiles));
        }
      }

      return matches;
    }

    function removeMatch(matchedIndices) {
      matchedIndices.forEach((index) => {
        const tile = gameContainer.children[index];
        tile.classList.remove(tile.classList[1]);
        tile.style.animation = 'fade-out 0.5s ease forwards';
        setTimeout(() => (tile.style.animation = ''), 500);
      });
      score += matchedIndices.length * 10;
      scoreDisplay.textContent = score;

      fillEmptySpaces();
    }

    function fillEmptySpaces() {
      const tiles = Array.from(document.querySelectorAll('.tile'));

      for (let col = 0; col < gridSize; col++) {
        let emptySpaces = [];

        for (let row = gridSize - 1; row >= 0; row--) {
          const index = row * gridSize + col;
          const tile = tiles[index];

          if (!tile.classList[1]) {
            emptySpaces.push(index);
          } else if (emptySpaces.length > 0) {
            const targetIndex = emptySpaces.pop();
            tiles[targetIndex].classList.add(...tile.classList);
            tile.classList.remove(...tile.classList);
            emptySpaces.push(index);
          }
        }

        emptySpaces.forEach((index) => {
          const tile = tiles[index];
          tile.classList.add('tile', getRandomColor());
        });
      }
    }

    // Управление через кнопки
    document.getElementById('up').addEventListener('click', () => moveTiles('up'));
    document.getElementById('down').addEventListener('click', () => moveTiles('down'));
    document.getElementById('left').addEventListener('click', () => moveTiles('left'));
    document.getElementById('right').addEventListener('click', () => moveTiles('right'));

    function moveTiles(direction) {
      const tiles = Array.from(document.querySelectorAll('.tile'));

      for (let i = 0; i < tiles.length; i++) {
        const tile = tiles[i];
        const color = tile.classList[1];

        if (color) {
          let targetIndex = i;

          switch (direction) {
            case 'up':
              if (i >= gridSize) targetIndex -= gridSize;
              break;
            case 'down':
              if (i < tiles.length - gridSize) targetIndex += gridSize;
              break;
            case 'left':
              if (i % gridSize !== 0) targetIndex -= 1;
              break;
            case 'right':
              if (i % gridSize !== gridSize - 1) targetIndex += 1;
              break;
          }

          const targetTile = tiles[targetIndex];

          if (targetTile && !targetTile.classList[1]) {
            targetTile.classList.add(...tile.classList);
            tile.classList.remove(...tile.classList);
          }
        }
      }
    }

    // Отключение пролистывания страницы
    gameContainer.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    createGrid();
  </script>
</body>
</html>
