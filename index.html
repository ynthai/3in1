<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
      position: relative;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }

    /* Новые анимации */
    .removed {
      opacity: 0;
      transform: scale(0);
      transition: all 0.5s ease;
    }

    .falling {
      transition: transform 0.5s ease;
    }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let grid = Array.from({ length: gridSize }, () => new Array(gridSize).fill(null));

  let selectedTile = null;

  // Создаем сетку
  function createGrid() {
    // Очистка контейнера
    gameContainer.innerHTML = '';
    
    // Создаем плитки
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor());
        tile.addEventListener('click', selectTile);
        tile.style.gridRow = (y + 1).toString();
        tile.style.gridColumn = (x + 1).toString();
        gameContainer.appendChild(tile);
        grid[y][x] = tile;
      }
    }
  }

  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Выбор плитки
  function selectTile(e) {
    if (selectedTile && selectedTile !== e.target) {
      const currentTile = e.target;
      swapTiles(selectedTile, currentTile);
      selectedTile = null;
      checkMatches();
    } else {
      selectedTile = e.target;
    }
  }

  // Поиск позиции плитки
  function findTilePosition(tile) {
    for (let y = 0; y < gridSize; y++) {
      const x = grid[y].findIndex(t => t === tile);
      if (x !== -1) return { x, y };
    }
    return { x: -1, y: -1 };
  }

  // Свап плиток
  function swapTiles(tile1, tile2) {
    const pos1 = findTilePosition(tile1);
    const pos2 = findTilePosition(tile2);
    
    // Обновляем позиции в сетке
    [grid[pos1.y][pos1.x], grid[pos2.y][pos2.x]] = [grid[pos2.y][pos2.x], grid[pos1.y][pos1.x]];
    
    // Меняем местами DOM-элементы
    const temp = tile1.style.gridColumn;
    tile1.style.gridColumn = tile2.style.gridColumn;
    tile2.style.gridColumn = temp;
    
    tempGridRow = tile1.style.gridRow;
    tile1.style.gridRow = tile2.style.gridRow;
    tile2.style.gridRow = tempGridRow;
  }

  // Проверка совпадений
  async function checkMatches() {
    const matches = findMatches();
    if (matches.length === 0) return;

    await removeMatches(matches);
    await dropTiles();
    await refillTiles();
    await checkMatches(); // Рекурсивная проверка
  }

  // Поиск совпадений
  function findMatches() {
    const matches = new Set();
    
    // Горизонтальные
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize - 2; x++) {
        const color = grid[y][x]?.classList[1];
        if (color && 
            grid[y][x + 1]?.classList[1] === color &&
            grid[y][x + 2]?.classList[1] === color) {
          for (let i = 0; i < 3; i++) matches.add(grid[y][x + i]);
        }
      }
    }

    // Вертикальные
    for (let x = 0; x < gridSize; x++) {
      for (let y = 0; y < gridSize - 2; y++) {
        const color = grid[y][x]?.classList[1];
        if (color && 
            grid[y + 1][x]?.classList[1] === color &&
            grid[y + 2][x]?.classList[1] === color) {
          for (let i = 0; i < 3; i++) matches.add(grid[y + i][x]);
        }
      }
    }

    return Array.from(matches);
  }

  // Удаление совпадений
  async function removeMatches(matches) {
    matches.forEach(tile => tile.classList.add('removed'));
    await new Promise(resolve => setTimeout(resolve, 500));
    matches.forEach(tile => {
      const pos = findTilePosition(tile);
      grid[pos.y][pos.x] = null;
      gameContainer.removeChild(tile);
    });
  }

  // Падение плиток
  async function dropTiles() {
    for (let x = 0; x < gridSize; x++) {
      for (let y = gridSize - 1; y >= 0; y--) {
        if (!grid[y][x]) continue;
        
        let dropY = y;
        while (dropY < gridSize - 1 && !grid[dropY + 1][x]) dropY++;
        
        if (dropY !== y) {
          const tile = grid[y][x];
          grid[y][x] = null;
          grid[dropY][x] = tile;
          tile.style.transform = `translateY(${(dropY - y) * 50}px)`;
          tile.classList.add('falling');
        }
      }
    }
    await new Promise(resolve => setTimeout(resolve, 500));
    grid.forEach(row => row.forEach(tile => tile?.classList.remove('falling')));
  }

  // Добавление новых плиток
  async function refillTiles() {
    for (let x = 0; x < gridSize; x++) {
      for (let y = 0; y < gridSize; y++) {
        if (!grid[y][x]) {
          const newTile = document.createElement('div');
          newTile.classList.add('tile', getRandomColor());
          newTile.addEventListener('click', selectTile);
          newTile.style.gridColumn = (x + 1).toString();
          newTile.style.gridRow = (y + 1).toString();
          gameContainer.appendChild(newTile);
          grid[y][x] = newTile;
        }
      }
    }
  }

  // Инициализация
  createGrid();
</script>

</body>
</html>
