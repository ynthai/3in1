<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-template-rows: repeat(5, 60px);
      gap: 5px;
    }

    .tile {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .red { background-color: #ff5733; color: white; }
    .blue { background-color: #335bff; color: white; }
    .green { background-color: #33ff57; color: white; }
    .yellow { background-color: #ffff33; color: black; }
    .purple { background-color: #b333ff; color: white; }

    .score-board {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    @keyframes fade-out {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0); }
    }
  </style>
</head>
<body>
  <div class="game-container" id="gameContainer"></div>
  <div class="score-board">Score: <span id="score">0</span></div>

  <script>
    const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
    const gridSize = 5;
    let score = 0;

    const gameContainer = document.getElementById('gameContainer');
    const scoreDisplay = document.getElementById('score');

    // Создаем игровое поле без готовых совпадений
    function createGrid() {
      const tiles = [];
      for (let i = 0; i < gridSize * gridSize; i++) {
        let tileColor = getRandomColor();
        tiles.push(tileColor);
      }

      while (hasMatches(tiles)) {
        for (let i = 0; i < tiles.length; i++) {
          tiles[i] = getRandomColor();
        }
      }

      tiles.forEach((color, index) => {
        const tile = document.createElement('div');
        tile.classList.add('tile', color);
        tile.dataset.index = index;
        gameContainer.appendChild(tile);
      });
    }

    function getRandomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function hasMatches(tiles) {
      const visited = new Set();
      for (let i = 0; i < tiles.length; i++) {
        if (findMatch(i, tiles[i], visited, tiles).length >= 3) {
          return true;
        }
      }
      return false;
    }

    function findMatch(index, color, visited, tiles) {
      if (!color || visited.has(index)) return [];
      visited.add(index);

      const matches = [index];
      const directions = [-gridSize, -1, 1, gridSize]; // Вверх, влево, вправо, вниз

      for (const dir of directions) {
        const neighborIndex = index + dir;

        if (
          neighborIndex >= 0 &&
          neighborIndex < tiles.length &&
          tiles[neighborIndex] === color
        ) {
          matches.push(...findMatch(neighborIndex, color, visited, tiles));
        }
      }

      return matches;
    }

    // Обработка перемещения плиток
    let draggedTile = null;

    gameContainer.addEventListener('mousedown', (e) => {
      draggedTile = e.target.closest('.tile');
    });

    gameContainer.addEventListener('mousemove', (e) => {
      if (!draggedTile) return;
      const targetTile = document.elementFromPoint(e.clientX, e.clientY);
      if (targetTile && targetTile.classList.contains('tile')) {
        swapTiles(draggedTile, targetTile);
      }
    });

    gameContainer.addEventListener('mouseup', () => {
      draggedTile = null;
    });

    function swapTiles(tile1, tile2) {
      const index1 = parseInt(tile1.dataset.index);
      const index2 = parseInt(tile2.dataset.index);

      if (!isValidMove(index1, index2)) return;

      const tempColor = tile1.classList[1];
      tile1.classList.replace(tile1.classList[1], tile2.classList[1]);
      tile2.classList.replace(tile2.classList[1], tempColor);

      checkMatches(tile1, tile2);
    }

    function isValidMove(index1, index2) {
      const row1 = Math.floor(index1 / gridSize);
      const col1 = index1 % gridSize;
      const row2 = Math.floor(index2 / gridSize);
      const col2 = index2 % gridSize;

      return (
        (row1 === row2 && Math.abs(col1 - col2) === 1) || // Горизонтальное перемещение
        (col1 === col2 && Math.abs(row1 - row2) === 1)    // Вертикальное перемещение
      );
    }

    // Проверка совпадений с каскадом
    function checkMatches(tile1, tile2) {
      let anyMatches = true;

      while (anyMatches) {
        anyMatches = false;
        const tiles = Array.from(document.querySelectorAll('.tile'));
        const visited = new Set();
        const matches = [];

        for (let i = 0; i < tiles.length; i++) {
          const match = findMatch(i, tiles[i].classList[1], visited, tiles);
          if (match.length >= 3) {
            matches.push(...match);
            anyMatches = true;
          }
        }

        if (matches.length > 0) {
          removeMatch(matches);
        }
      }

      rearrangeTiles();
    }

    // Удаление совпадений
    function removeMatch(matchedIndices) {
      matchedIndices.forEach((index) => {
        const tile = gameContainer.children[index];
        tile.classList.remove(tile.classList[1]);
        tile.style.animation = 'fade-out 0.5s ease forwards';
        setTimeout(() => (tile.style.animation = ''), 500);
      });

      score += matchedIndices.length * 10;
      scoreDisplay.textContent = score;
    }

    // Перераспределение плиток
    function rearrangeTiles() {
      const tiles = Array.from(document.querySelectorAll('.tile'));

      for (let col = 0; col < gridSize; col++) {
        let emptySpaces = 0;

        for (let row = gridSize - 1; row >= 0; row--) {
          const index = row * gridSize + col;
          const tile = tiles[index];

          if (!tile.classList[1]) {
            emptySpaces++;
          } else if (emptySpaces > 0) {
            const currentColor = tile.classList[1];
            tile.classList.remove(currentColor);
            tiles[index - emptySpaces * gridSize].classList.add(currentColor);
            tile.classList.remove(currentColor);
          }
        }

        for (let i = 0; i < emptySpaces; i++) {
          const newIndex = i * gridSize + col;
          tiles[newIndex].classList.remove(tiles[newIndex].classList[1]);
          tiles[newIndex].classList.add(getRandomColor());
        }
      }
    }

    createGrid();
  </script>
</body>
</html>
