<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle & Dragons</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    .game {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(7, 50px);
      gap: 2px;
    }
    .tile {
      width: 50px;
      height: 50px;
    }
    .tile.nover {
      pointer-events: none;
    }
    .color1 { background-color: red; }
    .color2 { background-color: blue; }
    .color3 { background-color: green; }
    .color4 { background-color: yellow; }
    .color5 { background-color: purple; }
    .color6 { background-color: orange; }
  </style>
</head>
<body>
  <div class="game"></div>

  <script>
    const game = document.querySelector('.game');
    const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
    const board = [];
    const rows = 7;
    const cols = 6;

    function createBoard() {
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          const tile = document.createElement('div');
          tile.classList.add('tile');
          const color = colors[Math.floor(Math.random() * colors.length)];
          tile.classList.add(color);
          game.appendChild(tile);
          row.push(color);
          tile.dataset.row = r;
          tile.dataset.col = c;
          tile.addEventListener('click', () => selectTile(tile));
        }
        board.push(row);
      }
    }

    let selectedTile = null;

    function selectTile(tile) {
      if (selectedTile === tile) {
        tile.classList.toggle('nover');
        selectedTile = null;
      } else if (selectedTile) {
        const row1 = parseInt(selectedTile.dataset.row);
        const col1 = parseInt(selectedTile.dataset.col);
        const row2 = parseInt(tile.dataset.row);
        const col2 = parseInt(tile.dataset.col);

        if ((Math.abs(row1 - row2) === 1 && col1 === col2) || (Math.abs(col1 - col2) === 1 && row1 === row2)) {
          swapTiles(selectedTile, tile);
          checkMatches();
        }
        selectedTile.classList.remove('nover');
        selectedTile = null;
      } else {
        selectedTile = tile;
        tile.classList.add('nover');
      }
    }

    function swapTiles(tile1, tile2) {
      [tile1.classList[1], tile2.classList[1]] = [tile2.classList[1], tile1.classList[1]];
      const row1 = parseInt(tile1.dataset.row);
      const col1 = parseInt(tile1.dataset.col);
      const row2 = parseInt(tile2.dataset.row);
      const col2 = parseInt(tile2.dataset.col);

      board[row1][col1] = tile2.classList[1];
      board[row2][col2] = tile1.classList[1];
    }

    function checkMatches() {
      let hasMatch = false;

      // Check horizontal matches
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c <= cols - 3; c++) {
          if (board[r][c] && board[r][c] === board[r][c + 1] && board[r][c] === board[r][c + 2]) {
            removeMatch(r, c, r, c + 2);
            hasMatch = true;
          }
        }
      }

      // Check vertical matches
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r <= rows - 3; r++) {
          if (board[r][c] && board[r][c] === board[r + 1][c] && board[r][c] === board[r + 2][c]) {
            removeMatch(r, c, r + 2, c);
            hasMatch = true;
          }
        }
      }

      // Check L-shaped matches
      for (let r = 0; r <= rows - 2; r++) {
        for (let c = 0; c <= cols - 2; c++) {
          if (board[r][c] && board[r][c] === board[r][c + 1] && board[r][c] === board[r + 1][c]) {
            removeMatch(r, c, r + 1, c + 1);
            hasMatch = true;
          }
        }
      }

      // Check T-shaped matches
      for (let r = 1; r <= rows - 2; r++) {
        for (let c = 1; c <= cols - 2; c++) {
          if (board[r][c] && board[r][c] === board[r - 1][c] && board[r][c] === board[r + 1][c] && board[r][c] === board[r][c - 1]) {
            removeMatch(r - 1, c, r + 1, c - 1);
            hasMatch = true;
          }
        }
      }

      if (hasMatch) {
        setTimeout(() => {
          checkMatches();
        }, 500);
      }
    }

    function removeMatch(r1, c1, r2, c2) {
      for (let r = r1; r <= r2; r++) {
        for (let c = c1; c <= c2; c++) {
          if (board[r] && board[r][c]) {
            const tile = game.children[r * cols + c];
            tile.classList.remove(board[r][c]);
            board[r][c] = '';
          }
        }
      }
    }

    createBoard();
  </script>
</body>
</html>
