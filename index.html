<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <style>
        /* Важно! Стиль игры сохранен в оригинальном виде */
        /* Все изменения будут касаться только логики игры, без изменения внешнего вида */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            grid-template-rows: repeat(6, 50px);
            gap: 2px;
        }
        .tile {
            width: 50px;
            height: 50px;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .red { background-color: red; color: white; }
        .blue { background-color: blue; color: white; }
        .green { background-color: green; color: white; }
        .yellow { background-color: yellow; color: black; }
        .purple { background-color: purple; color: white; }
    </style>
</head>
<body>

<div class="game-board" id="gameBoard"></div>

<script>
    // Основные настройки игры
    const boardSize = 6;
    const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
    
    // Создание игровой доски
    let board = [];
    const gameBoard = document.getElementById('gameBoard');

    function createBoard() {
        for (let i = 0; i < boardSize * boardSize; i++) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            const color = colors[Math.floor(Math.random() * colors.length)];
            tile.classList.add(color);
            tile.dataset.color = color;
            gameBoard.appendChild(tile);
            board.push(color);
        }
    }

    // Логика перетаскивания
    let selectedTile = null;

    gameBoard.addEventListener('click', (e) => {
        if (e.target.classList.contains('tile')) {
            if (selectedTile) {
                swapTiles(selectedTile, e.target);
                checkMatches(); // Проверка совпадений после каждого хода
                selectedTile = null;
            } else {
                selectedTile = e.target;
            }
        }
    });

    function swapTiles(tile1, tile2) {
        const tile1Color = tile1.dataset.color;
        const tile2Color = tile2.dataset.color;

        tile1.classList.remove(tile1Color);
        tile2.classList.remove(tile2Color);

        tile1.classList.add(tile2Color);
        tile2.classList.add(tile1Color);

        tile1.dataset.color = tile2Color;
        tile2.dataset.color = tile1Color;

        updateBoardArray();
    }

    function updateBoardArray() {
        board = Array.from(document.querySelectorAll('.tile')).map(tile => tile.dataset.color);
    }

    // Функция для проверки совпадений
    function checkMatches() {
        let hasMatches = false;

        // Проверка горизонтальных совпадений
        for (let row = 0; row < boardSize; row++) {
            for (let col = 0; col <= boardSize - 3; col++) {
                const index = row * boardSize + col;
                if (board[index] && 
                    board[index] === board[index + 1] && 
                    board[index] === board[index + 2]) {
                    clearMatch([index, index + 1, index + 2]);
                    hasMatches = true;
                }
            }
        }

        // Проверка вертикальных совпадений
        for (let col = 0; col < boardSize; col++) {
            for (let row = 0; row <= boardSize - 3; row++) {
                const index = row * boardSize + col;
                if (board[index] && 
                    board[index] === board[index + boardSize] && 
                    board[index] === board[index + boardSize * 2]) {
                    clearMatch([index, index + boardSize, index + boardSize * 2]);
                    hasMatches = true;
                }
            }
        }

        if (hasMatches) {
            setTimeout(() => refillBoard(), 500); // Задержка для анимации
        }
    }

    function clearMatch(indices) {
        indices.forEach(index => {
            const tile = document.querySelectorAll('.tile')[index];
            tile.classList.remove(board[index]);
            tile.dataset.color = '';
            board[index] = '';
        });
    }

    function refillBoard() {
        for (let i = 0; i < board.length; i++) {
            if (!board[i]) {
                const newColor = colors[Math.floor(Math.random() * colors.length)];
                const tile = document.querySelectorAll('.tile')[i];
                tile.classList.add(newColor);
                tile.dataset.color = newColor;
                board[i] = newColor;
            }
        }
    }

    createBoard();
</script>

</body>
</html>
