<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff; /* Minimally soft blue */
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; } /* Soft pink */
    .color2 { background: #b0e0e6; } /* Powder blue */
    .color3 { background: #fff8dc; } /* Lemon chiffon */
    .color4 { background: #d1e231; } /* Lime green */
    .color5 { background: #deb887; } /* Burlywood */
    .color6 { background: #add8e6; } /* Light blue */
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;

  // Create the game grid
  function createGrid() {
    for (let i = 0; i < gridSize * gridSize; i++) {
      const tile = document.createElement('div');
      tile.classList.add('tile', getRandomColor());
      tile.setAttribute('draggable', true);
      tile.addEventListener('click', selectTile);
      gameContainer.appendChild(tile);
      tiles.push(tile);
    }
    while (checkMatches()) {
      resetColors();
    }
  }

  // Get a random color from the colors array
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Select a tile to swap
  function selectTile(e) {
    if (!selectedTile) {
      selectedTile = e.target;
      selectedTile.style.border = '2px solid #000';
    } else {
      const currentTile = e.target;
      if (selectedTile !== currentTile) {
        const temp = selectedTile.classList[1];
        selectedTile.classList.replace(selectedTile.classList[1], currentTile.classList[1]);
        currentTile.classList.replace(currentTile.classList[1], temp);

        checkAndRemoveMatches();
      }
      selectedTile.style.border = '';
      selectedTile = null;
    }
  }

  // Check for matches in L, T, and straight line patterns
  function checkMatches() {
    const matches = [];

    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const index = row * gridSize + col;
        const color = tiles[index].classList[1];

        if (!color || color === 'empty') continue;

        // Horizontal matches
        if (col <= gridSize - 3 && 
            tiles[index].classList[1] === tiles[index + 1].classList[1] &&
            tiles[index].classList[1] === tiles[index + 2].classList[1]) {
          matches.push(index, index + 1, index + 2);
        }

        // Vertical matches
        if (row <= gridSize - 3 && 
            tiles[index].classList[1] === tiles[index + gridSize].classList[1] &&
            tiles[index].classList[1] === tiles[index + 2 * gridSize].classList[1]) {
          matches.push(index, index + gridSize, index + 2 * gridSize);
        }

        // L-shaped matches
        if (row <= gridSize - 2 && col <= gridSize - 2 && 
            tiles[index].classList[1] === tiles[index + gridSize].classList[1] &&
            tiles[index].classList[1] === tiles[index + gridSize + 1].classList[1] &&
            tiles[index].classList[1] === tiles[index + 1].classList[1]) {
          matches.push(index, index + gridSize, index + gridSize + 1, index + 1);
        }

        // T-shaped matches
        if (row <= gridSize - 2 && col >= 1 && col <= gridSize - 2 && 
            tiles[index].classList[1] === tiles[index + gridSize].classList[1] &&
            tiles[index].classList[1] === tiles[index + gridSize - 1].classList[1] &&
            tiles[index].classList[1] === tiles[index + gridSize + 1].classList[1]) {
          matches.push(index, index + gridSize, index + gridSize - 1, index + gridSize + 1);
        }
      }
    }

    return [...new Set(matches)];
  }

  // Remove matches and let tiles fall down
  function removeMatches(matches) {
    matches.forEach(index => {
      tiles[index].classList.remove(tiles[index].classList[1]);
      tiles[index].classList.add('empty');
    });

    for (let col = 0; col < gridSize; col++) {
      let emptySpaces = [];
      for (let row = gridSize - 1; row >= 0; row--) {
        const index = row * gridSize + col;
        if (tiles[index].classList.contains('empty')) {
          emptySpaces.push(index);
        } else if (emptySpaces.length > 0) {
          const topIndex = emptySpaces.shift();
          tiles[topIndex].classList.replace('empty', tiles[index].classList[1]);
          tiles[index].classList.remove(tiles[index].classList[1]);
          tiles[index].classList.add('empty');
          emptySpaces.push(index);
        }
      }
    }
  }

  // Reset colors of all tiles
  function resetColors() {
    tiles.forEach(tile => {
      if (tile.classList.contains('empty')) {
        tile.classList.remove('empty');
        tile.classList.add(getRandomColor());
      }
    });
  }

  // Check and remove matches after each move
  function checkAndRemoveMatches() {
    let matches = checkMatches();
    if (matches.length > 0) {
      removeMatches(matches);
      setTimeout(() => {
        checkAndRemoveMatches(); // Recursive call with delay
      }, 500);
    } else {
      resetColors(); // Fill empty spaces with new tiles
    }
  }

  // Initialize the game
  createGrid();
</script>

</body>
</html>
