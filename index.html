<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      position: relative;
    }

    .tile:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }

    .tile.fade-out {
      animation: fadeOut 0.5s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; }
    }

    .tile.falling {
      animation: fall 0.5s ease-in-out;
    }

    @keyframes fall {
      from { transform: translateY(-50px); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let selectedTile = null;
  let isProcessing = false;

  // Двумерный массив для хранения плиток
  const grid = Array.from({ length: gridSize }, () => Array(gridSize));

  // Структура плитки с координатами
  class Tile {
    constructor(element, row, col) {
      this.element = element;
      this.row = row;
      this.col = col;
    }
  }

  // Создание игрового поля
  function createGrid() {
    gameContainer.innerHTML = '';
    tiles = [];
    grid.forEach((row, rowIndex) => {
      row.forEach((_, colIndex) => {
        const tileElement = document.createElement('div');
        tileElement.className = `tile ${getRandomColor()}`;
        tileElement.style.gridColumn = colIndex + 1;
        tileElement.style.gridRow = rowIndex + 1;
        tileElement.addEventListener('click', selectTile);
        gameContainer.appendChild(tileElement);
        
        const tile = new Tile(tileElement, rowIndex, colIndex);
        tiles.push(tile);
        grid[rowIndex][colIndex] = tile;
      });
    });
  }

  // Получение случайного цвета
  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  // Выбор плитки
  function selectTile(event) {
    if (isProcessing) return;
    const currentTile = tiles.find(tile => tile.element === event.target);

    if (!selectedTile) {
      selectedTile = currentTile;
    } else if (selectedTile !== currentTile) {
      swapAndCheck(selectedTile, currentTile);
    }
  }

  // Обмен и проверка
  async function swapAndCheck(tileA, tileB) {
    isProcessing = true;
    
    // Обмен местами в DOM
    swapDOMPositions(tileA, tileB);
    
    // Проверка совпадений
    const matches = await checkMatches();
    
    if (matches.length > 0) {
      await removeMatches(matches);
      await dropTiles();
      fillEmpty();
    } else {
      // Если нет совпадений - отменяем обмен
      swapDOMPositions(tileA, tileB);
      alert('Нет совпадений, попробуйте другой ход');
    }
    
    selectedTile = null;
    isProcessing = false;
  }

  // Физический обмен элементов в DOM
  function swapDOMPositions(tileA, tileB) {
    const tempRow = tileA.row;
    const tempCol = tileA.col;
    
    tileA.row = tileB.row;
    tileA.col = tileB.col;
    tileB.row = tempRow;
    tileB.col = tempCol;
    
    // Обновляем позиции
    tileA.element.style.gridColumn = tileA.col + 1;
    tileA.element.style.gridRow = tileA.row + 1;
    tileB.element.style.gridColumn = tileB.col + 1;
    tileB.element.style.gridRow = tileB.row + 1;
    
    // Обновляем массив
    grid[tileA.row][tileA.col] = tileA;
    grid[tileB.row][tileB.col] = tileB;
  }

  // Проверка совпадений
  function checkMatches() {
    const matches = new Set();
    
    // Горизонтальные
    for (let row = 0; row < gridSize; row++) {
      let currentColor = null;
      let count = 0;
      let startCol = 0;
      
      for (let col = 0; col < gridSize; col++) {
        const tile = grid[row][col];
        const color = tile.element.classList[1];
        
        if (color === currentColor) {
          count++;
        } else {
          if (count >= 3) addHorizontalMatches(row, startCol, col - 1);
          currentColor = color;
          count = 1;
          startCol = col;
        }
      }
      if (count >= 3) addHorizontalMatches(row, startCol, gridSize - 1);
    }

    // Вертикальные
    for (let col = 0; col < gridSize; col++) {
      let currentColor = null;
      let count = 0;
      let startRow = 0;
      
      for (let row = 0; row < gridSize; row++) {
        const tile = grid[row][col];
        const color = tile.element.classList[1];
        
        if (color === currentColor) {
          count++;
        } else {
          if (count >= 3) addVerticalMatches(startRow, row - 1, col);
          currentColor = color;
          count = 1;
          startRow = row;
        }
      }
      if (count >= 3) addVerticalMatches(startRow, gridSize - 1, col);
    }

    return Array.from(matches);
  }

  // Добавление горизонтальных совпадений
  function addHorizontalMatches(row, startCol, endCol) {
    for (let col = startCol; col <= endCol; col++) {
      const tile = grid[row][col];
      if (tile) matches.add(tile);
    }
  }

  // Добавление вертикальных совпадений
  function addVerticalMatches(startRow, endRow, col) {
    for (let row = startRow; row <= endRow; row++) {
      const tile = grid[row][col];
      if (tile) matches.add(tile);
    }
  }

  // Удаление совпадений
  async function removeMatches(matches) {
    matches.forEach(tile => {
      tile.element.classList.add('fade-out');
      setTimeout(() => {
        grid[tile.row][tile.col] = null;
      }, 500);
    });
    
    await new Promise(resolve => setTimeout(resolve, 500));
    matches.forEach(tile => tile.element.remove());
    
    tiles = tiles.filter(tile => !matches.has(tile));
  }

  // Падение плиток
  async function dropTiles() {
    for (let col = 0; col < gridSize; col++) {
      for (let row = gridSize - 1; row >= 0; row--) {
        if (!grid[row][col]) {
          for (let i = row - 1; i >= 0; i--) {
            if (grid[i][col]) {
              const tile = grid[i][col];
              tile.row = row;
              tile.col = col;
              grid[row][col] = tile;
              grid[i][col] = null;
              tile.element.style.transform = `translateY(${(row - i) * 50}px)`;
              break;
            }
          }
        }
      }
    }
    
    await new Promise(resolve => setTimeout(resolve, 500));
    
    // Обновление позиций после анимации
    grid.forEach((row, rowIndex) => {
      row.forEach((tile, colIndex) => {
        if (tile) {
          tile.row = rowIndex;
          tile.col = colIndex;
          tile.element.style.transform = '';
          tile.element.style.gridColumn = colIndex + 1;
          tile.element.style.gridRow = rowIndex + 1;
        }
      });
    });
  }

  // Заполнение пустых ячеек
  function fillEmpty() {
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        if (!grid[row][col]) {
          const newTile = new Tile(
            document.createElement('div'),
            row,
            col
          );
          newTile.element.className = `tile ${getRandomColor()}`;
          newTile.element.style.gridColumn = col + 1;
          newTile.element.style.gridRow = row + 1;
          newTile.element.addEventListener('click', selectTile);
          gameContainer.appendChild(newTile.element);
          grid[row][col] = newTile;
          tiles.push(newTile);
        }
      }
    }
  }

  // Инициализация
  createGrid();
</script>

</body>
</html>
