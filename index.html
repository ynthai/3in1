<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f8ff;
      font-family: 'Helvetica', sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .tile {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-in-out, transform 0.5s ease-out;
      position: relative;
    }

    .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .color1 { background: #ffcccb; }
    .color2 { background: #b0e0e6; }
    .color3 { background: #fff8dc; }
    .color4 { background: #d1e231; }
    .color5 { background: #deb887; }
    .color6 { background: #add8e6; }

    /* Анимация удаления */
    .tile.removing {
      animation: removeTile 0.5s forwards;
    }
    @keyframes removeTile {
      to {
        transform: scale(0.1);
        opacity: 0;
      }
    }

    /* Анимация появления */
    .tile.falling {
      animation: fallTile 0.5s ease-out forwards;
    }
    @keyframes fallTile {
      from {
        transform: translateY(-100%);
      }
      to {
        transform: translateY(0);
      }
    }

    /* Анимация новых плиток */
    .tile.new {
      animation: appearTile 0.5s ease-out forwards;
    }
    @keyframes appearTile {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
<div class="game-container" id="game-container"></div>

<script>
  const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
  const gridSize = 6;
  const gameContainer = document.getElementById('game-container');
  let tiles = [];
  let grid = Array.from({ length: gridSize }, () => Array(gridSize));
  let selectedTile = null;
  let isProcessing = false;

  function createGrid() {
    tiles = Array.from({ length: gridSize * gridSize }, (_, i) => {
      const tile = document.createElement('div');
      tile.classList.add('tile', getRandomColor());
      tile.style.gridColumn = (i % gridSize) + 1;
      tile.style.gridRow = Math.floor(i / gridSize) + 1;
      tile.setAttribute('data-row', Math.floor(i / gridSize));
      tile.setAttribute('data-col', i % gridSize);
      tile.addEventListener('click', selectTile);
      gameContainer.appendChild(tile);
      return tile;
    });

    // Перестраиваем сетку в двумерный массив
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const index = row * gridSize + col;
        grid[row][col] = tiles[index];
      }
    }
  }

  function getRandomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
  }

  function selectTile(e) {
    if (isProcessing) return;
    const currentTile = e.target;
    
    if (!selectedTile) {
      selectedTile = currentTile;
      selectedTile.style.border = '2px solid #000';
    } else {
      const row1 = parseInt(selectedTile.getAttribute('data-row'));
      const col1 = parseInt(selectedTile.getAttribute('data-col'));
      const row2 = parseInt(currentTile.getAttribute('data-row'));
      const col2 = parseInt(currentTile.getAttribute('data-col'));

      // Проверяем, что плитки соседние
      if (
        (Math.abs(row1 - row2) === 1 && col1 === col2) || 
        (Math.abs(col1 - col2) === 1 && row1 === row2)
      ) {
        // Обмен классами
        const temp = selectedTile.classList[1];
        selectedTile.classList.replace(selectedTile.classList[1], currentTile.classList[1]);
        currentTile.classList.replace(currentTile.classList[1], temp);

        // Обновляем данные
        grid[row1][col1] = currentTile;
        grid[row2][col2] = selectedTile;

        checkMatches();
      }

      selectedTile.style.border = '';
      selectedTile = null;
    }
  }

  async function checkMatches() {
    if (isProcessing) return;
    isProcessing = true;

    const matches = findMatches();
    
    if (matches.size === 0) {
      isProcessing = false;
      return;
    }

    // Удаляем совпадения
    await removeMatches(matches);
    
    // Падение плиток
    await fallTiles();

    // Добавляем новые плитки
    addNewTiles();

    isProcessing = false;
  }

  function findMatches() {
    const matches = new Set();
    
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const currentColor = grid[row][col].classList[1];
        
        // Проверяем горизонтальные
        let horizontalCount = 1;
        for (let c = col + 1; c < gridSize; c++) {
          if (grid[row][c].classList[1] === currentColor) horizontalCount++;
          else break;
        }
        if (horizontalCount >= 3) {
          for (let c = 0; c < horizontalCount; c++) {
            matches.add(grid[row][col + c]);
          }
        }

        // Проверяем вертикальные
        let verticalCount = 1;
        for (let r = row + 1; r < gridSize; r++) {
          if (grid[r][col].classList[1] === currentColor) verticalCount++;
          else break;
        }
        if (verticalCount >= 3) {
          for (let r = 0; r < verticalCount; r++) {
            matches.add(grid[row + r][col]);
          }
        }
      }
    }

    return matches;
  }

  async function removeMatches(matches) {
    matches.forEach(tile => tile.classList.add('removing'));
    await new Promise(resolve => setTimeout(resolve, 500));
    matches.forEach(tile => {
      tile.remove();
      const row = parseInt(tile.getAttribute('data-row'));
      const col = parseInt(tile.getAttribute('data-col'));
      grid[row][col] = null;
    });
  }

  async function fallTiles() {
    for (let col = 0; col < gridSize; col++) {
      for (let row = gridSize - 1; row >= 0; row--) {
        if (!grid[row][col]) {
          for (let r = row - 1; r >= 0; r--) {
            if (grid[r][col]) {
              // Перемещаем плитку вниз
              const movingTile = grid[r][col];
              movingTile.style.gridColumn = col + 1;
              movingTile.style.gridRow = row + 1;
              movingTile.setAttribute('data-row', row);
              movingTile.classList.add('falling');

              // Обновляем данные
              grid[row][col] = movingTile;
              grid[r][col] = null;

              await new Promise(resolve => setTimeout(resolve, 500));
              movingTile.classList.remove('falling');
              break;
            }
          }
        }
      }
    }
  }

  function addNewTiles() {
    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        if (!grid[row][col]) {
          const newTile = document.createElement('div');
          newTile.classList.add('tile', getRandomColor());
          newTile.style.gridColumn = col + 1;
          newTile.style.gridRow = row + 1;
          newTile.style.transform = 'translateY(-100%)';
          newTile.setAttribute('data-row', row);
          newTile.setAttribute('data-col', col);
          newTile.addEventListener('click', selectTile);
          gameContainer.appendChild(newTile);

          // Анимация появления
          setTimeout(() => {
            newTile.classList.add('new');
            newTile.style.transform = '';
          }, 10);

          grid[row][col] = newTile;
        }
      }
    }
  }

  createGrid();
</script>
</body>
</html>
