<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
            gap: 5px;
        }

        .cell {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        /* Анимация исчезновения */
        .fade-out {
            animation: fadeOut 0.3s ease-in-out forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: scale(0.5);
            }
        }

        /* Анимация падения */
        .fall-down {
            animation: fallDown 0.5s ease-in-out;
        }

        @keyframes fallDown {
            from {
                transform: translateY(-50px);
            }
            to {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div id="game-board" class="board"></div>

    <script>
        const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
        const rows = 8;
        const cols = 8;

        // Генерация случайного цвета
        function getRandomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Генерация игрового поля
        function generateBoard() {
            const board = [];
            for (let row = 0; row < rows; row++) {
                board[row] = [];
                for (let col = 0; col < cols; col++) {
                    board[row][col] = getRandomColor();
                }
            }
            return board;
        }

        // Отрисовка игрового поля
        function drawBoard(board) {
            const gameBoard = document.getElementById('game-board');
            gameBoard.innerHTML = '';
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.style.backgroundColor = board[row][col];
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    gameBoard.appendChild(cell);
                }
            }
        }

        // Проверка совпадений
        function checkMatches(board) {
            const matches = [];

            // Проверка горизонтальных совпадений
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols - 2; col++) {
                    if (board[row][col] && board[row][col] === board[row][col + 1] && board[row][col] === board[row][col + 2]) {
                        matches.push({ row, col });
                        matches.push({ row, col + 1 });
                        matches.push({ row, col + 2 });
                    }
                }
            }

            // Проверка вертикальных совпадений
            for (let col = 0; col < cols; col++) {
                for (let row = 0; row < rows - 2; row++) {
                    if (board[row][col] && board[row][col] === board[row + 1][col] && board[row][col] === board[row + 2][col]) {
                        matches.push({ row, col });
                        matches.push({ row + 1, col });
                        matches.push({ row + 2, col });
                    }
                }
            }

            return matches;
        }

        // Удаление совпадений
        function removeMatches(matches, board) {
            matches.forEach(({ row, col }) => {
                board[row][col] = null;
                const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                if (cell) {
                    cell.classList.add('fade-out'); // Добавляем анимацию исчезновения
                    setTimeout(() => {
                        cell.remove();
                    }, 300); // Удаляем элемент после завершения анимации
                }
            });

            // Сдвиг элементов вниз
            for (let col = 0; col < cols; col++) {
                let emptyRow = rows - 1;
                for (let row = rows - 1; row >= 0; row--) {
                    if (board[row][col]) {
                        if (row !== emptyRow) {
                            board[emptyRow][col] = board[row][col];
                            board[row][col] = null;

                            // Анимация падения
                            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                            if (cell) {
                                cell.dataset.row = emptyRow;
                                cell.classList.add('fall-down');
                                setTimeout(() => {
                                    cell.classList.remove('fall-down');
                                }, 500);
                            }
                        }
                        emptyRow--;
                    }
                }
            }

            // Заполнение пустых ячеек
            for (let col = 0; col < cols; col++) {
                for (let row = 0; row < rows; row++) {
                    if (!board[row][col]) {
                        board[row][col] = getRandomColor();
                        const newCell = document.createElement('div');
                        newCell.classList.add('cell');
                        newCell.style.backgroundColor = board[row][col];
                        newCell.dataset.row = row;
                        newCell.dataset.col = col;
                        document.querySelector('.board').appendChild(newCell);
                    }
                }
            }
        }

        // Автоматическая проверка совпадений
        function autoCheckMatches(board) {
            setInterval(() => {
                const matches = checkMatches(board);
                if (matches.length > 0) {
                    removeMatches(matches, board);
                }
            }, 500);
        }

        // Инициализация игры
        function initGame() {
            const board = generateBoard();
            drawBoard(board);
            autoCheckMatches(board);
        }

        initGame();
    </script>
</body>
</html>
