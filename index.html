<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-gap: 2px;
        }
        .cell {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            background-color: white;
        }
        .red { background-color: red; }
        .blue { background-color: blue; }
        .green { background-color: green; }
        .yellow { background-color: yellow; }
        .purple { background-color: purple; }
        .orange { background-color: orange; }
    </style>
</head>
<body>

<div class="board" id="game-board"></div>

<script>
    const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
    const rows = 8;
    const cols = 8;
    let board = [];
    let isMoving = false;

    // Генерация случайного цвета
    function getRandomColor() {
        return colors[Math.floor(Math.random() * colors.length)];
    }

    // Создание игрового поля
    function generateBoard() {
        const newBoard = [];
        for (let row = 0; row < rows; row++) {
            newBoard[row] = [];
            for (let col = 0; col < cols; col++) {
                newBoard[row][col] = getRandomColor();
            }
        }
        return newBoard;
    }

    // Отображение игрового поля
    function drawBoard(board) {
        const gameBoard = document.getElementById('game-board');
        gameBoard.innerHTML = '';
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const cell = document.createElement('div');
                cell.classList.add('cell', board[row][col]);
                cell.dataset.row = row;
                cell.dataset.col = col;
                gameBoard.appendChild(cell);
            }
        }
    }

    // Проверка совпадений
    function checkMatches(board) {
        const matches = [];

        // Проверка горизонтальных совпадений
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols - 2; col++) {
                if (board[row][col] && board[row][col] === board[row][col + 1] && board[row][col] === board[row][col + 2]) {
                    matches.push({ row, col });
                    matches.push({ row, col + 1 });
                    matches.push({ row, col + 2 });
                }
            }
        }

        // Проверка вертикальных совпадений
        for (let col = 0; col < cols; col++) {
            for (let row = 0; row < rows - 2; row++) {
                if (board[row][col] && board[row][col] === board[row + 1][col] && board[row][col] === board[row + 2][col]) {
                    matches.push({ row, col });
                    matches.push({ row + 1, col });
                    matches.push({ row + 2, col });
                }
            }
        }

        // Проверка "T"-образных совпадений
        for (let row = 0; row < rows - 1; row++) {
            for (let col = 1; col < cols - 1; col++) {
                if (board[row][col] && board[row][col] === board[row][col - 1] && board[row][col] === board[row][col + 1] && board[row][col] === board[row + 1][col]) {
                    matches.push({ row, col - 1 });
                    matches.push({ row, col });
                    matches.push({ row, col + 1 });
                    matches.push({ row + 1, col });
                }
            }
        }

        return matches;
    }

    // Удаление совпадений
    function removeMatches(matches, board) {
        matches.forEach(({ row, col }) => {
            board[row][col] = null;
        });

        // Сдвиг элементов сверху вниз
        for (let col = 0; col < cols; col++) {
            let emptyRow = rows - 1;
            for (let row = rows - 1; row >= 0; row--) {
                if (board[row][col] !== null) {
                    board[emptyRow][col] = board[row][col];
                    if (row !== emptyRow) {
                        board[row][col] = null;
                    }
                    emptyRow--;
                }
            }
        }

        // Заполнение пустых ячеек новыми элементами
        for (let col = 0; col < cols; col++) {
            for (let row = 0; row < rows; row++) {
                if (board[row][col] === null) {
                    board[row][col] = getRandomColor();
                }
            }
        }
    }

    // Автоматическая проверка совпадений
    function autoCheckMatches() {
        setInterval(() => {
            if (!isMoving) {
                const matches = checkMatches(board);
                if (matches.length > 0) {
                    removeMatches(matches, board);
                    drawBoard(board);
                }
            }
        }, 500); // Интервал в 0.5 секунды
    }

    // Обработка кликов
    let selectedCell = null;
    document.getElementById('game-board').addEventListener('click', (e) => {
        if (isMoving) return;

        const target = e.target;
        if (!target.classList.contains('cell')) return;

        const row = parseInt(target.dataset.row);
        const col = parseInt(target.dataset.col);

        if (selectedCell) {
            const selectedRow = parseInt(selectedCell.dataset.row);
            const selectedCol = parseInt(selectedCell.dataset.col);

            if (
                (Math.abs(row - selectedRow) === 1 && col === selectedCol) || 
                (Math.abs(col - selectedCol) === 1 && row === selectedRow)
            ) {
                // Меняем местами ячейки
                isMoving = true;
                [board[row][col], board[selectedRow][selectedCol]] = [board[selectedRow][selectedCol], board[row][col]];

                drawBoard(board);

                // Проверяем совпадения после хода
                setTimeout(() => {
                    const matches = checkMatches(board);
                    if (matches.length === 0) {
                        // Если нет совпадений, возвращаем ячейки обратно
                        [board[row][col], board[selectedRow][selectedCol]] = [board[selectedRow][selectedCol], board[row][col]];
                        drawBoard(board);
                    } else {
                        removeMatches(matches, board);
                        drawBoard(board);
                    }
                    isMoving = false;
                }, 300); // Добавляем небольшую задержку для анимации
            }

            selectedCell.classList.remove('selected');
            selectedCell = null;
        } else {
            selectedCell = target;
            selectedCell.classList.add('selected');
        }
    });

    // Инициализация игры
    function initGame() {
        board = generateBoard();
        drawBoard(board);
        autoCheckMatches();
    }

    initGame();
</script>

</body>
</html>
