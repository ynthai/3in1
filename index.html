<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ... (остальные метатеги и стили без изменений) -->
</head>
<body>
<div class="game-container" id="game-container"></div>

<script>
const colors = ['color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
const gridSize = 6;
const gameContainer = document.getElementById('game-container');
let tiles = [];
let selectedTile = null;
let isProcessing = false;

// Исправленная функция создания сетки
function createGrid() {
  gameContainer.innerHTML = '';
  tiles = [];
  for (let i = 0; i < gridSize * gridSize; i++) {
    const tile = document.createElement('div');
    tile.classList.add('tile', getRandomColor());
    tile.setAttribute('draggable', true);
    tile.addEventListener('click', selectTile);
    gameContainer.appendChild(tile);
    tiles.push(tile);
  }
}

// Исправленная функция падения плиток
async function fallTiles(removedIndices) {
  // Создаем копию текущей сетки
  const gridCopy = tiles.map(tile => tile.classList[1]);

  // Определяем позиции пустых ячеек
  const emptyCells = removedIndices.map(index => {
    const row = Math.floor(index / gridSize);
    const col = index % gridSize;
    return { row, col };
  });

  // Перемещаем плитки вниз
  for (let col = 0; col < gridSize; col++) {
    let emptyCount = 0;
    for (let row = gridSize - 1; row >= 0; row--) {
      const index = row * gridSize + col;
      if (gridCopy[index] === 'empty') emptyCount++;
      else {
        if (emptyCount > 0) {
          const targetRow = row + emptyCount;
          const targetIndex = targetRow * gridSize + col;
          tiles[targetIndex].style.transform = `translateY(${(row - targetRow)*55}px)`;
          gridCopy[targetIndex] = gridCopy[index];
          gridCopy[index] = 'empty';
        }
      }
    }
  }

  // Обновляем сетку
  tiles = gridCopy.map((color, index) => {
    const tile = document.createElement('div');
    tile.classList.add('tile', color);
    return tile;
  });
  updateGrid();
}

// Функция обновления сетки
function updateGrid() {
  gameContainer.innerHTML = '';
  tiles.forEach(tile => {
    gameContainer.appendChild(tile);
    tile.style.transform = '';
  });
}

// Исправленная генерация новых плиток
async function generateNewTiles() {
  // Заполняем пустые места
  tiles = tiles.map(tile => {
    if (tile.classList.contains('empty')) {
      const newTile = document.createElement('div');
      newTile.classList.add('tile', getRandomColor());
      return newTile;
    }
    return tile;
  });
  updateGrid();
}

// Основная функция обработки хода
async function processMove() {
  if (isProcessing) return;
  isProcessing = true;

  let hasMatches = true;
  while (hasMatches) {
    const matches = checkMatches();
    if (matches.length === 0) break;

    // Удаляем плитки
    const removedIndices = await removeMatches(matches);
    await fallTiles(removedIndices);
    await generateNewTiles();
    
    // Проверяем новые совпадения
    hasMatches = checkMatches().length > 0;
  }

  isProcessing = false;
}

// Исправленная проверка совпадений
function checkMatches() {
  const grid = tiles.map(tile => tile.classList[1]);
  const matches = [];

  // Горизонтальные
  for (let row = 0; row < gridSize; row++) {
    for (let col = 0; col < gridSize - 2; col++) {
      const index = row * gridSize + col;
      if (grid[index] && grid[index] === grid[index+1] && grid[index] === grid[index+2]) {
        matches.push({ type: 'horizontal', start: index, count: 3 });
      }
    }
  }

  // Вертикальные
  for (let col = 0; col < gridSize; col++) {
    for (let row = 0; row < gridSize - 2; row++) {
      const index = row * gridSize + col;
      if (grid[index] && grid[index] === grid[index+gridSize] && grid[index] === grid[index+2*gridSize]) {
        matches.push({ type: 'vertical', start: index, count: 3 });
      }
    }
  }

  return matches;
}

// Упрощенная функция удаления
async function removeMatches(matches) {
  const removed = new Set();
  matches.forEach(match => {
    for (let i = 0; i < match.count; i++) {
      removed.add(match.start + (match.type === 'vertical' ? i*gridSize : i));
    }
  });

  if (removed.size === 0) return [];

  // Анимация удаления
  removed.forEach(index => {
    tiles[index].style.animation = 'fadeOut 0.5s forwards';
  });

  await new Promise(r => setTimeout(r, 500));

  // Удаляем плитки
  const newTiles = tiles.map((tile, i) => 
    removed.has(i) ? { classList: { 1: 'empty' } } : tile
  );

  tiles = newTiles.map(t => 
    document.createElement('div').classList.add('tile', t.classList[1])
  );

  return Array.from(removed);
}

// Исправленный обработчик клика
function selectTile(e) {
  if (isProcessing) return;
  const currentTile = e.target;
  if (selectedTile && selectedTile !== currentTile) {
    // Обмен плиток
    const temp = selectedTile.classList[1];
    selectedTile.classList.replace(selectedTile.classList[1], currentTile.classList[1]);
    currentTile.classList.replace(currentTile.classList[1], temp);
    
    selectedTile.style.border = '';
    selectedTile = null;
    
    // Обработка хода
    processMove();
  } else {
    selectedTile = selectedTile === currentTile ? null : currentTile;
    selectedTile?.style.border = selectedTile ? '2px solid #000' : '';
  }
}

// Инициализация
createGrid();
</script>
</body>
</html>
