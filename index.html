<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Dagons</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(6, 50px);
      grid-template-rows: repeat(7, 50px);
      gap: 2px;
      background-color: #ddd;
      padding: 10px;
      border-radius: 10px;
    }
    .tile {
      width: 50px;
      height: 50px;
      background-color: #fff;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .tile.nover {
      pointer-events: none;
    }
    .color.red { background-color: red; }
    .color.blue { background-color: blue; }
    .color.green { background-color: green; }
    .color.yellow { background-color: yellow; }
    .color.purple { background-color: purple; }
    .color.orange { background-color: orange; }
  </style>
</head>
<body>
  <div class="container" id="game"></div>

  <script>
    const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
    const rows = 7, cols = 6;
    const board = Array.from({ length: rows }, () => Array(cols).fill(null));
    const gameContainer = document.getElementById('game');

    function createBoard() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const tile = document.createElement('div');
          tile.classList.add('tile');
          tile.dataset.row = r;
          tile.dataset.col = c;
          tile.addEventListener('click', () => selectTile(r, c));
          gameContainer.appendChild(tile);
        }
      }
      refillBoard();
    }

    function refillBoard() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!board[r][c]) {
            board[r][c] = colors[Math.floor(Math.random() * colors.length)];
            const tile = gameContainer.children[r * cols + c];
            tile.classList.add('color', board[r][c]);
          }
        }
      }
      checkAndRemoveMatches();
    }

    let selectedTile = null;

    function selectTile(row, col) {
      if (selectedTile) {
        swapTiles(selectedTile, { row, col });
        selectedTile = null;
      } else {
        selectedTile = { row, col };
      }
    }

    function swapTiles(pos1, pos2) {
      const temp = board[pos1.row][pos1.col];
      board[pos1.row][pos1.col] = board[pos2.row][pos2.col];
      board[pos2.row][pos2.col] = temp;

      const tile1 = gameContainer.children[pos1.row * cols + pos1.col];
      const tile2 = gameContainer.children[pos2.row * cols + pos2.col];

      tile1.classList.remove(...colors);
      tile2.classList.remove(...colors);

      tile1.classList.add('color', board[pos1.row][pos1.col]);
      tile2.classList.add('color', board[pos2.row][pos2.col]);

      checkAndRemoveMatches(() => {
        if (!hasMatches()) {
          swapTiles(pos1, pos2); // Swap back if no matches
        }
      });
    }

    function hasMatches() {
      return findMatches().length > 0;
    }

    function findMatches() {
      const matches = [];

      // Horizontal matches
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c <= cols - 3; c++) {
          if (board[r][c] && board[r][c] === board[r][c + 1] && board[r][c] === board[r][c + 2]) {
            matches.push({ type: 'horizontal', positions: [{ r, c }, { r, c + 1 }, { r, c + 2 }] });
          }
        }
      }

      // Vertical matches
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r <= rows - 3; r++) {
          if (board[r][c] && board[r][c] === board[r + 1][c] && board[r][c] === board[r + 2][c]) {
            matches.push({ type: 'vertical', positions: [{ r, c }, { r + 1, c }, { r + 2, c }] });
          }
        }
      }

      // L-shaped matches
      for (let r = 0; r <= rows - 2; r++) {
        for (let c = 0; c <= cols - 2; c++) {
          if (
            board[r][c] &&
            board[r][c] === board[r][c + 1] &&
            board[r][c] === board[r + 1][c]
          ) {
            matches.push({ type: 'L', positions: [{ r, c }, { r, c + 1 }, { r + 1, c }] });
          }
        }
      }

      // T-shaped matches
      for (let r = 1; r < rows - 1; r++) {
        for (let c = 1; c < cols - 1; c++) {
          if (
            board[r][c] &&
            board[r][c] === board[r - 1][c] &&
            board[r][c] === board[r + 1][c] &&
            board[r][c] === board[r][c - 1] &&
            board[r][c] === board[r][c + 1]
          ) {
            matches.push({ type: 'T', positions: [{ r, c }, { r - 1, c }, { r + 1, c }, { r, c - 1 }, { r, c + 1 }] });
          }
        }
      }

      return matches;
    }

    function removeMatches(matches, callback) {
      matches.forEach(match => {
        match.positions.forEach(({ r, c }) => {
          board[r][c] = null;
          const tile = gameContainer.children[r * cols + c];
          tile.classList.remove(...colors);
          tile.style.backgroundColor = '#ddd';
        });
      });

      setTimeout(() => {
        refillBoard();
        if (callback) callback();
      }, 500); // Delay of 0.5 seconds
    }

    function checkAndRemoveMatches(callback) {
      const matches = findMatches();
      if (matches.length > 0) {
        removeMatches(matches, () => checkAndRemoveMatches(callback));
      } else if (callback) {
        callback();
      }
    }

    createBoard();
  </script>
</body>
</html>
