<!-- Стиль игры сохранен в виде простой минималистичной сетки с яркими цветами для гемов -->
<!-- Все изменения будут следовать этому стилю, чтобы сохранить консистентность визуального дизайна -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Dragons</title>
    <style>
        /* Базовый стиль игрового поля */
        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            grid-gap: 2px;
        }
        .gem {
            width: 50px;
            height: 50px;
            border-radius: 8px;
        }
        /* Цвета гемов сохранены в текущей палитре */
        .red { background-color: red; }
        .blue { background-color: blue; }
        .green { background-color: green; }
        .yellow { background-color: yellow; }
        .purple { background-color: purple; }
    </style>
</head>
<body>

<div id="game-board" class="game-board"></div>

<script>
    const boardSize = 6; // Размер игрового поля
    const colors = ['red', 'blue', 'green', 'yellow', 'purple']; // Доступные цвета гемов

    let board = [];

    // Создание начальной игровой доски
    function createBoard() {
        const gameBoard = document.getElementById('game-board');
        for (let row = 0; row < boardSize; row++) {
            board[row] = [];
            for (let col = 0; col < boardSize; col++) {
                const gemColor = colors[Math.floor(Math.random() * colors.length)];
                const gemElement = document.createElement('div');
                gemElement.classList.add('gem', gemColor);
                gemElement.setAttribute('data-row', row);
                gemElement.setAttribute('data-col', col);
                gemElement.setAttribute('draggable', true);
                gemElement.addEventListener('dragstart', dragStart);
                gemElement.addEventListener('dragover', dragOver);
                gemElement.addEventListener('drop', dropGem);
                gameBoard.appendChild(gemElement);
                board[row][col] = gemColor;
            }
        }
    }

    // Проверка совпадений после перемещения
    function checkMatches(row, col) {
        const colorToCheck = board[row][col];
        let matchCountRow = 1;
        let matchCountCol = 1;

        // Проверка по горизонтали
        for (let i = col + 1; i < boardSize && board[row][i] === colorToCheck; i++) {
            matchCountRow++;
        }
        for (let i = col - 1; i >= 0 && board[row][i] === colorToCheck; i--) {
            matchCountRow++;
        }

        // Проверка по вертикали
        for (let i = row + 1; i < boardSize && board[i][col] === colorToCheck; i++) {
            matchCountCol++;
        }
        for (let i = row - 1; i >= 0 && board[i][col] === colorToCheck; i--) {
            matchCountCol++;
        }

        if (matchCountRow >= 3 || matchCountCol >= 3) {
            console.log("Match found!");
            return true;
        }
        return false;
    }

    let draggedGem = null;

    function dragStart(e) {
        draggedGem = this;
        e.dataTransfer.setData("text/plain", '');
    }

    function dragOver(e) {
        e.preventDefault();
    }

    function dropGem(e) {
        const targetGem = this;
        const draggedRow = parseInt(draggedGem.getAttribute('data-row'));
        const draggedCol = parseInt(draggedGem.getAttribute('data-col'));
        const targetRow = parseInt(targetGem.getAttribute('data-row'));
        const targetCol = parseInt(targetGem.getAttribute('data-col'));

        if (Math.abs(draggedRow - targetRow) + Math.abs(draggedCol - targetCol) === 1) {
            // Меняем местами элементы на доске
            [board[draggedRow][draggedCol], board[targetRow][targetCol]] = 
                [board[targetRow][targetCol], board[draggedRow][draggedCol]];

            // Обновляем визуальное представление
            [draggedGem.className, targetGem.className] = 
                [targetGem.className, draggedGem.className];

            // Проверяем наличие совпадений
            if (!checkMatches(draggedRow, draggedCol) && !checkMatches(targetRow, targetCol)) {
                // Если совпадений нет, возвращаем все назад
                [board[draggedRow][draggedCol], board[targetRow][targetCol]] = 
                    [board[targetRow][targetCol], board[draggedRow][draggedCol]];
                [draggedGem.className, targetGem.className] = 
                    [targetGem.className, draggedGem.className];
            }
        }
    }

    createBoard();
</script>

</body>
</html>
