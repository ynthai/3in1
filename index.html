<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .game-container {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-template-rows: repeat(5, 60px);
      gap: 5px;
    }

    .tile {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
    }

    .red { background-color: #ff5733; color: white; }
    .blue { background-color: #335bff; color: white; }
    .green { background-color: #33ff57; color: white; }
    .yellow { background-color: #ffff33; color: black; }
    .purple { background-color: #b333ff; color: white; }

    .score-board {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="game-container" id="gameContainer"></div>
  <div class="score-board">Score: <span id="score">0</span></div>

  <script>
    const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
    const gridSize = 5;
    let score = 0;

    const gameContainer = document.getElementById('gameContainer');
    const scoreDisplay = document.getElementById('score');

    // Создаем игровое поле
    function createGrid() {
      for (let i = 0; i < gridSize * gridSize; i++) {
        const tile = document.createElement('div');
        tile.classList.add('tile', getRandomColor());
        tile.setAttribute('draggable', true);
        tile.dataset.index = i;
        tile.addEventListener('dragstart', dragStart);
        tile.addEventListener('dragover', dragOver);
        tile.addEventListener('drop', dropTile);
        gameContainer.appendChild(tile);
      }
    }

    function getRandomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    let draggedTile = null;

    function dragStart(e) {
      draggedTile = e.target;
      setTimeout(() => (e.target.style.visibility = 'hidden'), 0);
    }

    function dragOver(e) {
      e.preventDefault();
    }

    function dropTile(e) {
      const targetTile = e.target;

      if (!targetTile.classList.contains('tile')) return;

      const draggedIndex = parseInt(draggedTile.dataset.index);
      const targetIndex = parseInt(targetTile.dataset.index);

      const validMoves = [
        draggedIndex - 1,
        draggedIndex + 1,
        draggedIndex - gridSize,
        draggedIndex + gridSize,
      ];

      if (validMoves.includes(targetIndex)) {
        const draggedColor = draggedTile.classList[1];
        const targetColor = targetTile.classList[1];

        draggedTile.classList.remove(draggedColor);
        targetTile.classList.remove(targetColor);

        draggedTile.classList.add(targetColor);
        targetTile.classList.add(draggedColor);

        checkMatches();
      }

      draggedTile.style.visibility = 'visible';
    }

    function checkMatches() {
      const tiles = Array.from(document.querySelectorAll('.tile'));

      // Проверка горизонтальных совпадений
      for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col <= gridSize - 3; col++) {
          const firstTile = tiles[row * gridSize + col];
          const secondTile = tiles[row * gridSize + col + 1];
          const thirdTile = tiles[row * gridSize + col + 2];

          if (
            firstTile.classList[1] &&
            firstTile.classList[1] === secondTile.classList[1] &&
            secondTile.classList[1] === thirdTile.classList[1]
          ) {
            removeMatch([firstTile, secondTile, thirdTile]);
          }
        }
      }

      // Проверка вертикальных совпадений
      for (let col = 0; col < gridSize; col++) {
        for (let row = 0; row <= gridSize - 3; row++) {
          const firstTile = tiles[row * gridSize + col];
          const secondTile = tiles[(row + 1) * gridSize + col];
          const thirdTile = tiles[(row + 2) * gridSize + col];

          if (
            firstTile.classList[1] &&
            firstTile.classList[1] === secondTile.classList[1] &&
            secondTile.classList[1] === thirdTile.classList[1]
          ) {
            removeMatch([firstTile, secondTile, thirdTile]);
          }
        }
      }
    }

    function removeMatch(matchedTiles) {
      matchedTiles.forEach((tile) => {
        tile.classList.remove(tile.classList[1]);
        tile.classList.add(getRandomColor());
      });
      score += matchedTiles.length * 10;
      scoreDisplay.textContent = score;
    }

    createGrid();
  </script>
</body>
</html>
